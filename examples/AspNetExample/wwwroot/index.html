<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦀 Rust EtherNet/IP - ASP.NET Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .tag-value {
            font-family: 'Consolas', monospace;
        }
        .log-entry {
            font-family: 'Consolas', monospace;
            white-space: pre-wrap;
        }
        .connected {
            color: #10B981;
        }
        .disconnected {
            color: #EF4444;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">🦀 Rust EtherNet/IP Driver - ASP.NET Demo</h1>
                    <div class="mt-2">
                        <div class="flex items-center space-x-4">
                            <input type="text" id="plcAddress" placeholder="PLC Address" 
                                   class="px-4 py-2 border rounded-lg" value="192.168.0.1:44818">
                            <button id="connectBtn" class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600">
                                Connect
                            </button>
                            <button id="disconnectBtn" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600" disabled>
                                Disconnect
                            </button>
                        </div>
                    </div>
                </div>
                <div class="text-right">
                    <div id="connectionStatus" class="text-xl font-bold disconnected">Disconnected</div>
                    <div id="sessionId" class="text-sm text-gray-600">Session: None</div>
                </div>
            </div>
        </div>

        <!-- Performance Info -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex justify-between items-center">
                <div class="flex space-x-8">
                    <div>
                        <span class="text-gray-600">📊 Read Rate:</span>
                        <span id="readRate" class="font-bold">0 ops/sec</span>
                    </div>
                    <div>
                        <span class="text-gray-600">📝 Write Rate:</span>
                        <span id="writeRate" class="font-bold">0 ops/sec</span>
                    </div>
                </div>
                <button id="benchmarkBtn" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600" disabled>
                    Run Benchmark
                </button>
            </div>
        </div>

        <!-- UDT Testing Section -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-bold mb-4">🏗️ UDT (User Defined Type) Testing</h2>
            
            <!-- UDT Operations -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">UDT Name</label>
                    <input type="text" id="udtName" placeholder="Part_Data" 
                           class="w-full px-4 py-2 border rounded-lg" value="Part_Data">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Action</label>
                    <div class="flex space-x-2">
                        <button id="readUdtBtn" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600" disabled>
                            Read UDT
                        </button>
                        <button id="readUdtAsDictBtn" class="px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600" disabled>
                            Read as Dictionary
                        </button>
                    </div>
                </div>
            </div>

            <!-- Individual UDT Member Testing -->
            <div class="mb-4">
                <h3 class="text-lg font-semibold mb-2">Individual UDT Member Testing</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">UDT Member</label>
                        <select id="udtMemberSelect" class="w-full px-4 py-2 border rounded-lg">
                            <option value="Part_Data.oFuse_Serial_Number">Part_Data.oFuse_Serial_Number</option>
                            <option value="Part_Data.oFuse_Resistance">Part_Data.oFuse_Resistance</option>
                            <option value="Part_Data.oFuse_Weight">Part_Data.oFuse_Weight</option>
                            <option value="Part_Data.oMachine_Running">Part_Data.oMachine_Running</option>
                            <option value="Part_Data.oMachine_Ready">Part_Data.oMachine_Ready</option>
                            <option value="Part_Data.oProduction_Rate">Part_Data.oProduction_Rate</option>
                            <option value="Part_Data.iStart_Production">Part_Data.iStart_Production</option>
                            <option value="Part_Data.iTarget_Production">Part_Data.iTarget_Production</option>
                            <option value="Part_Data.iStop_Production">Part_Data.iStop_Production</option>
                            <option value="Part_Data.iReset_Production">Part_Data.iReset_Production</option>
                            <option value="Part_Data.iEmergency_Stop">Part_Data.iEmergency_Stop</option>
                            <option value="Part_Data.iMaintenance_Mode">Part_Data.iMaintenance_Mode</option>
                            <option value="Part_Data.iQuality_Check">Part_Data.iQuality_Check</option>
                            <option value="Part_Data.iCalibration_Required">Part_Data.iCalibration_Required</option>
                            <option value="Part_Data.iOperator_Override">Part_Data.iOperator_Override</option>
                            <option value="Part_Data.iSystem_Ready">Part_Data.iSystem_Ready</option>
                            <option value="Part_Data.iProduction_Complete">Part_Data.iProduction_Complete</option>
                            <option value="Part_Data.iError_State">Part_Data.iError_State</option>
                            <option value="Part_Data.iWarning_State">Part_Data.iWarning_State</option>
                            <option value="Part_Data.iData_Valid">Part_Data.iData_Valid</option>
                            <option value="Part_Data.iCommunication_OK">Part_Data.iCommunication_OK</option>
                            <option value="Part_Data.iSystem_Status">Part_Data.iSystem_Status</option>
                            <option value="Part_Data.iProduction_Count">Part_Data.iProduction_Count</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Action</label>
                        <div class="flex space-x-2">
                            <button id="readUdtMemberBtn" class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600" disabled>
                                Read Member
                            </button>
                            <button id="writeUdtMemberBtn" class="px-4 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600" disabled>
                                Write Member
                            </button>
                        </div>
                    </div>
                </div>
                <div class="mt-2">
                    <input type="text" id="udtMemberValue" placeholder="Value to write" 
                           class="w-full px-4 py-2 border rounded-lg">
                </div>
            </div>

            <!-- UDT Results -->
            <div class="mt-4">
                <h3 class="text-lg font-semibold mb-2">UDT Results</h3>
                <div id="udtResults" class="bg-gray-900 text-green-400 p-4 rounded-lg h-[300px] overflow-y-auto font-mono text-sm">
                    <!-- UDT results will be displayed here -->
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-6">
            <!-- Left Panel: Tag Monitoring -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-bold mb-4">📊 Tag Monitoring</h2>
                
                <!-- Tag Discovery -->
                <div class="mb-4">
                    <div class="flex space-x-2 mb-4">
                        <input type="text" id="tagToDiscover" placeholder="Tag to discover" 
                               class="flex-1 px-4 py-2 border rounded-lg">
                        <button id="discoverBtn" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600" disabled>
                            Discover Tag
                        </button>
                    </div>
                    
                    <div class="flex space-x-2">
                        <input type="text" id="tagName" placeholder="Tag name" 
                               class="flex-1 px-4 py-2 border rounded-lg">
                        <select id="dataType" class="px-4 py-2 border rounded-lg">
                            <option value="BOOL">BOOL</option>
                            <option value="DINT">DINT</option>
                            <option value="REAL">REAL</option>
                            <option value="STRING">STRING</option>
                        </select>
                        <input type="text" id="tagValue" placeholder="Value" 
                               class="flex-1 px-4 py-2 border rounded-lg">
                        <button id="readBtn" class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600" disabled>
                            Read
                        </button>
                        <button id="writeBtn" class="px-4 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600" disabled>
                            Write
                        </button>
                    </div>
                </div>

                <!-- Tags Table -->
                <div class="overflow-x-auto">
                    <table class="min-w-full">
                        <thead>
                            <tr class="bg-gray-50">
                                <th class="px-4 py-2 text-left">Tag Name</th>
                                <th class="px-4 py-2 text-left">Value</th>
                                <th class="px-4 py-2 text-left">Type</th>
                                <th class="px-4 py-2 text-left">Updated</th>
                            </tr>
                        </thead>
                        <tbody id="tagsTable">
                            <!-- Tags will be added here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Right Panel: Activity Log -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-bold mb-4">📝 Activity Log</h2>
                <div id="logContainer" class="bg-gray-900 text-green-400 p-4 rounded-lg h-[500px] overflow-y-auto">
                    <!-- Log entries will be added here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // State
        let isConnected = false;
        let sessionId = null;
        let tags = new Map();
        let refreshInterval = null;
        let retryCount = 0;
        const MAX_RETRIES = 3;
        const RETRY_DELAY = 2000; // 2 seconds

        // DOM Elements
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const benchmarkBtn = document.getElementById('benchmarkBtn');
        const discoverBtn = document.getElementById('discoverBtn');
        const readBtn = document.getElementById('readBtn');
        const writeBtn = document.getElementById('writeBtn');
        const plcAddress = document.getElementById('plcAddress');
        const tagToDiscover = document.getElementById('tagToDiscover');
        const tagName = document.getElementById('tagName');
        const dataType = document.getElementById('dataType');
        const tagValue = document.getElementById('tagValue');
        const connectionStatus = document.getElementById('connectionStatus');
        const sessionIdElement = document.getElementById('sessionId');
        const readRate = document.getElementById('readRate');
        const writeRate = document.getElementById('writeRate');
        const tagsTable = document.getElementById('tagsTable');
        const logContainer = document.getElementById('logContainer');
        
        // UDT Elements
        const udtName = document.getElementById('udtName');
        const readUdtBtn = document.getElementById('readUdtBtn');
        const readUdtAsDictBtn = document.getElementById('readUdtAsDictBtn');
        const udtMemberSelect = document.getElementById('udtMemberSelect');
        const readUdtMemberBtn = document.getElementById('readUdtMemberBtn');
        const writeUdtMemberBtn = document.getElementById('writeUdtMemberBtn');
        const udtMemberValue = document.getElementById('udtMemberValue');
        const udtResults = document.getElementById('udtResults');

        // Event Listeners
        connectBtn.addEventListener('click', connect);
        disconnectBtn.addEventListener('click', disconnect);
        benchmarkBtn.addEventListener('click', runBenchmark);
        discoverBtn.addEventListener('click', discoverTag);
        readBtn.addEventListener('click', readTag);
        writeBtn.addEventListener('click', writeTag);
        
        // UDT Event Listeners
        readUdtBtn.addEventListener('click', readUdt);
        readUdtAsDictBtn.addEventListener('click', readUdtAsDictionary);
        readUdtMemberBtn.addEventListener('click', readUdtMember);
        writeUdtMemberBtn.addEventListener('click', writeUdtMember);

        // Functions
        async function connect() {
            try {
                if (!plcAddress.value.trim()) {
                    log('❌ Please enter a PLC address');
                    return;
                }

                log('🔌 Connecting to PLC...');
                connectBtn.disabled = true;
                
                const response = await fetch('/api/plc/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ Address: plcAddress.value.trim() })
                });
                
                const data = await response.json();
                console.log('Connection response:', data);
                
                if (data.success) {
                    isConnected = true;
                    sessionId = data.sessionId;
                    updateConnectionStatus();
                    
                    // Start refresh first
                    startRefresh();
                    log(`✅ Connected! Session ID: ${sessionId}`);
                    
                    // Then try to initialize tags
                    await initializeTags();
                } else {
                    log(`❌ Connection failed: ${data.message || 'Unknown error'}`);
                    isConnected = false;
                    updateConnectionStatus();
                }
            } catch (error) {
                console.error('Connection error:', error);
                log(`❌ Connection error: ${error.message}`);
                isConnected = false;
                updateConnectionStatus();
            } finally {
                connectBtn.disabled = false;
            }
        }

        async function initializeTags() {
            const testTags = [
                { name: 'TestTag', type: 'BOOL', value: false },
                { name: 'TestDint', type: 'DINT', value: 0 },
                { name: 'TestReal', type: 'REAL', value: 0.0 }
            ];

            for (const tag of testTags) {
                try {
                    // First try to read the tag to see if it exists
                    const readResponse = await fetch(`/api/plc/tag/${tag.name}`);
                    if (readResponse.ok) {
                        log(`✅ Tag ${tag.name} already exists`);
                        continue;
                    }

                    // If tag doesn't exist, try to create it
                    log(`📝 Creating tag ${tag.name}...`);
                    const response = await fetch(`/api/plc/tag/${tag.name}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            Type: tag.type,
                            Value: tag.value
                        })
                    });

                    if (!response.ok) {
                        const data = await response.json();
                        log(`⚠️ Could not create ${tag.name}: ${data.message || 'Unknown error'}`);
                    } else {
                        log(`✅ Created ${tag.name}`);
                    }
                } catch (error) {
                    log(`⚠️ Error handling ${tag.name}: ${error.message}`);
                }
            }
        }

        async function disconnect() {
            try {
                const response = await fetch('/api/plc/disconnect', {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    isConnected = false;
                    sessionId = null;
                    updateConnectionStatus();
                    stopRefresh();
                    log('📤 Disconnected from PLC');
                }
            } catch (error) {
                log(`⚠️ Disconnect error: ${error.message}`);
            }
        }

        async function runBenchmark() {
            try {
                log('📊 Running benchmark...');
                benchmarkBtn.disabled = true;
                
                const response = await fetch('/api/plc/benchmark', {
                    method: 'POST'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.success) {
                    readRate.textContent = `${data.readRate} ops/sec`;
                    writeRate.textContent = `${data.writeRate} ops/sec`;
                    log(`✅ Benchmark complete: ${data.readRate} reads/sec, ${data.writeRate} writes/sec`);
                } else {
                    throw new Error(data.message || 'Benchmark failed');
                }
            } catch (error) {
                console.error('Benchmark error:', error);
                log(`❌ Benchmark error: ${error.message}`);
            } finally {
                benchmarkBtn.disabled = false;
            }
        }

        async function discoverTag() {
            if (!isConnected) return;
            
            try {
                log(`🔍 Discovering tag: ${tagToDiscover.value}`);
                
                const response = await fetch(`/api/plc/tag/${tagToDiscover.value}`);
                const data = await response.json();
                
                if (data.success) {
                    tagName.value = tagToDiscover.value;
                    dataType.value = data.type;
                    tagValue.value = data.value;
                    log(`✅ Discovered ${data.type} tag: ${tagToDiscover.value} = ${data.value}`);
                } else {
                    log(`❌ Could not determine type for tag: ${tagToDiscover.value}`);
                }
            } catch (error) {
                log(`❌ Discovery error: ${error.message}`);
            }
        }

        async function readTag() {
            if (!isConnected) return;
            
            try {
                log(`📖 Reading tag: ${tagName.value}`);
                
                const response = await fetch(`/api/plc/tag/${tagName.value}`);
                const data = await response.json();
                
                if (data.success) {
                    tagValue.value = data.value;
                    log(`✅ Read ${data.type} tag: ${tagName.value} = ${data.value}`);
                }
            } catch (error) {
                log(`❌ Read error: ${error.message}`);
            }
        }

        async function writeTag() {
            if (!isConnected) return;
            
            try {
                log(`✏️ Writing tag: ${tagName.value}`);
                
                const response = await fetch(`/api/plc/tag/${tagName.value}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        Type: dataType.value,
                        Value: tagValue.value
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    log(`✅ ${data.message}`);
                }
            } catch (error) {
                log(`❌ Write error: ${error.message}`);
            }
        }

        function updateConnectionStatus() {
            if (isConnected) {
                connectionStatus.textContent = 'Connected';
                connectionStatus.className = 'text-xl font-bold connected';
                sessionIdElement.textContent = `Session: ${sessionId}`;
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                benchmarkBtn.disabled = false;
                discoverBtn.disabled = false;
                readBtn.disabled = false;
                writeBtn.disabled = false;
                // Enable UDT buttons
                readUdtBtn.disabled = false;
                readUdtAsDictBtn.disabled = false;
                readUdtMemberBtn.disabled = false;
                writeUdtMemberBtn.disabled = false;
                
                // Start monitoring connection status
                startConnectionMonitor();
            } else {
                connectionStatus.textContent = 'Disconnected';
                connectionStatus.className = 'text-xl font-bold disconnected';
                sessionIdElement.textContent = 'Session: None';
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
                benchmarkBtn.disabled = true;
                discoverBtn.disabled = true;
                readBtn.disabled = true;
                writeBtn.disabled = true;
                // Disable UDT buttons
                readUdtBtn.disabled = true;
                readUdtAsDictBtn.disabled = true;
                readUdtMemberBtn.disabled = true;
                writeUdtMemberBtn.disabled = true;
                
                // Stop monitoring connection status
                stopConnectionMonitor();
            }
        }

        let connectionMonitorInterval = null;

        function startConnectionMonitor() {
            if (connectionMonitorInterval) {
                clearInterval(connectionMonitorInterval);
            }
            
            connectionMonitorInterval = setInterval(async () => {
                try {
                    const response = await fetch('/api/plc/status');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    if (!data.success || !data.status.isConnected) {
                        log('⚠️ Connection lost');
                        isConnected = false;
                        updateConnectionStatus();
                        await attemptReconnect();
                    }
                } catch (error) {
                    console.error('Connection monitor error:', error);
                    log('⚠️ Connection monitor error');
                    isConnected = false;
                    updateConnectionStatus();
                    await attemptReconnect();
                }
            }, 10000); // Changed from 5 seconds to 10 seconds
        }

        function stopConnectionMonitor() {
            if (connectionMonitorInterval) {
                clearInterval(connectionMonitorInterval);
                connectionMonitorInterval = null;
            }
        }

        async function attemptReconnect() {
            try {
                // First try to disconnect
                await fetch('/api/plc/disconnect', { method: 'POST' });
            } catch (error) {
                console.error('Error during disconnect:', error);
            }

            // Wait a bit before reconnecting
            await new Promise(resolve => setTimeout(resolve, RETRY_DELAY));

            try {
                const response = await fetch('/api/plc/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ Address: plcAddress.value.trim() })
                });

                const data = await response.json();
                if (data.success) {
                    isConnected = true;
                    sessionId = data.sessionId;
                    updateConnectionStatus();
                    log('✅ Reconnected successfully');
                    retryCount = 0;
                } else {
                    throw new Error(data.message || 'Reconnection failed');
                }
            } catch (error) {
                console.error('Reconnection error:', error);
                log(`❌ Reconnection failed: ${error.message}`);
                isConnected = false;
                updateConnectionStatus();
            }
        }

        function startRefresh() {
            // Add test tags
            tags.set('TestTag', { name: 'TestTag', type: 'BOOL', value: null, updated: null });
            tags.set('TestDint', { name: 'TestDint', type: 'DINT', value: null, updated: null });
            tags.set('TestReal', { name: 'TestReal', type: 'REAL', value: null, updated: null });
            // Add UDT tag
            tags.set('Part_Data.oMachine_Running', { name: 'Part_Data.oMachine_Running', type: 'UDT', value: null, updated: null });
            updateTagsTable();
            
            // Start refresh interval with a longer delay
            refreshInterval = setInterval(refreshTags, 2000); // Changed to 2 seconds
        }

        function stopRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
            tags.clear();
            updateTagsTable();
        }

        async function refreshTags() {
            if (!isConnected) return;
            
            for (const [name, tag] of tags) {
                try {
                    const response = await fetch(`/api/plc/tag/${name}`);
                    if (!response.ok) {
                        if (response.status === 404) {
                            log(`⚠️ Tag ${name} not found. Will retry initialization later.`);
                            continue;
                        }
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        tag.value = data.value;
                        tag.type = data.type;
                        tag.updated = new Date();
                        updateTagsTable();
                        retryCount = 0; // Reset retry count on success
                    }
                } catch (error) {
                    console.error(`Error refreshing tag ${name}:`, error);
                    if (error.message.includes('Failed to fetch') || error.message.includes('Connection refused')) {
                        retryCount++;
                        if (retryCount >= MAX_RETRIES) {
                            log('⚠️ Lost connection to server. Attempting to reconnect...');
                            await attemptReconnect();
                        }
                    }
                }
            }
        }

        function updateTagsTable() {
            tagsTable.innerHTML = '';
            
            for (const tag of tags.values()) {
                const row = document.createElement('tr');
                row.className = 'border-t';
                
                row.innerHTML = `
                    <td class="px-4 py-2">${tag.name}</td>
                    <td class="px-4 py-2 tag-value">${tag.value ?? 'N/A'}</td>
                    <td class="px-4 py-2">${tag.type}</td>
                    <td class="px-4 py-2">${tag.updated ? tag.updated.toLocaleTimeString() : 'N/A'}</td>
                `;
                
                tagsTable.appendChild(row);
            }
        }

        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = `[${timestamp}] ${message}`;
            
            logContainer.insertBefore(entry, logContainer.firstChild);
            
            // Keep only last 100 messages
            while (logContainer.children.length > 100) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }

        // UDT Functions
        async function readUdt() {
            if (!isConnected) {
                log('❌ Not connected to PLC');
                return;
            }

            const udt = udtName.value.trim();
            if (!udt) {
                log('❌ Please enter a UDT name');
                return;
            }

            try {
                log(`🔍 Reading UDT: ${udt}`);
                udtResults.innerHTML = 'Loading...';
                
                const response = await fetch(`/api/plc/udt/${encodeURIComponent(udt)}`);
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.success) {
                    log(`✅ Successfully read UDT: ${udt}`);
                    udtResults.innerHTML = `<div class="text-green-400">✅ UDT Read Successfully</div>
                        <div class="mt-2">Type: ${data.type}</div>
                        <div>Value: ${JSON.stringify(data.value, null, 2)}</div>`;
                } else {
                    log(`❌ Failed to read UDT: ${data.message}`);
                    udtResults.innerHTML = `<div class="text-red-400">❌ Error: ${data.message}</div>`;
                }
            } catch (error) {
                log(`❌ Error reading UDT: ${error.message}`);
                udtResults.innerHTML = `<div class="text-red-400">❌ Error: ${error.message}</div>`;
            }
        }

        async function readUdtAsDictionary() {
            if (!isConnected) {
                log('❌ Not connected to PLC');
                return;
            }

            const udt = udtName.value.trim();
            if (!udt) {
                log('❌ Please enter a UDT name');
                return;
            }

            try {
                log(`🔍 Reading UDT as Dictionary: ${udt}`);
                udtResults.innerHTML = 'Loading...';
                
                const response = await fetch(`/api/plc/udt-dict/${encodeURIComponent(udt)}`);
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.success) {
                    log(`✅ Successfully read UDT as Dictionary: ${udt}`);
                    const memberCount = Object.keys(data.value).length;
                    udtResults.innerHTML = `<div class="text-green-400">✅ UDT Dictionary Read Successfully</div>
                        <div class="mt-2">Members: ${memberCount}</div>
                        <div class="mt-2 max-h-48 overflow-y-auto">${JSON.stringify(data.value, null, 2)}</div>`;
                } else {
                    log(`❌ Failed to read UDT as Dictionary: ${data.message}`);
                    udtResults.innerHTML = `<div class="text-red-400">❌ Error: ${data.message}</div>`;
                }
            } catch (error) {
                log(`❌ Error reading UDT as Dictionary: ${error.message}`);
                udtResults.innerHTML = `<div class="text-red-400">❌ Error: ${error.message}</div>`;
            }
        }

        async function readUdtMember() {
            if (!isConnected) {
                log('❌ Not connected to PLC');
                return;
            }

            const member = udtMemberSelect.value.trim();
            if (!member) {
                log('❌ Please select a UDT member');
                return;
            }

            try {
                log(`🔍 Reading UDT Member: ${member}`);
                udtResults.innerHTML = 'Loading...';
                
                const response = await fetch(`/api/plc/tag/${encodeURIComponent(member)}`);
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.success) {
                    log(`✅ Successfully read UDT Member: ${member}`);
                    udtResults.innerHTML = `<div class="text-green-400">✅ UDT Member Read Successfully</div>
                        <div class="mt-2">Member: ${member}</div>
                        <div>Type: ${data.type}</div>
                        <div>Value: ${JSON.stringify(data.value, null, 2)}</div>`;
                } else {
                    log(`❌ Failed to read UDT Member: ${data.message}`);
                    udtResults.innerHTML = `<div class="text-red-400">❌ Error: ${data.message}</div>`;
                }
            } catch (error) {
                log(`❌ Error reading UDT Member: ${error.message}`);
                udtResults.innerHTML = `<div class="text-red-400">❌ Error: ${error.message}</div>`;
            }
        }

        async function writeUdtMember() {
            if (!isConnected) {
                log('❌ Not connected to PLC');
                return;
            }

            const member = udtMemberSelect.value.trim();
            const value = udtMemberValue.value.trim();
            
            if (!member) {
                log('❌ Please select a UDT member');
                return;
            }
            
            if (!value) {
                log('❌ Please enter a value to write');
                return;
            }

            try {
                log(`✍️ Writing UDT Member: ${member} = ${value}`);
                udtResults.innerHTML = 'Loading...';
                
                const response = await fetch(`/api/plc/tag/${encodeURIComponent(member)}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ value: value })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.success) {
                    log(`✅ Successfully wrote UDT Member: ${member} = ${value}`);
                    udtResults.innerHTML = `<div class="text-green-400">✅ UDT Member Write Successfully</div>
                        <div class="mt-2">Member: ${member}</div>
                        <div>Value Written: ${value}</div>`;
                } else {
                    log(`❌ Failed to write UDT Member: ${data.message}`);
                    udtResults.innerHTML = `<div class="text-red-400">❌ Error: ${data.message}</div>`;
                }
            } catch (error) {
                log(`❌ Error writing UDT Member: ${error.message}`);
                udtResults.innerHTML = `<div class="text-red-400">❌ Error: ${error.message}</div>`;
            }
        }

        // Initialize
        updateConnectionStatus();
    </script>
</body>
</html>
