n#[derive(Debug, Clone)]\r\npub struct ConnectionHealth {\r\n    /// Whether the connection is currently active\r\n    pub is_active: bool,\r\n    /// Last successful communication timestamp\r\n    pub last_success: Instant,\r\n    /// Number of failed attempts since last success\r\n    pub failed_attempts: u32,\r\n    /// Current connection latency in milliseconds\r\n    pub latency: Duration,\r\n}\r\n\r\n/// Represents a connection to a PLC\r\n#[derive(Debug)]\r\npub struct PlcConnection {\r\n    /// The EIP client instance\r\n    client: EipClient,\r\n    /// Health status of the connection\r\n    health: ConnectionHealth,\r\n    /// Last time this connection was used\r\n    last_used: Instant,\r\n}\r\n\r\nimpl PlcConnection {\r\n    /// Creates a new PLC connection\r\n    pub fn new(client: EipClient) -\u003e Self {\r\n        Self {\r\n            client,\r\n            health: ConnectionHealth {\r\n                is_active: true,\r\n                last_success: Instant::now(),\r\n                failed_attempts: 0,\r\n                latency: Duration::from_millis(0),\r\n            },\r\n            last_used: Instant::now(),\r\n        }\r\n    }\r\n\r\n    /// Updates the health status of the connection\r\n    #[allow(dead_code)]\r\n    pub fn update_health(\u0026mut self, is_active: bool, latency: Duration) {\r\n        self.health.is_active = is_active;\r\n        if is_active {\r\n            self.health.last_success = Instant::now();\r\n            self.health.failed_attempts = 0;\r\n            self.health.latency = latency;\r\n        } else {\r\n            self.health.failed_attempts += 1;\r\n        }\r\n    }\r\n}\r\n\r\n/// Manager for multiple PLC connections\r\n#[derive(Debug)]\r\npub struct PlcManager {\r\n    /// Configuration for each PLC\r\n    configs: HashMap\u003cSocketAddr, PlcConfig\u003e,\r\n    /// Active connections for each PLC\r\n    connections: HashMap\u003cSocketAddr, Vec\u003cPlcConnection\u003e\u003e,\r\n    /// Health check interval\r\n    #[allow(dead_code)]\r\n    health_check_interval: Duration,\r\n}\r\n\r\nimpl Default for PlcManager {\r\n    fn default() -\u003e Self {\r\n        Self::new()\r\n    }\r\n}\r\n\r\nimpl PlcManager {\r\n    /// Creates a new PLC manager\r\n    pub fn new() -\u003e Self {\r\n        Self {\r\n            configs: HashMap::new(),\r\n            connections: HashMap::new(),\r\n            health_check_interval: Duration::from_secs(30),\r\n        }\r\n    }\r\n\r\n    /// Adds a PLC configuration\r\n    pub fn add_plc(\u0026mut self, config: PlcConfig) {\r\n        self.configs.insert(config.address, config);\r\n    }\r\n\r\n    /// Gets a connection to a PLC\r\n    pub async fn get_connection(\u0026mut self, address: SocketAddr) -\u003e Result\u003c\u0026mut EipClient\u003e {\r\n        let config = self\r\n            .configs\r\n            .get(\u0026address)\r\n            .ok_or_else(|| EtherNetIpError::Connection(\"PLC not configured\".to_string()))?;\r\n\r\n        // First check if we have any connections for this address\r\n        if let std::collections::hash_map::Entry::Vacant(e) = self.connections.entry(address) {\r\n            // No connections exist, create a new one\r\n            let mut client = EipClient::new(\u0026address.to_string()).await?;\r\n            client.set_max_packet_size(config.max_packet_size as u32);\r\n            let mut new_conn = PlcConnection::new(client);\r\n            new_conn.last_used = Instant::now();\r\n            e.insert(vec![new_conn]);\r\n            return Ok(\u0026mut self.connections.get_mut(\u0026address).unwrap()[0].client);\r\n        }\r\n\r\n        // Get mutable access to the connections\r\n        let connections = self.connections.get_mut(\u0026address).unwrap();\r\n\r\n        // First try to find an inactive connection\r\n        for (i, connection) in connections.iter_mut().enumerate() {\r\n            if !connection.health.is_active {\r\n                let mut client = EipClient::new(\u0026address.to_string()).await?;\r\n                client.set_max_packet_size(config.max_packet_size as u32);\r\n                connection.client = client;\r\n                connection.health.is_active = true;\r\n                connection.health.last_success = Instant::now();\r\n                connection.health.failed_attempts = 0;\r\n                connection.health.latency = Duration::from_millis(0);\r\n                connection.last_used = Instant::now();\r\n                return Ok(\u0026mut connections[i].client);\r\n            }\r\n        }\r\n\r\n        // If we have room for more connections, create a new one\r\n        if connections.len() \u003c config.max_connections as usize {\r\n            let mut client = EipClient::new(\u0026address.to_string()).await?;\r\n            client.set_max_packet_size(config.max_packet_size as u32);\r\n            let mut new_conn = PlcConnection::new(client);\r\n            new_conn.last_used = Instant::now();\r\n            connections.push(new_conn);\r\n            return Ok(\u0026mut connections.last_mut().unwrap().client);\r\n        }\r\n\r\n        // Find the least recently used connection\r\n        let lru_index = connections\r\n            .iter()\r\n            .enumerate()\r\n            .min_by_key(|(_, conn)| conn.last_used)\r\n            .map(|(i, _)| i)\r\n            .unwrap();\r\n\r\n        // Update the LRU connection\r\n        let mut client = EipClient::new(\u0026address.to_string()).await?;\r\n        client.set_max_packet_size(config.max_packet_size as u32);\r\n        connections[lru_index].client = client;\r\n        connections[lru_index].health.is_active = true;\r\n        connections[lru_index].health.last_success = Instant::now();\r\n        connections[lru_index].health.failed_attempts = 0;\r\n        connections[lru_index].health.latency = Duration::from_millis(0);\r\n        connections[lru_index].last_used = Instant::now();\r\n        Ok(\u0026mut connections[lru_index].client)\r\n    }\r\n\r\n    /// Performs health checks on all connections\r\n    pub async fn check_health(\u0026mut self) {\r\n        for (address, connections) in \u0026mut self.connections {\r\n            let _config = self.configs.get(address).unwrap();\r\n\r\n            for conn in connections.iter_mut() {\r\n                if !conn.health.is_active {\r\n                    if let Ok(new_client) = EipClient::new(\u0026address.to_string()).await {\r\n                        conn.client = new_client;\r\n                        conn.health.is_active = true;\r\n                        conn.health.last_success = Instant::now();\r\n                        conn.health.failed_attempts = 0;\r\n                        conn.health.latency = Duration::from_millis(0);\r\n                        conn.last_used = Instant::now();\r\n                    }\r\n                }\r\n            }\r\n        }\r\n    }\r\n\r\n    /// Removes inactive connections\r\n    pub fn cleanup_connections(\u0026mut self) {\r\n        for connections in self.connections.values_mut() {\r\n            connections.retain(|conn| conn.health.is_active);\r\n        }\r\n    }\r\n\r\n    pub async fn get_client(\u0026mut self, address: \u0026str) -\u003e Result\u003c\u0026mut EipClient\u003e {\r\n        let addr = address\r\n            .parse::\u003cSocketAddr\u003e()\r\n            .map_err(|_| EtherNetIpError::Connection(\"Invalid address format\".to_string()))?;\r\n        self.get_connection(addr).await\r\n    }\r\n\r\n    async fn _get_or_create_connection(\u0026mut self, address: \u0026SocketAddr) -\u003e Result\u003c\u0026mut EipClient\u003e {\r\n        let config = self.configs.get(address).cloned().unwrap();\r\n        let connections = self.connections.entry(*address).or_default();\r\n\r\n        // Try to find an existing inactive connection\r\n        for (i, connection) in connections.iter_mut().enumerate() {\r\n            if !connection.health.is_active {\r\n                let mut client = EipClient::new(\u0026address.to_string()).await?;\r\n                client.set_max_packet_size(config.max_packet_size as u32);\r\n                connection.client = client;\r\n                connection.health.is_active = true;\r\n                connection.health.last_success = Instant::now();\r\n                connection.health.failed_attempts = 0;\r\n                connection.health.latency = Duration::from_millis(0);\r\n                connection.last_used = Instant::now();\r\n                return Ok(\u0026mut connections[i].client);\r\n            }\r\n        }\r\n\r\n        // If we have room for more connections, create a new one\r\n        if connections.len() \u003c config.max_connections as usize {\r\n            let mut client = EipClient::new(\u0026address.to_string()).await?;\r\n            client.set_max_packet_size(config.max_packet_size as u32);\r\n            let mut new_conn = PlcConnection::new(client);\r\n            new_conn.last_used = Instant::now();\r\n            connections.push(new_conn);\r\n            return Ok(\u0026mut connections.last_mut().unwrap().client);\r\n        }\r\n\r\n        // Find the least recently used connection\r\n        let lru_index = connections\r\n            .iter()\r\n            .enumerate()\r\n            .min_by_key(|(_, conn)| conn.last_used)\r\n            .map(|(i, _)| i)\r\n            .unwrap();\r\n\r\n        // Update the LRU connection\r\n        let mut client = EipClient::new(\u0026address.to_string()).await?;\r\n        client.set_max_packet_size(config.max_packet_size as u32);\r\n        connections[lru_index].client = client;\r\n        connections[lru_index].health.is_active = true;\r\n        connections[lru_index].health.last_success = Instant::now();\r\n        connections[lru_index].health.failed_attempts = 0;\r\n        connections[lru_index].health.latency = Duration::from_millis(0);\r\n        connections[lru_index].last_used = Instant::now();\r\n        Ok(\u0026mut connections[lru_index].client)\r\n    }\r\n}\r\n\r\n#[cfg(test)]\r\nmod tests {\r\n    use super::*;\r\n\r\n    #[test]\r\n    fn test_plc_config_default() {\r\n        let config = PlcConfig::default();\r\n        assert_eq!(config.max_connections, 5);\r\n        assert_eq!(config.max_packet_size, 4000);\r\n    }\r\n\r\n    #[tokio::test]\r\n    async fn test_plc_manager_connection_pool() {\r\n        let mut manager = PlcManager::new();\r\n        let config = PlcConfig {\r\n            address: \"127.0.0.1:44818\".parse().unwrap(),\r\n            max_connections: 2,\r\n            ..Default::default()\r\n        };\r\n        manager.add_plc(config.clone());\r\n\r\n        // This will fail in tests since there's no actual PLC\r\n        // but it demonstrates the connection pool logic\r\n        let result = manager.get_connection(config.address).await;\r\n        assert!(result.is_err());\r\n    }\r\n}\r\n","traces":[{"line":23,"address":[],"length":0,"stats":{"Line":144115188075855872}},{"line":25,"address":[],"length":0,"stats":{"Line":576460752303423488}},{"line":27,"address":[],"length":0,"stats":{"Line":144115188075855872}},{"line":28,"address":[],"length":0,"stats":{"Line":144115188075855872}},{"line":60,"address":[],"length":0,"stats":{"Line":0}},{"line":63,"address":[],"length":0,"stats":{"Line":0}},{"line":69,"address":[],"length":0,"stats":{"Line":0}},{"line":75,"address":[],"length":0,"stats":{"Line":0}},{"line":76,"address":[],"length":0,"stats":{"Line":0}},{"line":77,"address":[],"length":0,"stats":{"Line":0}},{"line":78,"address":[],"length":0,"stats":{"Line":0}},{"line":79,"address":[],"length":0,"stats":{"Line":0}},{"line":80,"address":[],"length":0,"stats":{"Line":0}},{"line":82,"address":[],"length":0,"stats":{"Line":0}},{"line":100,"address":[],"length":0,"stats":{"Line":0}},{"line":101,"address":[],"length":0,"stats":{"Line":0}},{"line":107,"address":[],"length":0,"stats":{"Line":144115188075855872}},{"line":109,"address":[],"length":0,"stats Last received value\r\n    pub last_value: Arc\u003cMutex\u003cOption\u003cPlcValue\u003e\u003e\u003e,\r\n    /// Channel sender for value updates\r\n    pub sender: Arc\u003cMutex\u003cmpsc::Sender\u003cPlcValue\u003e\u003e\u003e,\r\n    /// Channel receiver for value updates\r\n    pub receiver: Arc\u003cMutex\u003cmpsc::Receiver\u003cPlcValue\u003e\u003e\u003e,\r\n    /// Whether the subscription is active\r\n    pub is_active: Arc\u003cAtomicBool\u003e,\r\n}\r\n\r\nimpl TagSubscription {\r\n    /// Creates a new tag subscription\r\n    pub fn new(tag_name: String, options: SubscriptionOptions) -\u003e Self {\r\n        let (sender, receiver) = mpsc::channel(100); // Buffer size of 100\r\n        Self {\r\n            tag_path: tag_name,\r\n            options,\r\n            last_value: Arc::new(Mutex::new(None)),\r\n            sender: Arc::new(Mutex::new(sender)),\r\n            receiver: Arc::new(Mutex::new(receiver)),\r\n            is_active: Arc::new(AtomicBool::new(true)),\r\n        }\r\n    }\r\n\r\n    /// Checks if the subscription is active\r\n    pub fn is_active(\u0026self) -\u003e bool {\r\n        self.is_active.load(std::sync::atomic::Ordering::Relaxed)\r\n    }\r\n\r\n    /// Stops the subscription\r\n    pub fn stop(\u0026self) {\r\n        self.is_active\r\n            .store(false, std::sync::atomic::Ordering::Relaxed);\r\n    }\r\n\r\n    /// Updates the subscription value\r\n    pub async fn update_value(\u0026self, value: \u0026PlcValue) -\u003e Result\u003c()\u003e {\r\n        let mut last_value = self.last_value.lock().await;\r\n\r\n        // Check if value has changed significantly\r\n        if let (Some(PlcValue::Real(old)), PlcValue::Real(new)) = (last_value.as_ref(), value) {\r\n            if (*new - *old).abs() \u003c self.options.change_threshold {\r\n                return Ok(());\r\n            }\r\n        }\r\n\r\n        // Update value and send notification\r\n        *last_value = Some(value.clone());\r\n        let sender = self.sender.lock().await;\r\n        sender\r\n            .send(value.clone())\r\n            .await\r\n            .map_err(|e| EtherNetIpError::Subscription(format!(\"Failed to send update: {e}\")))?;\r\n\r\n        Ok(())\r\n    }\r\n\r\n    /// Waits for the next value update\r\n    pub async fn wait_for_update(\u0026self) -\u003e Result\u003cPlcValue\u003e {\r\n        let mut receiver = self.receiver.lock().await;\r\n        receiver\r\n            .recv()\r\n            .await\r\n            .ok_or_else(|| EtherNetIpError::Subscription(\"Channel closed\".to_string()))\r\n    }\r\n\r\n    /// Gets the last value received\r\n    pub async fn get_last_value(\u0026self) -\u003e Option\u003cPlcValue\u003e {\r\n        self.last_value.lock().await.clone()\r\n    }\r\n}\r\n\r\n/// Manages multiple tag subscriptions\r\n#[derive(Debug, Clone)]\r\npub struct SubscriptionManager {\r\n    subscriptions: Arc\u003cMutex\u003cVec\u003cTagSubscription\u003e\u003e\u003e,\r\n}\r\n\r\nimpl Default for SubscriptionManager {\r\n    fn default() -\u003e Self {\r\n        Self::new()\r\n    }\r\n}\r\n\r\nimpl SubscriptionManager {\r\n    /// Creates a new subscription manager\r\n    pub fn new() -\u003e Self {\r\n        Self {\r\n            subscriptions: Arc::new(Mutex::new(Vec::new())),\r\n        }\r\n    }\r\n\r\n    /// Adds a new subscription\r\n    pub async fn add_subscription(\u0026self, subscription: TagSubscription) {\r\n        let mut subscriptions = self.subscriptions.lock().await;\r\n        subscriptions.push(subscription);\r\n    }\r\n\r\n    /// Removes a subscription\r\n    pub async fn remove_subscription(\u0026self, tag_name: \u0026str) {\r\n        let mut subscriptions = self.subscriptions.lock().await;\r\n        subscriptions.retain(|sub| sub.tag_path != tag_name);\r\n    }\r\n\r\n    /// Updates a value for all matching subscriptions\r\n    pub async fn update_value(\u0026self, tag_name: \u0026str, value: \u0026PlcValue) -\u003e Result\u003c()\u003e {\r\n        let subscriptions = self.subscriptions.lock().await;\r\n        for subscription in subscriptions.iter() {\r\n            if subscription.tag_path == tag_name \u0026\u0026 subscription.is_active() {\r\n                subscription.update_value(value).await?;\r\n            }\r\n        }\r\n        Ok(())\r\n    }\r\n\r\n    /// Gets all active subscriptions\r\n    pub async fn get_subscriptions(\u0026self) -\u003e Vec\u003cTagSubscription\u003e {\r\n        let subscriptions = self.subscriptions.lock().await;\r\n        subscriptions.clone()\r\n    }\r\n\r\n    /// Gets a specific subscription by tag name\r\n    pub async fn get_subscription(\u0026self, tag_name: \u0026str) -\u003e Option\u003cTagSubscription\u003e {\r\n        let subscriptions = self.subscriptions.lock().await;\r\n        subscriptions\r\n            .iter()\r\n            .find(|sub| sub.tag_path == tag_name)\r\n            .cloned()\r\n    }\r\n}\r\n","traces":[{"line":19,"address":[],"length":0,"stats":{"Line":0}},{"line":47,"address":[],"length":0,"stats":{"Line":0}},{"line":48,"address":[],"length":0,"stats":{"Line":0}},{"line":52,"address":[],"length":0,"stats":{"Line":0}},{"line":53,"address":[],"length":0,"stats":{"Line":0}},{"line":54,"address":[],"length":0,"stats":{"Line":0}},{"line":55,"address":[],"length":0,"stats":{"Line":0}},{"line":60,"address":[],"length":0,"stats":{"Line":0}},{"line":61,"address":[],"length":0,"stats":{"Line":0}},{"line":65,"address":[],"length":0,"stats":{"Line":0}},{"line":66,"address":[],"length":0,"stats":{"Line":0}},{"line":67,"address":[],"length":0,"stats":{"Line":0}},{"line":71,"address":[],"length":0,"stats":{"Line":0}},{"line":72,"address":[],"length":0,"stats":{"Line":0}},{"line":75,"address":[],"length":0,"stats":{"Line":0}},{"line":77,"address":[],"length":0,"stats":{"Line":0}},{"line":82,"address":[],"length":0,"stats":{"Line":0}},{"line":83,"address":[],"length":0,"stats":{"Line":0}},{"line":84,"address":[],"length":0,"stats":{"Li c","tag_manager.rs"],"content":"use crate::error::{EtherNetIpError, Result};\nuse crate::udt::{UdtDefinition, UdtMember};\nuse crate::EipClient;\nuse std::collections::HashMap;\nuse std::sync::RwLock;\nuse std::time::{Duration, Instant};\n\n/// Represents the scope of a tag in the PLC\n#[derive(Debug, Clone, PartialEq)]\npub enum TagScope {\n    /// Tag in the controller scope\n    Controller,\n    /// Tag in a program scope\n    Program(String),\n    Global,\n    Local,\n}\n\n/// Array information for tags\n#[derive(Debug, Clone)]\npub struct ArrayInfo {\n    pub dimensions: Vec\u003cu32\u003e,\n    pub element_count: u32,\n}\n\n/// Metadata for a PLC tag\n#[derive(Debug, Clone)]\npub struct TagMetadata {\n    /// The data type of the tag\n    pub data_type: u16,\n    /// Size of the tag in bytes\n    pub size: u32,\n    /// Whether the tag is an array\n    pub is_array: bool,\n    /// Array dimensions if applicable\n    pub dimensions: Vec\u003cu32\u003e,\n    /// Access permissions for the tag\n    pub permissions: TagPermissions,\n    /// Scope of the tag\n    pub scope: TagScope,\n    /// Last time this tag was accessed\n    pub last_access: Instant,\n    pub array_info: Option\u003cArrayInfo\u003e,\n    pub last_updated: Instant,\n}\n\n/// Access permissions for a tag\n#[derive(Debug, Clone, PartialEq)]\npub struct TagPermissions {\n    /// Whether the tag can be read\n    pub readable: bool,\n    /// Whether the tag can be written\n    pub writable: bool,\n}\n\nimpl TagMetadata {\n    /// Returns true if this tag is a structure/UDT\n    pub fn is_structure(\u0026self) -\u003e bool {\n        // Check if the data type indicates a structure\n        // Common structure type codes in Allen-Bradley PLCs\n        (0x00A0..=0x00AF).contains(\u0026self.data_type)\n    }\n}\n\n/// Cache for PLC tags with automatic expiration\n#[derive(Debug)]\n#[allow(dead_code)]\npub struct TagCache {\n    /// Map of tag names to their metadata\n    tags: HashMap\u003cString, (TagMetadata, Instant)\u003e,\n    /// Cache expiration time\n    expiration: Duration,\n}\n\nimpl TagCache {\n    /// Creates a new tag cache with the specified expiration time\n    #[allow(dead_code)]\n    pub fn new(expiration: Duration) -\u003e Self {\n        Self {\n            tags: HashMap::new(),\n            expiration,\n        }\n    }\n\n    /// Updates or adds a tag to the cache\n    #[allow(dead_code)]\n    pub fn update_tag(\u0026mut self, name: String, metadata: TagMetadata) {\n        self.tags.insert(name, (metadata, Instant::now()));\n    }\n\n    /// Gets a tag from the cache if it exists and hasn't expired\n    #[allow(dead_code)]\n    pub fn get_tag(\u0026self, name: \u0026str) -\u003e Option\u003c\u0026TagMetadata\u003e {\n        if let Some((metadata, timestamp)) = self.tags.get(name) {\n            if timestamp.elapsed() \u003c self.expiration {\n                return Some(metadata);\n            }\n        }\n        None\n    }\n\n    /// Removes expired tags from the cache\n    #[allow(dead_code)]\n    pub fn cleanup(\u0026mut self) {\n        self.tags\n            .retain(|_, (_, timestamp)| timestamp.elapsed() \u003c self.expiration);\n    }\n}\n\n/// Manager for PLC tag discovery and caching\n#[derive(Debug)]\npub struct TagManager {\n    pub cache: RwLock\u003cHashMap\u003cString, TagMetadata\u003e\u003e,\n    cache_duration: Duration,\n    pub udt_definitions: RwLock\u003cHashMap\u003cString, UdtDefinition\u003e\u003e,\n}\n\nimpl TagManager {\n    pub fn new() -\u003e Self {\n        Self {\n            cache: RwLock::new(HashMap::new()),\n            cache_duration: Duration::from_secs(300), // 5 minutes\n            udt_definitions: RwLock::new(HashMap::new()),\n        }\n    }\n\n    pub async fn get_metadata(\u0026self, tag_name: \u0026str) -\u003e Option\u003cTagMetadata\u003e {\n        let cache = self.cache.read().unwrap();\n        cache.get(tag_name).and_then(|metadata| {\n            if metadata.last_updated.elapsed() \u003c self.cache_duration {\n                Some(metadata.clone())\n            } else {\n                None\n            }\n        })\n    }\n\n    pub async fn update_metadata(\u0026self, tag_name: String, metadata: TagMetadata) {\n        self.cache.write().unwrap().insert(tag_name, metadata);\n    }\n\n    pub async fn validate_tag(\n        \u0026self,\n        tag_name: \u0026str,\n        required_permissions: \u0026TagPermissions,\n    ) -\u003e Result\u003c()\u003e {\n        if let Some(metadata) = self.get_metadata(tag_name).await {\n            if !metadata.permissions.readable \u0026\u0026 required_permissions.readable {\n                return Err(EtherNetIpError::Permission(format!(\n                    \"Tag '{tag_name}' is not readable\"\n                )));\n            }\n            if !metadata.permissions.writable \u0026\u0026 required_permissions.writable {\n                return Err(EtherNetIpError::Permission(format!(\n                    \"Tag '{tag_name}' is not writable\"\n                )));\n            }\n            Ok(())\n        } else {\n            Err(EtherNetIpError::Tag(format!(\"Tag '{tag_name}' not found\")))\n        }\n    }\n\n    pub async fn clear_cache(\u0026self) {\n        self.cache.write().unwrap().clear();\n    }\n\n    pub async fn remove_stale_entries(\u0026self) {\n        self.cache\n            .write()\n            .unwrap()\n            .retain(|_, metadata| metadata.last_updated.elapsed() \u003c self.cache_duration);\n    }\n\n    pub async fn discover_tags(\u0026self, client: \u0026mut EipClient) -\u003e Result\u003c()\u003e {\n        let response = client\n            .send_cip_request(\u0026client.build_list_tags_request())\n            .await?;\n        let tags = self.parse_tag_list(\u0026response)?;\n\n        // Perform hierarchical discovery for structures/UDTs\n        let mut all_tags = Vec::new();\n        for (name, metadata) in tags {\n            all_tags.push((name, metadata));\n        }\n\n        // Discover nested tags for structures\n        let hierarchical_tags = self.discover_hierarchical_tags(client, \u0026all_tags).await?;\n\n        let mut cache = self.cache.write().unwrap();\n        for (name, metadata) in hierarchical_tags {\n            cache.insert(name, metadata);\n        }\n        Ok(())\n    }\n\n    /// Discovers hierarchical tags by drilling down into structures and UDTs\n    async fn discover_hierarchical_tags(\n        \u0026self,\n        client: \u0026mut EipClient,\n        base_tags: \u0026[(String, TagMetadata)],\n    ) -\u003e Result\u003cVec\u003c(String, TagMetadata)\u003e\u003e {\n        let mut all_tags = Vec::new();\n        let mut tag_names = std::collections::HashSet::new();\n\n        // Add base tags first\n        for (name, metadata) in base_tags {\n            if self.validate_tag_name(name) {\n                all_tags.push((name.clone(), metadata.clone()));\n                tag_names.insert(name.clone());\n            }\n        }\n\n        // Process each tag for hierarchical discovery\n        for (name, metadata) in base_tags {\n            if metadata.is_structure() \u0026\u0026 !metadata.is_array {\n                // This is a structure/UDT, try to discover its members\n                if let Ok(members) = self.discover_udt_members(client, name).await {\n                    for (member_name, member_metadata) in members {\n                        let full_name = format!(\"{}.{}\", name, member_name);\n                        if self.validate_tag_name(\u0026full_name) \u0026\u0026 !tag_names.contains(\u0026full_name) {\n                            all_tags.push((full_name.clone(), member_metadata.clone()));\n                            tag_names.insert(full_name.clone());\n\n                            // Recursively discover nested structures\n                            if member_metadata.is_structure() \u0026\u0026 !member_metadata.is_array {\n                                if let Ok(nested_members) =\n                                    self.discover_udt_members(client, \u0026full_name).await\n                                {\n                                    for (nested_name, nested_metadata) in nested_members {\n                                        let nested_full_name =\n                                            format!(\"{}.{}\", full_name, nested_name);\n                                        if self.validate_tag_name(\u0026nested_full_name)\n                                            \u0026\u0026 !tag_names.contains(\u0026nested_full_name)\n                                        {\n                                            all_tags\n                                                .push((nested_full_name.clone(), nested_metadata));\n                                            tag_names.insert(nested_full_name);\n                                        }\n                                    }\n                                }\n                            }\n                        }\n                    }\n                }\n            }\n        }\n\n        println!(\n            \"[DEBUG] Discovered {} total tags (including hierarchical)\",\n            all_tags.len()\n        );\n        Ok(all_tags)\n    }\n\n    /// Discovers members of a UDT/structure\n    pub async fn discover_udt_members(\n        \u0026self,\n        client: \u0026mut EipClient,\n        udt_name: \u0026str,\n    ) -\u003e Result\u003cVec\u003c(String, TagMetadata)\u003e\u003e {\n        println!(\"[DEBUG] Discovering UDT members for: {}\", udt_name);\n\n        // First, try to get the UDT definition\n        if let Ok(udt_definition) = self.get_udt_definition(client, udt_name).await {\n            let mut members = Vec::new();\n\n            for member in \u0026udt_definition.members {\n                let member_name = member.name.clone();\n                let full_name = format!(\"{}.{}\", udt_name, member_name);\n\n                // Create metadata for the UDT member\n                let metadata = TagMetadata {\n                    data_type: member.data_type,\n                    scope: TagScope::Controller,\n                    permissions: TagPermissions {\n                        readable: true,\n                        writable: true,\n                    },\n                    is_array: false, // Individual members are not arrays\n                    dimensions: Vec::new(),\n                    last_access: Instant::now(),\n                    size: member.size,\n                    array_info: None,\n                    last_updated: Instant::now(),\n                };\n\n                if self.validate_tag_name(\u0026full_name) {\n                    members.push((full_name.clone(), metadata));\n                    println!(\n                        \"[DEBUG] Found UDT member: {} (Type: 0x{:04X})\",\n                        full_name, member.data_type\n                    );\n                }\n            }\n\n            Ok(members)\n        } else {\n            println!(\"[WARN] Could not get UDT definition for: {}\", udt_name);\n            Ok(Vec::new())\n        }\n    }\n\n    /// Gets UDT definition from the PLC (with caching)\n    async fn get_udt_definition(\n        \u0026self,\n        client: \u0026mut EipClient,\n        udt_name: \u0026str,\n    ) -\u003e Result\u003cUdtDefinition\u003e {\n        // Check cache first\n        {\n            let definitions = self.udt_definitions.read().unwrap();\n            if let Some(definition) = definitions.get(udt_name) {\n                println!(\"[DEBUG] Using cached UDT definition for: {}\", udt_name);\n                return Ok(definition.clone());\n            }\n        }\n\n        // Build CIP request to get UDT definition\n        let cip_request = self.build_udt_definition_request(udt_name)?;\n\n        // Send the request\n        let response = client.send_cip_request(\u0026cip_request).await?;\n\n        // Parse the UDT definition from response\n        let definition = self.parse_udt_definition_response(\u0026response, udt_name)?;\n\n        // Cache the definition\n        {\n            let mut definitions = self.udt_definitions.write().unwrap();\n            definitions.insert(udt_name.to_string(), definition.clone());\n        }\n\n        Ok(definition)\n    }\n\n    /// Builds a CIP request to get UDT definition\n    pub fn build_udt_definition_request(\u0026self, udt_name: \u0026str) -\u003e Result\u003cVec\u003cu8\u003e\u003e {\n        // This is a simplified UDT definition request\n        // In practice, this would need to be more sophisticated\n        // For now, we'll try to read the UDT as a tag to get its structure\n\n        let mut request = Vec::new();\n\n        // Service: Read Tag (0x4C)\n        request.push(0x4C);\n\n        // Path size (in words)\n        let path_size = 2 + (udt_name.len() + 1) / 2; // Round up for word alignment\n        request.push(path_size as u8);\n\n        // Path: Symbolic segment\n        request.push(0x91); // Symbolic segment\n        request.push(udt_name.len() as u8);\n        request.extend_from_slice(udt_name.as_bytes());\n\n        // Pad to word boundary if needed\n        if udt_name.len() % 2 != 0 {\n            request.push(0x00);\n        }\n\n        Ok(request)\n    }\n\n    /// Parses UDT definition from CIP response\n    pub fn parse_udt_definition_response(\n        \u0026self,\n        response: \u0026[u8],\n        udt_name: \u0026str,\n    ) -\u003e Result\u003cUdtDefinition\u003e {\n        println!(\n            \"[DEBUG] Parsing UDT definition response for {} ({} bytes): {:02X?}\",\n            udt_name,\n            response.len(),\n            response\n        );\n\n        // This is a simplified parser - in practice, UDT definitions are complex\n        // For now, we'll create a basic structure based on common patterns\n\n        let mut definition = UdtDefinition {\n            name: udt_name.to_string(),\n            members: Vec::new(),\n        };\n\n        // Try to extract member information from the response\n        // This is a placeholder implementation - real UDT parsing would be much more complex\n        if response.len() \u003e 10 {\n            // Look for common data type patterns in the response\n            let mut offset = 0;\n            let mut member_offset = 0u32;\n\n            while offset \u003c response.len().saturating_sub(4) {\n                // Look for data type markers\n                if let Some((data_type, size)) =\n                    self.extract_data_type_from_response(\u0026response[offset..])\n                {\n                    let member_name = format!(\"Member_{}\", definition.members.len() + 1);\n\n                    definition.members.push(UdtMember {\n                        name: member_name,\n                        data_type,\n                        offset: member_offset,\n                        size,\n                    });\n\n                    member_offset += size;\n                    offset += 4; // Skip processed bytes\n                } else {\n                    offset += 1;\n                }\n\n                // Limit to prevent infinite loops\n                if definition.members.len() \u003e 50 {\n                    break;\n                }\n            }\n        }\n\n        // If we couldn't parse any members, create some common ones as fallback\n        if definition.members.is_empty() {\n            definition.members.push(UdtMember {\n                name: \"Value\".to_string(),\n                data_type: 0x00C4, // DINT\n                offset: 0,\n                size: 4,\n            });\n        }\n\n        println!(\n            \"[DEBUG] Parsed UDT definition with {} members\",\n            definition.members.len()\n        );\n        Ok(definition)\n    }\n\n    /// Extracts data type information from response bytes\n    fn extract_data_type_from_response(\u0026self, data: \u0026[u8]) -\u003e Option\u003c(u16, u32)\u003e {\n        if data.len() \u003c 4 {\n            return None;\n        }\n\n        // Look for common Allen-Bradley data type patterns\n        let data_type = u16::from_le_bytes([data[0], data[1]]);\n\n        match data_type {\n            0x00C1 =\u003e Some((0x00C1, 1)),  // BOOL\n            0x00C2 =\u003e Some((0x00C2, 1)),  // SINT\n            0x00C3 =\u003e Some((0x00C3, 2)),  // INT\n            0x00C4 =\u003e Some((0x00C4, 4)),  // DINT\n            0x00C5 =\u003e Some((0x00C5, 8)),  // LINT\n            0x00C6 =\u003e Some((0x00C6, 1)),  // USINT\n            0x00C7 =\u003e Some((0x00C7, 2)),  // UINT\n            0x00C8 =\u003e Some((0x00C8, 4)),  // UDINT\n            0x00C9 =\u003e Some((0x00C9, 8)),  // ULINT\n            0x00CA =\u003e Some((0x00CA, 4)),  // REAL\n            0x00CB =\u003e Some((0x00CB, 8)),  // LREAL\n            0x00CE =\u003e Some((0x00CE, 86)), // STRING (82 chars + 4 length)\n            _ =\u003e None,\n        }\n    }\n\n    /// Validates tag name similar to the contributor's JavaScript validation\n    fn validate_tag_name(\u0026self, tag_name: \u0026str) -\u003e bool {\n        if tag_name.is_empty() || tag_name.trim().is_empty() {\n            return false;\n        }\n\n        // Check for valid characters: alphanumeric, dots, underscores\n        let valid_tag_name_regex =\n            regex::Regex::new(r\"^[a-zA-Z][a-zA-Z0-9]*(?:[._][a-zA-Z0-9]+)*$\").unwrap();\n\n        if !valid_tag_name_regex.is_match(tag_name) {\n            return false;\n        }\n\n        // Check for invalid patterns\n        if tag_name.starts_with(char::is_numeric) {\n            return false;\n        }\n\n        if tag_name.contains(\"__\") || tag_name.contains(\"..\") {\n            return false;\n        }\n\n        true\n    }\n\n    /// Gets a cached UDT definition\n    pub fn get_udt_definition_cached(\u0026self, udt_name: \u0026str) -\u003e Option\u003cUdtDefinition\u003e {\n        let definitions = self.udt_definitions.read().unwrap();\n        definitions.get(udt_name).cloned()\n    }\n\n    /// Lists all cached UDT definitions\n    pub fn list_udt_definitions(\u0026self) -\u003e Vec\u003cString\u003e {\n        let definitions = self.udt_definitions.read().unwrap();\n        definitions.keys().cloned().collect()\n    }\n\n    /// Clears UDT definition cache\n    pub fn clear_udt_cache(\u0026self) {\n        let mut definitions = self.udt_definitions.write().unwrap();\n        definitions.clear();\n    }\n\n    pub fn parse_tag_list(\u0026self, response: \u0026[u8]) -\u003e Result\u003cVec\u003c(String, TagMetadata)\u003e\u003e {\n        println!(\n            \"[DEBUG] Raw tag list response ({} bytes): {:02X?}\",\n            response.len(),\n            response\n        );\n\n        let mut tags = Vec::new();\n\n        // Allen-Bradley tag list response format:\n        // [Status(4)][ItemCount(4)][Items...]\n        // Each item: [InstanceID(4)][NameLength(2)][Name][Type(2)][AdditionalData...]\n\n        if response.len() \u003c 8 {\n            return Err(crate::error::EtherNetIpError::Protocol(\n                \"Response too short for tag list\".to_string(),\n            ));\n        }\n\n        // Skip status (4 bytes) and get item count\n        let item_count = u32::from_le_bytes([response[4], response[5], response[6], response[7]]);\n        println!(\"[DEBUG] Detected item count: {}\", item_count);\n\n        let mut offset = 8; // Skip status and item count\n\n        // Parse each tag entry\n        while offset \u003c response.len() {\n            // Check if we have enough bytes for instance ID\n            if offset + 4 \u003e response.len() {\n                println!(\"[WARN] Not enough bytes for instance ID at offset {offset}\");\n                break;\n            }\n\n            let instance_id = u32::from_le_bytes([\n                response[offset],\n                response[offset + 1],\n                response[offset + 2],\n                response[offset + 3],\n            ]);\n            offset += 4;\n\n            // Check if we have enough bytes for name length\n            if offset + 2 \u003e response.len() {\n                println!(\"[WARN] Not enough bytes for name length at offset {offset}\",);\n                break;\n            }\n\n            let name_length = u16::from_le_bytes([response[offset], response[offset + 1]]) as usize;\n            offset += 2;\n\n            // Validate name length to prevent the parsing error\n            if name_length \u003e 1000 || name_length == 0 {\n                println!(\n                    \"[WARN] Invalid name length {} at offset {}, skipping entry\",\n                    name_length,\n                    offset - 2\n                );\n                // Try to find the next valid entry by looking for a reasonable pattern\n                // Look for the next 4-byte instance ID pattern\n                let mut found_next = false;\n                let search_start = offset;\n                for i in search_start..response.len().saturating_sub(4) {\n                    if response[i] == 0x00\n                        \u0026\u0026 response[i + 1] == 0x00\n                        \u0026\u0026 response[i + 2] == 0x00\n                        \u0026\u0026 response[i + 3] == 0x00\n                    {\n                        offset = i;\n                        found_next = true;\n                        break;\n                    }\n                }\n                if !found_next {\n                    break;\n                }\n                continue;\n            }\n\n            // Check if we have enough bytes for the tag name\n            if offset + name_length \u003e response.len() {\n                println!(\n                    \"[WARN] Not enough bytes for tag name at offset {} (need {}, have {})\",\n                    offset,\n                    name_length,\n                    response.len() - offset\n                );\n                break;\n            }\n\n            let name = String::from_utf8_lossy(\u0026response[offset..offset + name_length]).to_string();\n            offset += name_length;\n\n            // Check if we have enough bytes for tag type\n            if offset + 2 \u003e response.len() {\n                println!(\"[WARN] Not enough bytes for tag type at offset {offset}\");\n                break;\n            }\n\n            let tag_type = u16::from_le_bytes([response[offset], response[offset + 1]]);\n            offset += 2;\n\n            // Parse tag type information (similar to Node.js implementation)\n            let (type_code, is_structure, array_dims, _reserved) = self.parse_tag_type(tag_type);\n\n            let is_array = array_dims \u003e 0;\n            let dimensions = if is_array {\n                vec![0; array_dims as usize] // Placeholder - actual dimensions would need more parsing\n            } else {\n                Vec::new()\n            };\n\n            let array_info = if is_array \u0026\u0026 !dimensions.is_empty() {\n                Some(ArrayInfo {\n                    element_count: dimensions.iter().product(),\n                    dimensions: dimensions.clone(),\n                })\n            } else {\n                None\n            };\n\n            // Filter tags by type (similar to TypeScript implementation)\n            if !self.is_valid_tag_type(type_code) {\n                println!(\n                    \"[DEBUG] Skipping tag {} - unsupported type 0x{:04X}\",\n                    name, type_code\n                );\n                continue;\n            }\n\n            let metadata = TagMetadata {\n                data_type: type_code,\n                scope: TagScope::Controller,\n                permissions: TagPermissions {\n                    readable: true,\n                    writable: true,\n                },\n                is_array,\n                dimensions,\n r\n    },\r\n\r\n    /// Array element access: `MyArray[5]` or `MyArray[1,2,3]`\r\n    Array {\r\n        base_path: Box\u003cTagPath\u003e,\r\n        indices: Vec\u003cu32\u003e,\r\n    },\r\n\r\n    /// Bit access within a tag: \"MyDINT.15\"\r\n    Bit {\r\n        base_path: Box\u003cTagPath\u003e,\r\n        bit_index: u8,\r\n    },\r\n\r\n    /// UDT member access: \"MyUDT.Member1\"\r\n    Member {\r\n        base_path: Box\u003cTagPath\u003e,\r\n        member_name: String,\r\n    },\r\n\r\n    /// String length access: \"MyString.LEN\"\r\n    StringLength { base_path: Box\u003cTagPath\u003e },\r\n\r\n    /// String data access: \"MyString.DATA[5]\"\r\n    StringData { base_path: Box\u003cTagPath\u003e, index: u32 },\r\n}\r\n\r\nimpl TagPath {\r\n    /// Parses a tag path string into a structured `TagPath`\r\n    ///\r\n    /// # Examples\r\n    ///\r\n    /// ```rust\r\n    /// use rust_ethernet_ip::TagPath;\r\n    ///\r\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\r\n    /// // Simple controller tag\r\n    /// let path = TagPath::parse(\"MyTag\")?;\r\n    ///\r\n    /// // Program-scoped tag\r\n    /// let path = TagPath::parse(\"Program:MainProgram.MyTag\")?;\r\n    ///\r\n    /// // Array element\r\n    /// let path = TagPath::parse(\"MyArray[5]\")?;\r\n    ///\r\n    /// // Multi-dimensional array\r\n    /// let path = TagPath::parse(\"Matrix[1,2,3]\")?;\r\n    ///\r\n    /// // Bit access\r\n    /// let path = TagPath::parse(\"StatusWord.15\")?;\r\n    ///\r\n    /// // UDT member\r\n    /// let path = TagPath::parse(\"MotorData.Speed\")?;\r\n    ///\r\n    /// // Complex nested path\r\n    /// let path = TagPath::parse(\"Program:Safety.Devices[2].Status.15\")?;\r\n    /// # Ok(())\r\n    /// # }\r\n    /// ```\r\n    pub fn parse(path_str: \u0026str) -\u003e Result\u003cSelf\u003e {\r\n        let parser = TagPathParser::new(path_str);\r\n        parser.parse()\r\n    }\r\n\r\n    /// Converts the `TagPath` back to a string representation\r\n    pub fn as_string(\u0026self) -\u003e String {\r\n        match self {\r\n            TagPath::Controller { tag_name } =\u003e tag_name.clone(),\r\n            TagPath::Program {\r\n                program_name,\r\n                tag_name,\r\n            } =\u003e {\r\n                format!(\"Program:{program_name}.{tag_name}\")\r\n            }\r\n            TagPath::Array { base_path, indices } =\u003e {\r\n                let base = base_path.as_string();\r\n                let indices_str = indices\r\n                    .iter()\r\n                    .map(u32::to_string)\r\n                    .collect::\u003cVec\u003c_\u003e\u003e()\r\n                    .join(\",\");\r\n                format!(\"{base}[{indices_str}]\")\r\n            }\r\n            TagPath::Bit {\r\n                base_path,\r\n                bit_index,\r\n            } =\u003e {\r\n                format!(\"{base_path}.{bit_index}\")\r\n            }\r\n            TagPath::Member {\r\n                base_path,\r\n                member_name,\r\n            } =\u003e {\r\n                format!(\"{base_path}.{member_name}\")\r\n            }\r\n            TagPath::StringLength { base_path } =\u003e {\r\n                format!(\"{base_path}.LEN\")\r\n            }\r\n            TagPath::StringData { base_path, index } =\u003e {\r\n                format!(\"{base_path}.DATA[{index}]\")\r\n            }\r\n        }\r\n    }\r\n\r\n    /// Generates the CIP path bytes for this tag path\r\n    ///\r\n    /// This converts the structured tag path into the binary format\r\n    /// required by the CIP protocol for EtherNet/IP communication.\r\n    pub fn to_cip_path(\u0026self) -\u003e Result\u003cVec\u003cu8\u003e\u003e {\r\n        let mut path = Vec::new();\r\n        self.build_cip_path(\u0026mut path)?;\r\n\r\n        // Pad to even length if necessary\r\n        if path.len() % 2 != 0 {\r\n            path.push(0x00);\r\n        }\r\n\r\n        Ok(path)\r\n    }\r\n\r\n    /// Recursively builds the CIP path bytes\r\n    fn build_cip_path(\u0026self, path: \u0026mut Vec\u003cu8\u003e) -\u003e Result\u003c()\u003e {\r\n        match self {\r\n            TagPath::Controller { tag_name } =\u003e {\r\n                // ANSI Extended Symbol Segment\r\n                path.push(0x91);\r\n                path.push(tag_name.len() as u8);\r\n                path.extend_from_slice(tag_name.as_bytes());\r\n            }\r\n\r\n            TagPath::Program {\r\n                program_name,\r\n                tag_name,\r\n            } =\u003e {\r\n                // Program scope requires special handling\r\n                // First add program name segment\r\n                path.push(0x91);\r\n                let program_path = format!(\"Program:{program_name}\");\r\n                path.push(program_path.len() as u8);\r\n                path.extend_from_slice(program_path.as_bytes());\r\n\r\n                // Then add tag name segment\r\n                path.push(0x91);\r\n                path.push(tag_name.len() as u8);\r\n                path.extend_from_slice(tag_name.as_bytes());\r\n            }\r\n\r\n            TagPath::Array { base_path, indices } =\u003e {\r\n                // Build base path first\r\n                base_path.build_cip_path(path)?;\r\n\r\n                // Add array indices\r\n                for \u0026index in indices {\r\n                    path.push(0x28); // Element segment\r\n                    path.extend_from_slice(\u0026index.to_le_bytes());\r\n                }\r\n            }\r\n\r\n            TagPath::Bit {\r\n                base_path,\r\n                bit_index,\r\n            } =\u003e {\r\n                // Build base path first\r\n                base_path.build_cip_path(path)?;\r\n\r\n                // Add bit segment\r\n                path.push(0x29); // Bit segment\r\n                path.push(*bit_index);\r\n            }\r\n\r\n            TagPath::Member {\r\n                base_path,\r\n                member_name,\r\n            } =\u003e {\r\n                // Build base path first\r\n                base_path.build_cip_path(path)?;\r\n\r\n                // Add member segment\r\n                path.push(0x91);\r\n                path.push(member_name.len() as u8);\r\n                path.extend_from_slice(member_name.as_bytes());\r\n            }\r\n\r\n            TagPath::StringLength { base_path } =\u003e {\r\n                // Build base path first\r\n                base_path.build_cip_path(path)?;\r\n\r\n                // Add LEN member\r\n                path.push(0x91);\r\n                path.push(3); // \"LEN\".len()\r\n                path.extend_from_slice(b\"LEN\");\r\n            }\r\n\r\n            TagPath::StringData { base_path, index } =\u003e {\r\n                // Build base path first\r\n                base_path.build_cip_path(path)?;\r\n\r\n                // Add DATA member\r\n                path.push(0x91);\r\n                path.push(4); // \"DATA\".len()\r\n                path.extend_from_slice(b\"DATA\");\r\n\r\n                // Add array index\r\n                path.push(0x28); // Element segment\r\n                path.extend_from_slice(\u0026index.to_le_bytes());\r\n            }\r\n        }\r\n\r\n        Ok(())\r\n    }\r\n\r\n    /// Returns the base tag name without any path qualifiers\r\n    pub fn base_tag_name(\u0026self) -\u003e String {\r\n        match self {\r\n            TagPath::Controller { tag_name } =\u003e tag_name.clone(),\r\n            TagPath::Program { tag_name, .. } =\u003e tag_name.clone(),\r\n            TagPath::Array { base_path, .. } =\u003e base_path.base_tag_name(),\r\n            TagPath::Bit { base_path, .. } =\u003e base_path.base_tag_name(),\r\n            TagPath::Member { base_path, .. } =\u003e base_path.base_tag_name(),\r\n            TagPath::StringLength { base_path } =\u003e base_path.base_tag_name(),\r\n            TagPath::StringData { base_path, .. } =\u003e base_path.base_tag_name(),\r\n        }\r\n    }\r\n\r\n    /// Returns true if this is a program-scoped tag\r\n    pub fn is_program_scoped(\u0026self) -\u003e bool {\r\n        match self {\r\n            TagPath::Program { .. } =\u003e true,\r\n            TagPath::Array { base_path, .. } =\u003e base_path.is_program_scoped(),\r\n            TagPath::Bit { base_path, .. } =\u003e base_path.is_program_scoped(),\r\n            TagPath::Member { base_path, .. } =\u003e base_path.is_program_scoped(),\r\n            TagPath::StringLength { base_path } =\u003e base_path.is_program_scoped(),\r\n            TagPath::StringData { base_path, .. } =\u003e base_path.is_program_scoped(),\r\n            TagPath::Controller { .. } =\u003e false,\r\n        }\r\n    }\r\n\r\n    /// Returns the program name if this is a program-scoped tag\r\n    pub fn program_name(\u0026self) -\u003e Option\u003cString\u003e {\r\n        match self {\r\n            TagPath::Program { program_name, .. } =\u003e Some(program_name.clone()),\r\n            TagPath::Array { base_path, .. } =\u003e base_path.program_name(),\r\n            TagPath::Bit { base_path, .. } =\u003e base_path.program_name(),\r\n            TagPath::Member { base_path, .. } =\u003e base_path.program_name(),\r\n            TagPath::StringLength { base_path } =\u003e base_path.program_name(),\r\n            TagPath::StringData { base_path, .. } =\u003e base_path.program_name(),\r\n            TagPath::Controller { .. } =\u003e None,\r\n        }\r\n    }\r\n}\r\n\r\nimpl fmt::Display for TagPath {\r\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\r\n        write!(f, \"{}\", self.as_string())\r\n    }\r\n}\r\n\r\n/// Internal parser for tag path strings\r\nstruct TagPathParser\u003c'a\u003e {\r\n    input: \u0026'a str,\r\n    position: usize,\r\n}\r\n\r\nimpl\u003c'a\u003e TagPathParser\u003c'a\u003e {\r\n    fn new(input: \u0026'a str) -\u003e Self {\r\n        Self { input, position: 0 }\r\n    }\r\n\r\n    fn parse(mut self) -\u003e Result\u003cTagPath\u003e {\r\n        self.parse_path()\r\n    }\r\n\r\n    fn parse_path(\u0026mut self) -\u003e Result\u003cTagPath\u003e {\r\n        // Check for program scope\r\n        if self.input.starts_with(\"Program:\") {\r\n            self.parse_program_scoped()\r\n        } else {\r\n            self.parse_controller_scoped()\r\n        }\r\n    }\r\n\r\n    fn parse_program_scoped(\u0026mut self) -\u003e Result\u003cTagPath\u003e {\r\n        // Skip \"Program:\"\r\n        self.position = 8;\r\n\r\n        // Parse program name (until first dot)\r\n        let program_name = self.parse_identifier()?;\r\n\r\n        // Expect dot\r\n        if !self.consume_char('.') {\r\n            return Err(EtherNetIpError::Protocol(\r\n                \"Expected '.' after program name\".to_string(),\r\n            ));\r\n        }\r\n\r\n        // Parse tag name\r\n        let tag_name = self.parse_identifier()?;\r\n\r\n        let mut path = TagPath::Program {\r\n            program_name,\r\n            tag_name,\r\n        };\r\n\r\n        // Parse any additional qualifiers (arrays, members, bits)\r\n        while self.position \u003c self.input.len() {\r\n            path = self.parse_qualifier(path)?;\r\n        }\r\n\r\n        Ok(path)\r\n    }\r\n\r\n    fn parse_controller_scoped(\u0026mut self) -\u003e Result\u003cTagPath\u003e {\r\n        let tag_name = self.parse_identifier()?;\r\n        let mut path = TagPath::Controller { tag_name };\r\n\r\n        // Parse any additional qualifiers\r\n        while self.position \u003c self.input.len() {\r\n            path = self.parse_qualifier(path)?;\r\n        }\r\n\r\n        Ok(path)\r\n    }\r\n\r\n    fn parse_qualifier(\u0026mut self, base_path: TagPath) -\u003e Result\u003cTagPath\u003e {\r\n        match self.peek_char() {\r\n            Some('[') =\u003e self.parse_array_access(base_path),\r\n            Some('.') =\u003e self.parse_member_or_bit_access(base_path),\r\n            _ =\u003e Err(EtherNetIpError::Protocol(format!(\r\n                \"Unexpected character at position {}\",\r\n                self.position\r\n            ))),\r\n        }\r\n    }\r\n\r\n    fn parse_array_access(\u0026mut self, base_path: TagPath) -\u003e Result\u003cTagPath\u003e {\r\n        // Consume '['\r\n        self.consume_char('[');\r\n\r\n        let mut indices = Vec::new();\r\n\r\n        // Parse first index\r\n        indices.push(self.parse_number()?);\r\n\r\n        // Parse additional indices separated by commas\r\n        while self.peek_char() == Some(',') {\r\n            self.consume_char(',');\r\n            indices.push(self.parse_number()?);\r\n        }\r\n\r\n        // Expect ']'\r\n        if !self.consume_char(']') {\r\n            return Err(EtherNetIpError::Protocol(\r\n                \"Expected ']' after array indices\".to_string(),\r\n            ));\r\n        }\r\n\r\n        Ok(TagPath::Array {\r\n            base_path: Box::new(base_path),\r\n            indices,\r\n        })\r\n    }\r\n\r\n    fn parse_member_or_bit_access(\u0026mut self, base_path: TagPath) -\u003e Result\u003cTagPath\u003e {\r\n        // Consume '.'\r\n        self.consume_char('.');\r\n\r\n        // Check for special string operations\r\n        if self.input[self.position..].starts_with(\"LEN\") {\r\n            self.position += 3;\r\n            return Ok(TagPath::StringLength {\r\n                base_path: Box::new(base_path),\r\n            });\r\n        }\r\n\r\n        if self.input[self.position..].starts_with(\"DATA[\") {\r\n            self.position += 5; // Skip \"DATA[\"\r\n            let index = self.parse_number()?;\r\n            if !self.consume_char(']') {\r\n                return Err(EtherNetIpError::Protocol(\r\n                    \"Expected ']' after DATA index\".to_string(),\r\n                ));\r\n            }\r\n            return Ok(TagPath::StringData {\r\n                base_path: Box::new(base_path),\r\n                index,\r\n            });\r\n        }\r\n\r\n        // Parse identifier (could be member name or bit index)\r\n        let identifier = self.parse_identifier()?;\r\n\r\n        // Check if it's a numeric bit index\r\n        if let Ok(bit_index) = identifier.parse::\u003cu8\u003e() {\r\n            if bit_index \u003c 32 {\r\n                // Valid bit range for DINT\r\n                return Ok(TagPath::Bit {\r\n                    base_path: Box::new(base_path),\r\n                    bit_index,\r\n                });\r\n            }\r\n        }\r\n\r\n        // It's a member name\r\n        Ok(TagPath::Member {\r\n            base_path: Box::new(base_path),\r\n            member_name: identifier,\r\n        })\r\n    }\r\n\r\n    fn parse_identifier(\u0026mut self) -\u003e Result\u003cString\u003e {\r\n        let start = self.position;\r\n\r\n        while self.position \u003c self.input.len() {\r\n            let ch = self.input.chars().nth(self.position).unwrap();\r\n            if ch.is_alphanumeric() || ch == '_' {\r\n                self.position += 1;\r\n            } else {\r\n                break;\r\n            }\r\n        }\r\n\r\n        if start == self.position {\r\n            return Err(EtherNetIpError::Protocol(\"Expected identifier\".to_string()));\r\n        }\r\n\r\n        Ok(self.input[start..self.position].to_string())\r\n    }\r\n\r\n    fn parse_number(\u0026mut self) -\u003e Result\u003cu32\u003e {\r\n        let start = self.position;\r\n\r\n        while self.position \u003c self.input.len() {\r\n            let ch = self.input.chars().nth(self.position).unwrap();\r\n            if ch.is_ascii_digit() {\r\n                self.position += 1;\r\n            } else {\r\n                break;\r\n            }\r\n        }\r\n\r\n        if start == self.position {\r\n            return Err(EtherNetIpError::Protocol(\"Expected number\".to_string()));\r\n        }\r\n\r\n        self.input[start..self.position]\r\n            .parse()\r\n            .map_err(|_| EtherNetIpError::Protocol(\"Invalid number\".to_string()))\r\n    }\r\n\r\n    fn peek_char(\u0026self) -\u003e Option\u003cchar\u003e {\r\n        self.input.chars().nth(self.position)\r\n    }\r\n\r\n    fn consume_char(\u0026mut self, expected: char) -\u003e bool {\r\n        if self.peek_char() == Some(expected) {\r\n            self.position += 1;\r\n            true\r\n        } else {\r\n            false\r\n        }\r\n    }\r\n}\r\n\r\n#[cfg(test)]\r\nmod tests {\r\n    use super::*;\r\n\r\n    #[test]\r\n    fn test_controller_scoped_tag() {\r\n        let path = TagPath::parse(\"MyTag\").unwrap();\r\n        assert_eq!(\r\n            path,\r\n            TagPath::Controller {\r\n                tag_name: \"MyTag\".to_string()\r\n            }\r\n        );\r\n        assert_eq!(path.to_string(), \"MyTag\");\r\n    }\r\n\r\n    #[test]\r\n    fn test_program_scoped_tag() {\r\n        let path = TagPath::parse(\"Program:MainProgram.MyTag\").unwrap();\r\n        assert_eq!(\r\n            path,\r\n            TagPath::Program {\r\n                program_name: \"MainProgram\".to_string(),\r\n                tag_name: \"MyTag\".to_string()\r\n            }\r\n        );\r\n        assert_eq!(path.to_string(), \"Program:MainProgram.MyTag\");\r\n        assert!(path.is_program_scoped());\r\n        assert_eq!(path.program_name(), Some(\"MainProgram\".to_string()));\r\n    }\r\n\r\n    #[test]\r\n    fn test_array_access() {\r\n        let path = TagPath::parse(\"MyArray[5]\").unwrap();\r\n        if let TagPath::Array { base_path, indices } = path {\r\n            assert_eq!(\r\n                *base_path,\r\n                TagPath::Controller {\r\n                    tag_name: \"MyArray\".to_string()\r\n                }\r\n            );\r\n            assert_eq!(indices, vec![5]);\r\n        } else {\r\n            panic!(\"Expected Array path\");\r\n        }\r\n    }\r\n\r\n    #[test]\r\n    fn test_multi_dimensional_array() {\r\n        let path = TagPath::parse(\"Matrix[1,2,3]\").unwrap();\r\n        if let TagPath::Array { base_path, indices } = path {\r\n            assert_eq!(\r\n                *base_path,\r\n                TagPath::Controller {\r\n                    tag_name: \"Matrix\".to_string()\r\n                }\r\n            );\r\n            assert_eq!(indices, vec![1, 2, 3]);\r\n        } else {\r\n            panic!(\"Expected Array path\");\r\n        }\r\n    }\r\n\r\n    #[test]\r\n    fn test_bit_access() {\r\n        let path = TagPath::parse(\"StatusWord.15\").unwrap();\r\n        if let TagPath::Bit {\r\n            base_path,\r\n            bit_index,\r\n        } = path\r\n        {\r\n            assert_eq!(\r\n                *base_path,\r\n                TagPath::Controller {\r\n                    tag_name: \"StatusWord\".to_string()\r\n                }\r\n            );\r\n            assert_eq!(bit_index, 15);\r\n        } else {\r\n            panic!(\"Expected Bit path\");\r\n        }\r\n    }\r\n\r\n    #[test]\r\n    fn test_member_access() {\r\n        let path = TagPath::parse(\"MotorData.Speed\").unwrap();\r\n        if let TagPath::Member {\r\n            base_path,\r\n            member_name,\r\n        } = path\r\n        {\r\n            assert_eq!(\r\n                *base_path,\r\n                TagPath::Controller {\r\n                    tag_name: \"MotorData\".to_string()\r\n                }\r\n            );\r\n            assert_eq!(member_name, \"Speed\");\r\n        } else {\r\n            panic!(\"Expected Member path\");\r\n        }\r\n    }\r\n\r\n    #[test]\r\n    fn test_string_length() {\r\n        let path = TagPath::parse(\"MyString.LEN\").unwrap();\r\n        if let TagPath::StringLength { base_path } = path {\r\n            assert_eq!(\r\n                *base_path,\r\n                TagPath::Controller {\r\n                    tag_name: \"MyString\".to_string()\r\n                }\r\n            );\r\n        } else {\r\n            panic!(\"Expected StringLength path\");\r\n        }\r\n    }\r\n\r\n    #[test]\r\n    fn test_string_data() {\r\n        let path = TagPath::parse(\"MyString.DATA[5]\").unwrap();\r\n        if let TagPath::StringData { base_path, index } = path {\r\n            assert_eq!(\r\n                *base_path,\r\n                TagPath::Controller {\r\n                    tag_name: \"MyString\".to_string()\r\n                }\r\n            );\r\n            assert_eq!(index, 5);\r\n        } else {\r\n            panic!(\"Expected StringData path\");\r\n        }\r\n    }\r\n\r\n    #[test]\r\n    fn test_complex_nested_path() {\r\n        let path = TagPath::parse(\"Program:Safety.Devices[2].Status.15\").unwrap();\r\n\r\n        // This should parse as:\r\n        // Program:Safety.Devices -\u003e Array[2] -\u003e Member(Status) -\u003e Bit(15)\r\n        if let TagPath::Bit {\r\n            base_path,\r\n            bit_index,\r\n        } = path\r\n        {\r\n            assert_eq!(bit_index, 15);\r\n\r\n            if let TagPath::Member {\r\n                base_path,\r\n                member_name,\r\n            } = *base_path\r\n            {\r\n                assert_eq!(member_name, \"Status\");\r\n\r\n                if let TagPath::Array { base_path, indices } = *base_path {\r\n                    assert_eq!(indices, vec![2]);\r\n\r\n                    if let TagPath::Program {\r\n                        program_name,\r\n                        tag_name,\r\n                    } = *base_path\r\n                    {\r\n                        assert_eq!(program_name, \"Safety\");\r\n                        assert_eq!(tag_name, \"Devices\");\r\n                    } else {\r\n                        panic!(\"Expected Program path\");\r\n                    }\r\n                } else {\r\n                    panic!(\"Expected Array path\");\ hange threshold for numeric values\r\n    pub change_threshold: f32,\r\n    /// Timeout in milliseconds\r\n    pub timeout: u32,\r\n}\r\n\r\nimpl Default for SubscriptionOptions {\r\n    fn default() -\u003e Self {\r\n        Self {\r\n            update_rate: 100,        // 100ms default update rate\r\n            change_threshold: 0.001, // 0.1% change threshold\r\n            timeout: 5000,           // 5 second timeout\r\n        }\r\n    }\r\n}\r\n\r\n/// Represents a subscription to a PLC tag\r\n#[derive(Debug, Clone)]\r\npub struct TagSubscription {\r\n    /// The path of the subscribed tag\r\n    pub tag_path: String,\r\n    /// Subscription configuration\r\n    pub options: SubscriptionOptions,\r\n    /// Last received value\r\n    pub last_value: Arc\u003cMutex\u003cOption\u003cPlcValue\u003e\u003e\u003e,\r\n    /// Channel sender for value updates\r\n    pub sender: Arc\u003cMutex\u003cmpsc::Sender\u003cPlcValue\u003e\u003e\u003e,\r\n    /// Channel receiver for value updates\r\n    pub receiver: Arc\u003cMutex\u003cmpsc::Receiver\u003cPlcValue\u003e\u003e\u003e,\r\n    /// Whether the subscription is active\r\n    pub is_active: Arc\u003cAtomicBool\u003e,\r\n}\r\n\r\nimpl TagSubscription {\r\n    /// Creates a new tag subscription\r\n    pub fn new(tag_name: String, options: SubscriptionOptions) -\u003e Self {\r\n        let (sender, receiver) = mpsc::channel(100); // Buffer size of 100\r\n        Self {\r\n            tag_path: tag_name,\r\n            options,\r\n            last_value: Arc::new(Mutex::new(None)),\r\n            sender: Arc::new(Mutex::new(sender)),\r\n            receiver: Arc::new(Mutex::new(receiver)),\r\n            is_active: Arc::new(AtomicBool::new(true)),\r\n        }\r\n    }\r\n\r\n    /// Checks if the subscription is active\r\n    pub fn is_active(\u0026self) -\u003e bool {\r\n        self.is_active.load(std::sync::atomic::Ordering::Relaxed)\r\n    }\r\n\r\n    /// Stops the subscription\r\n    pub fn stop(\u0026self) {\r\n        self.is_active\r\n            .store(false, std::sync::atomic::Ordering::Relaxed);\r\n    }\r\n\r\n    /// Updates the subscription value\r\n    pub async fn update_value(\u0026self, value: \u0026PlcValue) -\u003e Result\u003c()\u003e {\r\n        let mut last_value = self.last_value.lock().await;\r\n\r\n        // Check if value has changed significantly\r\n        if let (Some(PlcValue::Real(old)), PlcValue::Real(new)) = (last_value.as_ref(), value) {\r\n            if (*new - *old).abs() \u003c self.options.change_threshold {\r\n                return Ok(());\r\n            }\r\n        }\r\n\r\n        // Update value and send notification\r\n        *last_value = Some(value.clone());\r\n        let sender = self.sender.lock().await;\r\n        sender\r\n            .send(value.clone())\r\n            .await\r\n            .map_err(|e| EtherNetIpError::Subscription(format!(\"Failed to send update: {e}\")))?;\r\n\r\n        Ok(())\r\n    }\r\n\r\n    /// Waits for the next value update\r\n    pub async fn wait_for_update(\u0026self) -\u003e Result\u003cPlcValue\u003e {\r\n        let mut receiver = self.receiver.lock().await;\r\n        receiver\r\n            .recv()\r\n            .await\r\n            .ok_or_else(|| EtherNetIpError::Subscription(\"Channel closed\".to_string()))\r\n    }\r\n\r\n    /// Gets the last value received\r\n    pub async fn get_last_value(\u0026self) -\u003e Option\u003cPlcValue\u003e {\r\n        self.last_value.lock().await.clone()\r\n    }\r\n}\r\n\r\n/// Manages multiple tag subscriptions\r\n#[derive(Debug, Clone)]\r\npub struct SubscriptionManager {\r\n    subscriptions: Arc\u003cMutex\u003cVec\u003cTagSubscription\u003e\u003e\u003e,\r\n}\r\n\r\nimpl Default for SubscriptionManager {\r\n    fn default() -\u003e Self {\r\n        Self::new()\r\n    }\r\n}\r\n\r\nimpl SubscriptionManager {\r\n    /// Creates a new subscription manager\r\n    pub fn new() -\u003e Self {\r\n        Self {\r\n            subscriptions: Arc::new(Mutex::new(Vec::new())),\r\n        }\r\n    }\r\n\r\n    /// Adds a new subscription\r\n    pub async fn add_subscription(\u0026self, subscription: TagSubscription) {\r\n        let mut subscriptions = self.subscriptions.lock().await;\r\n        subscriptions.push(subscription);\r\n    }\r\n\r\n    /// Removes a subscription\r\n    pub async fn remove_subscription(\u0026self, tag_name: \u0026str) {\r\n        let mut subscriptions = self.subscriptions.lock().await;\r\n        subscriptions.retain(|sub| sub.tag_path != tag_name);\r\n    }\r\n\r\n    /// Updates a value for all matching subscriptions\r\n    pub async fn update_value(\u0026self, tag_name: \u0026str, value: \u0026PlcValue) -\u003e Result\u003c()\u003e {\r\n        let subscriptions = self.subscriptions.lock().await;\r\n        for subscription in subscriptions.iter() {\r\n            if subscription.tag_path == tag_name \u0026\u0026 subscription.is_active() {\r\n                subscription.update_value(value).await?;\r\n            }\r\n        }\r\n        Ok(())\r\n    }\r\n\r\n    /// Gets all active subscriptions\r\n    pub async fn get_subscriptions(\u0026self) -\u003e Vec\u003cTagSubscription\u003e {\r\n        let subscriptions = self.subscriptions.lock().await;\r\n        subscriptions.clone()\r\n    }\r\n\r\n    /// Gets a specific subscription by tag name\r\n    pub async fn get_subscription(\u0026self, tag_name: \u0026str) -\u003e Option\u003cTagSubscription\u003e {\r\n        let subscriptions = self.subscriptions.lock().await;\r\n        subscriptions\r\n            .iter()\r\n            .find(|sub| sub.tag_path == tag_name)\r\n            .cloned()\r\n    }\r\n}\r\n","traces":[{"line":19,"address":[],"length":0,"stats":{"Line":0}},{"line":47,"address":[],"length":0,"stats":{"Line":0}},{"line":48,"address":[],"length":0,"stats":{"Line":0}},{"line":52,"address":[],"length":0,"stats":{"Line":0}},{"line":53,"address":[],"length":0,"stats":{"Line":0}},{"line":54,"address":[],"length":0,"st ize: 0,\r\n            member_offsets: HashMap::new(),\r\n        })\r\n    }\r\n\r\n    /// Converts a UDT instance to a `HashMap` of member values\r\n    pub fn to_hash_map(\u0026self, data: \u0026[u8]) -\u003e crate::error::Result\u003cHashMap\u003cString, PlcValue\u003e\u003e {\r\n        let mut result = HashMap::new();\r\n\r\n        for member in \u0026self.members {\r\n            let offset = member.offset as usize;\r\n            if offset + member.size as usize \u003c= data.len() {\r\n                let member_data = \u0026data[offset..offset + member.size as usize];\r\n                let value = self.parse_member_value(member, member_data)?;\r\n                result.insert(member.name.clone(), value);\r\n            }\r\n        }\r\n\r\n        Ok(result)\r\n    }\r\n\r\n    /// Parses a member value from raw data\r\n    fn parse_member_value(\r\n        \u0026self,\r\n        member: \u0026UdtMember,\r\n        data: \u0026[u8],\r\n    ) -\u003e crate::error::Result\u003cPlcValue\u003e {\r\n        match member.data_type {\r\n            0x00C1 =\u003e Ok(PlcValue::Bool(data[0] != 0)),\r\n            0x00C4 =\u003e {\r\n                let mut bytes = [0u8; 4];\r\n                bytes.copy_from_slice(\u0026data[..4]);\r\n                Ok(PlcValue::Dint(i32::from_le_bytes(bytes)))\r\n            }\r\n            0x00CA =\u003e {\r\n                let mut bytes = [0u8; 4];\r\n                bytes.copy_from_slice(\u0026data[..4]);\r\n                Ok(PlcValue::Real(f32::from_le_bytes(bytes)))\r\n            }\r\n            _ =\u003e Err(crate::error::EtherNetIpError::Protocol(\r\n                \"Unsupported data type\".to_string(),\r\n            )),\r\n        }\r\n    }\r\n}\r\n\r\n#[cfg(test)]\r\nmod tests {\r\n    use super::*;\r\n\r\n    #[test]\r\n    fn test_udt_member_offsets() {\r\n        let mut udt = UserDefinedType::new(\"TestUDT\".to_string());\r\n\r\n        udt.add_member(UdtMember {\r\n            name: \"Bool1\".to_string(),
