\r\n            tag_name: \"ValidTag\".to_string(),\r\n        },\r\n        BatchOperation::Read {\r\n            tag_name: \"NonExistentTag_12345\".to_string(),\r\n        },\r\n        BatchOperation::Write {\r\n            tag_name: \"AnotherValidTag\".to_string(),\r\n            value: PlcValue::Dint(100),\r\n        },\r\n        BatchOperation::Read {\r\n            tag_name: \"\".to_string(),\r\n        }, // Invalid tag name\r\n    ];\r\n\r\n    println!(\"🧪 Testing error handling with problematic operations...\");\r\n\r\n    match client.execute_batch(\u0026operations_with_errors).await {\r\n        Ok(results) =\u003e {\r\n            println!(\"✅ Batch completed with mixed results:\");\r\n\r\n            let mut success_count = 0;\r\n            let mut error_count = 0;\r\n\r\n            for result in results {\r\n                match result.operation {\r\n                    BatchOperation::Read { tag_name } =\u003e match result.result {\r\n                        Ok(Some(value)) =\u003e {\r\n                            println!(\"  ✅ Read {}: {:?}\", tag_name, value);\r\n                            success_count += 1;\r\n                        }\r\n                        Ok(None) =\u003e {\r\n                            println!(\"  ⚠️  Read {}: No data\", tag_name);\r\n                            error_count += 1;\r\n                        }\r\n                        Err(error) =\u003e {\r\n                            println!(\"  ❌ Read {}: {}\", tag_name, error);\r\n                            error_count += 1;\r\n                        }\r\n                    },\r\n                    BatchOperation::Write { tag_name, .. } =\u003e match result.result {\r\n                        Ok(_) =\u003e {\r\n                            println!(\"  ✅ Write {}: Success\", tag_name);\r\n                            success_count += 1;\r\n                        }\r\n                        Err(error) =\u003e {\r\n                            println!(\"  ❌ Write {}: {}\", tag_name, error);\r\n                            error_count += 1;\r\n                        }\r\n                    },\r\n                }\r\n            }\r\n\r\n            println!(\"\\n📊 Results summary:\");\r\n            println!(\"  • Successful operations: {}\", success_count);\r\n            println!(\"  • Failed operations: {}\", error_count);\r\n            println!(\r\n                \"  • Success rate: {:.1}%\",\r\n                (success_count as f32 / (success_count + error_count) as f32) * 100.0\r\n            );\r\n        }\r\n        Err(e) =\u003e {\r\n            println!(\"❌ Entire batch failed: {}\", e);\r\n            println!(\"💡 This demonstrates batch-level error handling\");\r\n        }\r\n    }\r\n\r\n    println!();\r\n    Ok(())\r\n}\r\n\r\n/// Demonstrates the API usage without requiring an actual PLC connection\r\nfn demonstrate_batch_api_usage() {\r\n    println!(\"📚 Batch Operations API Usage Examples\");\r\n    println!(\"======================================\\n\");\r\n\r\n    // Example 1: Creating batch operations\r\n    println!(\"1️⃣  Creating Batch Operations:\");\r\n    println!(\"```rust\");\r\n    println!(\"use rust_ethernet_ip::{{BatchOperation, PlcValue}};\");\r\n    println!();\r\n    println!(\"let operations = vec![\");\r\n    println!(\"    BatchOperation::Read {{ tag_name: \\\"Temperature\\\".to_string() }},\");\r\n    println!(\"    BatchOperation::Write {{ \");\r\n    println!(\"        tag_name: \\\"Setpoint\\\".to_string(), \");\r\n    println!(\"        value: PlcValue::Real(75.5) \");\r\n    println!(\"    }},\");\r\n    println!(\"];\");\r\n    println!(\"```\\n\");\r\n\r\n    // Example 2: Batch configuration\r\n    println!(\"2️⃣  Configuring Batch Behavior:\");\r\n    println!(\"```rust\");\r\n    println!(\"use rust_ethernet_ip::BatchConfig;\");\r\n    println!();\r\n    println!(\"let high_performance_config = BatchConfig {{\");\r\n    println!(\"    max_operations_per_packet: 50,\");\r\n    println!(\"    max_packet_size: 4000,\");\r\n    println!(\"    packet_timeout_ms: 1000,\");\r\n    println!(\"    continue_on_error: true,\");\r\n    println!(\"    optimize_packet_packing: true,\");\r\n    println!(\"}};\");\r\n    println!();\r\n    println!(\"client.configure_batch_operations(high_performance_config);\");\r\n    println!(\"```\\n\");\r\n\r\n    // Example 3: Executing batch operations\r\n    println!(\"3️⃣  Executing Batch Operations:\");\r\n    println!(\"```rust\");\r\n    println!(\"// Execute mixed operations\");\r\n    println!(\"let results = client.execute_batch(\u0026operations).await?;\");\r\n    println!();\r\n    println!(\"// Or use convenience methods\");\r\n    println!(\"let read_results = client.read_tags_batch(\u0026[\\\"Tag1\\\", \\\"Tag2\\\"]).await?;\");\r\n    println!(\"let write_results = client.write_tags_batch(\u0026[\");\r\n    println!(\"    (\\\"SetPoint1\\\", PlcValue::Dint(1500)),\");\r\n    println!(\"    (\\\"EnableFlag\\\", PlcValue::Bool(true)),\");\r\n    println!(\"]).await?;\");\r\n    println!(\"```\\n\");\r\n\r\n    // Example 4: Error handling\r\n    println!(\"4️⃣  Handling Results and Errors:\");\r\n    println!(\"```rust\");\r\n    println!(\"for result in results {{\");\r\n    println!(\"    match result.operation {{\");\r\n    println!(\"        BatchOperation::Read {{ tag_name }} =\u003e {{\");\r\n    println!(\"            match result.result {{\");\r\n    println!(\r\n        \"                Ok(Some(value)) =\u003e println!(\\\"Read {{}}: {{:?}}\\\", tag_name, value),\"\r\n    );\r\n    println!(\"                Ok(None) =\u003e println!(\\\"No data for {{}}\\\", tag_name),\");\r\n    println!(\r\n        \"                Err(error) =\u003e println!(\\\"Error reading {{}}: {{}}\\\", tag_name, error),\"\r\n    );\r\n    println!(\"            }}\");\r\n    println!(\"        }}\");\r\n    println!(\"        BatchOperation::Write {{ tag_name, .. }} =\u003e {{\");\r\n    println!(\"            match result.result {{\");\r\n    println!(\"                Ok(_) =\u003e println!(\\\"Write {{}} successful\\\", tag_name),\");\r\n    println!(\r\n        \"                Err(error) =\u003e println!(\\\"Error writing {{}}: {{}}\\\", tag_name, error),\"\r\n    );\r\n    println!(\"            }}\");\r\n    println!(\"        }}\");\r\n    println!(\"    }}\");\r\n    println!(\"}}\");\r\n    println!(\"```\\n\");\r\n\r\n    // Performance tips\r\n    println!(\"🚀 Performance Tips:\");\r\n    println!(\"• Use batch operations for 3+ operations to see significant benefits\");\r\n    println!(\"• Group similar operations (reads together, writes together) for optimal packing\");\r\n    println!(\"• Adjust max_operations_per_packet based on your PLC's capabilities\");\r\n    println!(\"• Use higher packet sizes (up to 4000 bytes) for modern PLCs\");\r\n    println!(\"• Enable continue_on_error for data collection scenarios\");\r\n    println!(\"• Disable optimize_packet_packing if operation order is critical\\n\");\r\n\r\n    println!(\"📖 For more examples, see the documentation and integration tests.\");\r\n}\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","sheco","projects","rust-ethernet-ip","examples","connection_test.rs"],"content":"use rust_ethernet_ip::EipClient;\r\nuse std::net::{TcpStream, ToSocketAddrs};\r\nuse std::time::{Duration, Instant};\r\nuse tokio::time::timeout;\r\n\r\n#[tokio::main]\r\nasync fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error + Send + Sync\u003e\u003e {\r\n    println!(\"🔍 EtherNet/IP PLC Connection Diagnostic Tool\");\r\n    println!(\"============================================\");\r\n\r\n    // Test different common PLC IP addresses\r\n    let test_addresses = vec![\r\n        \"192.168.0.1:44818\", // Current configured address\r\n    ];\r\n\r\n    println!(\"\\n📡 Testing TCP connectivity first...\");\r\n    println!(\"------------------------------------\");\r\n\r\n    for addr in \u0026test_addresses {\r\n        print!(\"Testing {:\u003c20} -\u003e \", addr);\r\n        match test_tcp_connection(addr).await {\r\n            Ok(duration) =\u003e println!(\"✅ Connected in {:?}\", duration),\r\n            Err(e) =\u003e println!(\"❌ Failed: {}\", e),\r\n        }\r\n    }\r\n\r\n    println!(\"\\n🔧 Testing EtherNet/IP protocol...\");\r\n    println!(\"----------------------------------\");\r\n\r\n    for addr in \u0026test_addresses {\r\n        print!(\"EIP to {:\u003c20} -\u003e \", addr);\r\n        match test_eip_connection(addr).await {\r\n            Ok(duration) =\u003e println!(\"✅ EtherNet/IP OK in {:?}\", duration),\r\n            Err(e) =\u003e println!(\"❌ EIP Failed: {}\", e),\r\n        }\r\n    }\r\n\r\n    println!(\"\\n🌐 Network Interface Information\");\r\n    println!(\"-------------------------------\");\r\n    show_network_info().await;\r\n\r\n    println!(\"\\n💡 Troubleshooting Tips:\");\r\n    println!(\"========================\");\r\n    println!(\"1. ✅ Verify PLC IP address in Studio 5000/RSLogix\");\r\n    println!(\"2. ✅ Check PLC EtherNet/IP module status\");\r\n    println!(\"3. ✅ Ping the PLC: ping \u003cPLC_IP\u003e\");\r\n    println!(\"4. ✅ Verify PLC is on same network subnet\");\r\n    println!(\"5. ✅ Check Windows Firewall settings\");\r\n    println!(\"6. ✅ Ensure PLC communication module is running\");\r\n    println!(\"7. ✅ Try telnet \u003cPLC_IP\u003e 44818 from command line\");\r\n\r\n    Ok(())\r\n}\r\n\r\nasync fn test_tcp_connection(\r\n    addr: \u0026str,\r\n) -\u003e Result\u003cDuration, Box\u003cdyn std::error::Error + Send + Sync\u003e\u003e {\r\n    let start = Instant::now();\r\n\r\n    // Try to resolve the address first\r\n    let socket_addrs: Vec\u003c_\u003e = addr.to_socket_addrs()?.collect();\r\n    if socket_addrs.is_empty() {\r\n        return Err(\"Address resolution failed\".into());\r\n    }\r\n\r\n    // Test TCP connection with timeout\r\n    match timeout(Duration::from_secs(5), async { TcpStream::connect(addr) }).await {\r\n        Ok(Ok(_stream)) =\u003e Ok(start.elapsed()),\r\n        Ok(Err(e)) =\u003e Err(format!(\"TCP error: {}\", e).into()),\r\n        Err(_) =\u003e Err(\"Connection timeout (5s)\".into()),\r\n    }\r\n}\r\n\r\nasync fn test_eip_connection(\r\n    addr: \u0026str,\r\n) -\u003e Result\u003cDuration, Box\u003cdyn std::error::Error + Send + Sync\u003e\u003e {\r\n    let start = Instant::now();\r\n\r\n    match timeout(Duration::from_secs(10), async {\r\n        EipClient::connect(addr).await\r\n    })\r\n    .await\r\n    {\r\n        Ok(Ok(_client)) =\u003e Ok(start.elapsed()),\r\n        Ok(Err(e)) =\u003e Err(format!(\"EIP error: {}\", e).into()),\r\n        Err(_) =\u003e Err(\"EIP timeout (10s)\".into()),\r\n    }\r\n}\r\n\r\nasync fn show_network_info() {\r\n    use std::process::Command;\r\n\r\n    // Try to get local IP addresses\r\n    match Command::new(\"ipconfig\").output() {\r\n        Ok(output) =\u003e {\r\n            let output_str = String::from_utf8_lossy(\u0026output.stdout);\r\n\r\n            // Extract relevant network information\r\n            for line in output_str.lines() {\r\n                if line.contains(\"IPv4 Address\")\r\n                    || line.contains(\"Subnet Mask\")\r\n                    || line.contains(\"Default Gateway\")\r\n                {\r\n                    println!(\"  {}\", line.trim());\r\n                }\r\n            }\r\n        }\r\n        Err(_) =\u003e {\r\n            println!(\"  ❌ Could not retrieve network information\");\r\n            println!(\"  💡 Run 'ipconfig' manually to check your network settings\");\r\n        }\r\n    }\r\n}\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","sheco","projects","rust-ethernet-ip","examples","data_types_showcase.rs"],"content":"// examples/data_types_showcase.rs\r\n// =========================================================================\r\n//\r\n// Data Types Showcase for Allen-Bradley PLCs\r\n//\r\n// This example demonstrates all the data types supported by the\r\n// rust-ethernet-ip library for CompactLogix and ControlLogix PLCs:\r\n//\r\n// - All integer types (signed and unsigned)\r\n// - Floating point types (REAL and LREAL)\r\n// - Boolean and string types\r\n// - User Defined Types (UDTs)\r\n//\r\n// =========================================================================\r\n\r\nuse rust_ethernet_ip::{EipClient, PlcValue};\r\nuse std::collections::HashMap;\r\nuse std::error::Error;\r\n\r\n#[tokio::main]\r\nasync fn main() -\u003e Result\u003c(), Box\u003cdyn Error\u003e\u003e {\r\n    println!(\"🎯 Allen-Bradley Data Types Showcase\");\r\n    println!(\"====================================\");\r\n\r\n    // Note: This example requires a CompactLogix or ControlLogix PLC\r\n    // Update the IP address to match your PLC\r\n    let plc_address = \"192.168.1.100:44818\";\r\n\r\n    println!(\"📡 Connecting to PLC at {}\", plc_address);\r\n\r\n    // For demonstration purposes, we'll show data type operations without connecting\r\n    // Uncomment the following line to actually connect to a PLC:\r\n    // let mut client = EipClient::connect(plc_address).await?;\r\n\r\n    demonstrate_data_types().await?;\r\n    demonstrate_data_type_encoding().await?;\r\n\r\n    // Uncomment to test with real PLC:\r\n    // demonstrate_real_plc_data_types(\u0026mut client).await?;\r\n\r\n    Ok(())\r\n}\r\n\r\n/// Demonstrates all supported data types and their characteristics\r\nasync fn demonstrate_data_types() -\u003e Result\u003c(), Box\u003cdyn Error\u003e\u003e {\r\n    println!(\"\\n📊 Supported Data Types\");\r\n    println!(\"=======================\");\r\n\r\n    // 1. Boolean Type\r\n    println!(\"\\n1. BOOL - Boolean Values:\");\r\n    let bool_true = PlcValue::Bool(true);\r\n    let bool_false = PlcValue::Bool(false);\r\n    println!(\r\n        \"   True:  {:?} -\u003e CIP Type: 0x{:04X}\",\r\n        bool_true,\r\n        bool_true.get_data_type()\r\n    );\r\n    println!(\r\n        \"   False: {:?} -\u003e CIP Type: 0x{:04X}\",\r\n        bool_false,\r\n        bool_false.get_data_type()\r\n    );\r\n\r\n    // 2. Signed Integer Types\r\n    println!(\"\\n2. Signed Integer Types:\");\r\n\r\n    let sint_val = PlcValue::Sint(-128);\r\n    println!(\r\n        \"   SINT:  {:?} -\u003e CIP Type: 0x{:04X} (Range: -128 to 127)\",\r\n        sint_val,\r\n        sint_val.get_data_type()\r\n    );\r\n\r\n    let int_val = PlcValue::Int(-32768);\r\n    println!(\r\n        \"   INT:   {:?} -\u003e CIP Type: 0x{:04X} (Range: -32,768 to 32,767)\",\r\n        int_val,\r\n        int_val.get_data_type()\r\n    );\r\n\r\n    let dint_val = PlcValue::Dint(-2147483648);\r\n    println!(\r\n        \"   DINT:  {:?} -\u003e CIP Type: 0x{:04X} (Range: -2,147,483,648 to 2,147,483,647)\",\r\n        dint_val,\r\n        dint_val.get_data_type()\r\n    );\r\n\r\n    let lint_val = PlcValue::Lint(-9223372036854775808);\r\n    println!(\"   LINT:  {:?} -\u003e CIP Type: 0x{:04X} (Range: -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807)\", \r\n             lint_val, lint_val.get_data_type());\r\n\r\n    // 3. Unsigned Integer Types\r\n    println!(\"\\n3. Unsigned Integer Types:\");\r\n\r\n    let usint_val = PlcValue::Usint(255);\r\n    println!(\r\n        \"   USINT: {:?} -\u003e CIP Type: 0x{:04X} (Range: 0 to 255)\",\r\n        usint_val,\r\n        usint_val.get_data_type()\r\n    );\r\n\r\n    let uint_val = PlcValue::Uint(65535);\r\n    println!(\r\n        \"   UINT:  {:?} -\u003e CIP Type: 0x{:04X} (Range: 0 to 65,535)\",\r\n        uint_val,\r\n        uint_val.get_data_type()\r\n    );\r\n\r\n    let udint_val = PlcValue::Udint(4294967295);\r\n    println!(\r\n        \"   UDINT: {:?} -\u003e CIP Type: 0x{:04X} (Range: 0 to 4,294,967,295)\",\r\n        udint_val,\r\n        udint_val.get_data_type()\r\n    );\r\n\r\n    let ulint_val = PlcValue::Ulint(18446744073709551615);\r\n    println!(\r\n        \"   ULINT: {:?} -\u003e CIP Type: 0x{:04X} (Range: 0 to 18,446,744,073,709,551,615)\",\r\n        ulint_val,\r\n        ulint_val.get_data_type()\r\n    );\r\n\r\n    // 4. Floating Point Types\r\n    println!(\"\\n4. Floating Point Types:\");\r\n\r\n    let real_val = PlcValue::Real(123.456);\r\n    println!(\r\n        \"   REAL:  {:?} -\u003e CIP Type: 0x{:04X} (32-bit IEEE 754)\",\r\n        real_val,\r\n        real_val.get_data_type()\r\n    );\r\n\r\n    let lreal_val = PlcValue::Lreal(123.456789012345);\r\n    println!(\r\n        \"   LREAL: {:?} -\u003e CIP Type: 0x{:04X} (64-bit IEEE 754)\",\r\n        lreal_val,\r\n        lreal_val.get_data_type()\r\n    );\r\n\r\n    // 5. String Type\r\n    println!(\"\\n5. String Type:\");\r\n    let string_val = PlcValue::String(\"Hello, PLC!\".to_string());\r\n    println!(\r\n        \"   STRING: {:?} -\u003e CIP Type: 0x{:04X}\",\r\n        string_val,\r\n        string_val.get_data_type()\r\n    );\r\n\r\n    // 6. User Defined Type (UDT)\r\n    println!(\"\\n6. User Defined Type (UDT):\");\r\n    let mut motor_udt = HashMap::new();\r\n    motor_udt.insert(\"Speed\".to_string(), PlcValue::Real(1750.0));\r\n    motor_udt.insert(\"Current\".to_string(), PlcValue::Real(12.5));\r\n    motor_udt.insert(\"Running\".to_string(), PlcValue::Bool(true));\r\n    motor_udt.insert(\"Faults\".to_string(), PlcValue::Udint(0));\r\n\r\n    let udt_val = PlcValue::Udt(motor_udt);\r\n    println!(\r\n        \"   UDT: Motor Data -\u003e CIP Type: 0x{:04X}\",\r\n        udt_val.get_data_type()\r\n    );\r\n    if let PlcValue::Udt(members) = \u0026udt_val {\r\n        for (name, value) in members {\r\n            println!(\"     {}: {:?}\", name, value);\r\n        }\r\n    }\r\n\r\n    Ok(())\r\n}\r\n\r\n/// Demonstrates byte encoding for network transmission\r\nasync fn demonstrate_data_type_encoding() -\u003e Result\u003c(), Box\u003cdyn Error\u003e\u003e {\r\n    println!(\"\\n🔧 Data Type Encoding (Little-Endian)\");\r\n    println!(\"=====================================\");\r\n\r\n    // Show how each data type is encoded for network transmission\r\n    let test_values = vec![\r\n        (\"BOOL(true)\", PlcValue::Bool(true)),\r\n        (\"BOOL(false)\", PlcValue::Bool(false)),\r\n        (\"SINT(-1)\", PlcValue::Sint(-1)),\r\n        (\"INT(0x1234)\", PlcValue::Int(0x1234)),\r\n        (\"DINT(0x12345678)\", PlcValue::Dint(0x12345678)),\r\n        (\"USINT(255)\", PlcValue::Usint(255)),\r\n        (\"UINT(0xABCD)\", PlcValue::Uint(0xABCD)),\r\n        (\"UDINT(0xDEADBEEF)\", PlcValue::Udint(0xDEADBEEF)),\r\n        (\"REAL(123.45)\", PlcValue::Real(123.45)),\r\n        (\"STRING(\\\"Hi\\\")\", PlcValue::String(\"Hi\".to_string())),\r\n    ];\r\n\r\n    for (name, value) in test_values {\r\n        let bytes = value.to_bytes();\r\n        println!(\"   {:\u003c20} -\u003e {:02X?}\", name, bytes);\r\n    }\r\n\r\n    // Show precision differences\r\n    println!(\"\\n🎯 Precision Comparison:\");\r\n    let real_pi = PlcValue::Real(std::f32::consts::PI);\r\n    let lreal_pi = PlcValue::Lreal(std::f64::consts::PI);\r\n\r\n    println!(\"   REAL π:  {:?}\", real_pi);\r\n    println!(\"   LREAL π: {:?}\", lreal_pi);\r\n\r\n    Ok(())\r\n}\r\n\r\n/// Demonstrates real PLC operations with all data types (uncomment when connected to PLC)\r\n#[allow(dead_code)]\r\nasync fn demonstrate_real_plc_data_types(client: \u0026mut EipClient) -\u003e Result\u003c(), Box\u003cdyn Error\u003e\u003e {\r\n    println!(\"\\n🏭 Real PLC Data Type Operations\");\r\n    println!(\"===============================\");\r\n\r\n    // Test writing different data types\r\n    println!(\"\\n✏️ Writing Different Data Types:\");\r\n\r\n    // Boolean operations\r\n    match client.write_tag(\"TestBool\", PlcValue::Bool(true)).await {\r\n        Ok(_) =\u003e println!(\"   ✅ BOOL written successfully\"),\r\n        Err(e) =\u003e println!(\"   ❌ BOOL write failed: {}\", e),\r\n    }\r\n\r\n    // Integer operations\r\n    match client.write_tag(\"TestSint\", PlcValue::Sint(-100)).await {\r\n        Ok(_) =\u003e println!(\"   ✅ SINT written successfully\"),\r\n        Err(e) =\u003e println!(\"   ❌ SINT write failed: {}\", e),\r\n    }\r\n\r\n    match client.write_tag(\"TestInt\", PlcValue::Int(-30000)).await {\r\n        Ok(_) =\u003e println!(\"   ✅ INT written successfully\"),\r\n        Err(e) =\u003e println!(\"   ❌ INT write failed: {}\", e),\r\n    }\r\n\r\n    match client.write_tag(\"TestDint\", PlcValue::Dint(-2000000)).await {\r\n        Ok(_) =\u003e println!(\"   ✅ DINT written successfully\"),\r\n        Err(e) =\u003e println!(\"   ❌ DINT write failed: {}\", e),\r\n    }\r\n\r\n    match client\r\n        .write_tag(\"TestLint\", PlcValue::Lint(-9000000000000000000))\r\n        .await\r\n    {\r\n        Ok(_) =\u003e println!(\"   ✅ LINT written successfully\"),\r\n        Err(e) =\u003e println!(\"   ❌ LINT write failed: {}\", e),\r\n    }\r\n\r\n    // Unsigned integer operations\r\n    match client.write_tag(\"TestUsint\", PlcValue::Usint(200)).await {\r\n        Ok(_) =\u003e println!(\"   ✅ USINT written successfully\"),\r\n        Err(e) =\u003e println!(\"   ❌ USINT write failed: {}\", e),\r\n    }\r\n\r\n    match client.write_tag(\"TestUint\", PlcValue::Uint(50000)).await {\r\n        Ok(_) =\u003e println!(\"   ✅ UINT written successfully\"),\r\n        Err(e) =\u003e println!(\"   ❌ UINT write failed: {}\", e),\r\n    }\r\n\r\n    match client\r\n        .write_tag(\"TestUdint\", PlcValue::Udint(3000000000))\r\n        .await\r\n    {\r\n        Ok(_) =\u003e println!(\"   ✅ UDINT written successfully\"),\r\n        Err(e) =\u003e println!(\"   ❌ UDINT write failed: {}\", e),\r\n    }\r\n\r\n    match client\r\n        .write_tag(\"TestUlint\", PlcValue::Ulint(15000000000000000000))\r\n        .await\r\n    {\r\n        Ok(_) =\u003e println!(\"   ✅ ULINT written successfully\"),\r\n        Err(e) =\u003e println!(\"   ❌ ULINT write failed: {}\", e),\r\n    }\r\n\r\n    // Floating point operations\r\n    match client.write_tag(\"TestReal\", PlcValue::Real(123.456)).await {\r\n        Ok(_) =\u003e println!(\"   ✅ REAL written successfully\"),\r\n        Err(e) =\u003e println!(\"   ❌ REAL write failed: {}\", e),\r\n    }\r\n\r\n    match client\r\n        .write_tag(\"TestLreal\", PlcValue::Lreal(123.456789012345))\r\n        .await\r\n    {\r\n        Ok(_) =\u003e println!(\"   ✅ LREAL written successfully\"),\r\n        Err(e) =\u003e println!(\"   ❌ LREAL write failed: {}\", e),\r\n    }\r\n\r\n    // String operations\r\n    match client\r\n        .write_tag(\r\n            \"TestString\",\r\n            PlcValue::String(\"Hello from Rust!\".to_string()),\r\n        )\r\n        .await\r\n    {\r\n        Ok(_) =\u003e println!(\"   ✅ STRING written successfully\"),\r\n        Err(e) =\u003e println!(\"   ❌ STRING write failed: {}\", e),\r\n    }\r\n\r\n    // UDT operations\r\n    let mut test_udt = HashMap::new();\r\n    test_udt.insert(\"Value1\".to_string(), PlcValue::Dint(42));\r\n    test_udt.insert(\"Value2\".to_string(), PlcValue::Real(3.14159));\r\n    test_udt.insert(\"Status\".to_string(), PlcValue::Bool(true));\r\n\r\n    match client.write_tag(\"TestUdt\", PlcValue::Udt(test_udt)).await {\r\n        Ok(_) =\u003e println!(\"   ✅ UDT written successfully\"),\r\n        Err(e) =\u003e println!(\"   ❌ UDT write failed: {}\", e),\r\n    }\r\n\r\n    // Test reading back the values\r\n    println!(\"\\n📖 Reading Back Values:\");\r\n\r\n    let tags_to_read = vec![\r\n        \"TestBool\",\r\n        \"TestSint\",\r\n        \"TestInt\",\r\n        \"TestDint\",\r\n        \"TestLint\",\r\n        \"TestUsint\",\r\n        \"TestUint\",\r\n        \"TestUdint\",\r\n        \"TestUlint\",\r\n        \"TestReal\",\r\n        \"TestLreal\",\r\n        \"TestString\",\r\n    ];\r\n\r\n    for tag in tags_to_read {\r\n        match client.read_tag(tag).await {\r\n            Ok(value) =\u003e println!(\"   {} = {:?}\", tag, value),\r\n            Err(e) =\u003e println!(\"   {} read failed: {}\", tag, e),\r\n        }\r\n    }\r\n\r\n    Ok(())\r\n}\r\n\r\n/// Demonstrates data type conversion and validation\r\n#[allow(dead_code)]\r\nasync fn demonstrate_data_type_validation() -\u003e Result\u003c(), Box\u003cdyn Error\u003e\u003e {\r\n    println!(\"\\n🔍 Data Type Validation\");\r\n    println!(\"=======================\");\r\n\r\n    // Test boundary values\r\n    println!(\"\\n📏 Boundary Value Testing:\");\r\n\r\n    // SINT boundaries\r\n    let sint_min = PlcValue::Sint(i8::MIN);\r\n    let sint_max = PlcValue::Sint(i8::MAX);\r\n    println!(\"   SINT min: {:?}, max: {:?}\", sint_min, sint_max);\r\n\r\n    // INT boundaries\r\n    let int_min = PlcValue::Int(i16::MIN);\r\n    let int_max = PlcValue::Int(i16::MAX);\r\n    println!(\"   INT min: {:?}, max: {:?}\", int_min, int_max);\r\n\r\n    // DINT boundaries\r\n    let dint_min = PlcValue::Dint(i32::MIN);\r\n    let dint_max = PlcValue::Dint(i32::MAX);\r\n    println!(\"   DINT min: {:?}, max: {:?}\", dint_min, dint_max);\r\n\r\n    // REAL precision\r\n    let real_small = PlcValue::Real(1.0e-38);\r\n    let real_large = PlcValue::Real(3.4e38);\r\n    println!(\"   REAL small: {:?}, large: {:?}\", real_small, real_large);\r\n\r\n    // LREAL precision\r\n    let lreal_small = PlcValue::Lreal(2.2e-308);\r\n    let lreal_large = PlcValue::Lreal(1.7e308);\r\n    println!(\r\n        \"   LREAL small: {:?}, large: {:?}\",\r\n        lreal_small, lreal_large\r\n    );\r\n\r\n    Ok(())\r\n}\r\n\r\n#[cfg(test)]\r\nmod tests {\r\n    use super::*;\r\n\r\n    #[tokio::test]\r\n    async fn test_data_type_demonstrations() {\r\n        // Test that all demonstrations work without errors\r\n        assert!(demonstrate_data_types().await.is_ok());\r\n        assert!(demonstrate_data_type_encoding().await.is_ok());\r\n    }\r\n\r\n    #[test]\r\n    fn test_all_data_types_have_correct_cip_codes() {\r\n        // Verify that all data types have the correct CIP type codes\r\n        assert_eq!(PlcValue::Bool(true).get_data_type(), 0x00C1);\r\n        assert_eq!(PlcValue::Sint(0).get_data_type(), 0x00C2);\r\n        assert_eq!(PlcValue::Int(0).get_data_type(), 0x00C3);\r\n        assert_eq!(PlcValue::Dint(0).get_data_type(), 0x00C4);\r\n        assert_eq!(PlcValue::Lint(0).get_data_type(), 0x00C5);\r\n        assert_eq!(PlcValue::Usint(0).get_data_type(), 0x00C6);\r\n        assert_eq!(PlcValue::Uint(0).get_data_type(), 0x00C7);\r\n        assert_eq!(PlcValue::Udint(0).get_data_type(), 0x00C8);\r\n        assert_eq!(PlcValue::Ulint(0).get_data_type(), 0x00C9);\r\n        assert_eq!(PlcValue::Real(0.0).get_data_type(), 0x00CA);\r\n        assert_eq!(PlcValue::Lreal(0.0).get_data_type(), 0x00CB);\r\n        assert_eq!(PlcValue::String(\"\".to_string()).get_data_type(), 0x00DA);\r\n        assert_eq!(PlcValue::Udt(HashMap::new()).get_data_type(), 0x00A0);\r\n    }\r\n\r\n    #[test]\r\n    fn test_data_type_encoding_consistency() {\r\n        // Test that encoding is consistent and correct\r\n\r\n        // Test little-endian encoding for multi-byte types\r\n        let int_val = PlcValue::Int(0x1234);\r\n        assert_eq!(int_val.to_bytes(), vec![0x34, 0x12]);\r\n\r\n        let dint_val = PlcValue::Dint(0x12345678);\r\n        assert_eq!(dint_val.to_bytes(), vec![0x78, 0x56, 0x34, 0x12]);\r\n\r\n        let uint_val = PlcValue::Uint(0xABCD);\r\n        assert_eq!(uint_val.to_bytes(), vec![0xCD, 0xAB]);\r\n\r\n        let udint_val = PlcValue::Udint(0xDEADBEEF);\r\n        assert_eq!(udint_val.to_bytes(), vec![0xEF, 0xBE, 0xAD, 0xDE]);\r\n\r\n        // Test string encoding\r\n        let string_val = PlcValue::String(\"Hi\".to_string());\r\n        assert_eq!(string_val.to_bytes(), vec![2, b'H', b'i']);\r\n    }\r\n}\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","sheco","projects","rust-ethernet-ip","examples","simple_tag_test.rs"],"content":"use rust_ethernet_ip::{EipClient, PlcValue};\r\nuse std::time::Instant;\r\n\r\n#[tokio::main]\r\nasync fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\r\n    println!(\"🧪 Simple Tag Test - Individual Operations\");\r\n    println!(\"==========================================\\n\");\r\n\r\n    let plc_address = \"192.168.0.1:44818\";\r\n    println!(\"📡 Connecting to PLC at {}\", plc_address);\r\n\r\n    let mut client = EipClient::connect(plc_address).await?;\r\n    println!(\"✅ Connected successfully!\\n\");\r\n\r\n    // Test reading all the tags from the user's PLC\r\n    let test_tags = vec![\r\n        (\"ProductionCount\", \"DINT\"),\r\n        (\"Temperature_1\", \"REAL\"),\r\n        (\"Temperature_2\", \"REAL\"),\r\n        (\"Pressure_1\", \"REAL\"),\r\n        (\"FlowRate\", \"REAL\"),\r\n        (\"CurrentTemp\", \"REAL\"),\r\n        (\"CurrentPressure\", \"REAL\"),\r\n        (\"Performance_Test_1\", \"DINT\"),\r\n        (\"Performance_Test_2\", \"DINT\"),\r\n        (\"Performance_Test_3\", \"DINT\"),\r\n        (\"ValidTag\", \"DINT\"),\r\n        (\"SetPoint_1\", \"REAL\"),\r\n        (\"EnableFlag\", \"BOOL\"),\r\n    ];\r\n\r\n    println!(\"📊 Reading all tags individually:\");\r\n    println!(\"-----------------------------------\");\r\n\r\n    let start_time = Instant::now();\r\n    let mut successful_reads = 0;\r\n    let mut failed_reads = 0;\r\n\r\n    for (tag_name, expected_type) in \u0026test_tags {\r\n        match client.read_tag(tag_name).await {\r\n            Ok(value) =\u003e {\r\n                println!(\"  ✅ {}: {:?} ({})\", tag_name, value, expected_type);\r\n                successful_reads += 1;\r\n            }\r\n            Err(e) =\u003e {\r\n                println!(\"  ❌ {}: {} (expected {})\", tag_name, e, expected_type);\r\n                failed_reads += 1;\r\n            }\r\n        }\r\n    }\r\n\r\n    let total_time = start_time.elapsed();\r\n\r\n    println!(\"\\n📈 Results Summary:\");\r\n    pri   ];\r\n\r\n    for (tag, value) in \u0026test_values {\r\n        match client\r\n            .write_tag(tag, PlcValue::String(value.to_string()))\r\n            .await\r\n        {\r\n            Ok(_) =\u003e println!(\"✅ Wrote '{}' to {}\", value, tag),\r\n            Err(e) =\u003e println!(\"❌ Write to {} failed: {}\", tag, e),\r\n        }\r\n    }\r\n    println!();\r\n\r\n    // Verify writes by reading back\r\n    println!(\"🔍 VERIFYING WRITES\");\r\n    println!(\"-------------------\");\r\n    for (tag, expected) in \u0026test_values {\r\n        match client.read_tag(tag).await {\r\n            Ok(PlcValue::String(actual)) =\u003e {\r\n                if actual == *expected {\r\n                    println!(\"✅ {} verified: '{}'\", tag, actual);\r\n                } else {\r\n                    println!(\r\n                        \"⚠️  {} mismatch: expected '{}', got '{}'\",\r\n                        tag, expected, actual\r\n                    );\r\n                }\r\n            }\r\n            Ok(other) =\u003e println!(\"❌ {} returned wrong type: {:?}\", tag, other),\r\n            Err(e) =\u003e println!(\"❌ {} read failed: {}\", tag, e),\r\n        }\r\n    }\r\n    println!();\r\n\r\n    // Test edge cases\r\n    println!(\"🧪 TESTING EDGE CASES\");\r\n    println!(\"---------------------\");\r\n\r\n    // Empty string\r\n    match client\r\n        .write_tag(\"TestString\", PlcValue::String(\"\".to_string()))\r\n        .await\r\n    {\r\n        Ok(_) =\u003e println!(\"✅ Wrote empty string to TestString\"),\r\n        Err(e) =\u003e println!(\"❌ Write empty string failed: {}\", e),\r\n    }\r\n\r\n    // Long string (near limit)\r\n    let long_string = \"A\".repeat(80); // Close to 82 char limit\r\n    match client\r\n        .write_tag(\"TestString1\", PlcValue::String(long_string.clone()))\r\n        .await\r\n    {\r\n        Ok(_) =\u003e println!(\"✅ Wrote long string to TestString1\"),\r\n        Err(e) =\u003e println!(\"❌ Write ntln!(\"=====================\");\r\n    match client.read_tag(tag_name).await {\r\n        Ok(PlcValue::String(final_value)) =\u003e {\r\n            println!(\"✅ Final tag value: '{}'\", final_value);\r\n        }\r\n        Ok(other) =\u003e {\r\n            println!(\"⚠️  Final tag returned unexpected type: {:?}\", other);\r\n        }\r\n        Err(e) =\u003e {\r\n            println!(\"❌ Final read failed: {}\", e);\r\n        }\r\n    }\r\n\r\n    println!(\"\\n🎯 Debug test completed.\");\r\n    println!(\"   If writes report success but values don't change in PLC,\");\r\n    println!(\"   the issue is likely with the Allen-Bradley STRING format.\");\r\n\r\n    Ok(())\r\n}\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","sheco","projects","rust-ethernet-ip","examples","test_tag_discovery_fix.rs"],"content":"use rust_ethernet_ip::EipClient;\r\nuse std::error::Error;\r\n\r\n#[tokio::main]\r\nasync fn main() -\u003e Result\u003c(), Box\u003cdyn Error\u003e\u003e {\r\n    println!(\"🔧 Testing Tag Discovery Fix\");\r\n    println!(\"=============================\");\r\n\r\n    // Replace with your PLC IP address\r\n    let plc_ip = \"10.50.126.145:44818\";\r\n\r\n    println!(\"🔌 Connecting to PLC at {}...\", plc_ip);\r\n    let mut client = EipClient::connect(plc_ip).await?;\r\n    println!(\"✅ Connected successfully!\");\r\n\r\n    // Test health check\r\n    println!(\"\\n🏥 Testing health check...\");\r\n    let health = client.check_health().await;\r\n    println!(\"Health status: {:?}\", health);\r\n\r\n    // Test tag discovery\r\n    println!(\"\\n🔍 Testing tag discovery...\");\r\n    match client.discover_tags().await {\r\n        Ok(()) =\u003e {\r\n            println!(\"✅ Tag discovery completed successfully!\");\r\n\r\n            // Try to get some tag metadata\r\n            if let Some(metadata) = client.get_tag_metadata(\"Controller\").await {\r\n                println!(\"📊 Found Controller tag metadata: {:?}\", metadata);\ =======\");\r\n\r\n    // Connect to PLC\r\n    let mut client = EipClient::connect(\"192.168.0.1:44818\").await?;\r\n    println!(\"✅ Connected to PLC\");\r\n\r\n    // Discover all tags (including UDT members)\r\n    println!(\"\\n🔍 Discovering all tags (including UDT members)...\");\r\n    let start_time = Instant::now();\r\n\r\n    client.discover_tags().await?;\r\n\r\n    let discovery_time = start_time.elapsed();\r\n    println!(\"✅ Tag discovery completed in {:?}\", discovery_time);\r\n\r\n    // List discovered UDT definitions\r\n    println!(\"\\n📋 Discovered UDT Definitions:\");\r\n    let udt_definitions = client.list_udt_definitions().await;\r\n    for udt_name in \u0026udt_definitions {\r\n        println!(\"  - {}\", udt_name);\r\n\r\n        // Get detailed UDT definition\r\n        if let Some(definition) = client.get_udt_definition(udt_name).await {\r\n            println!(\"    Members: {}\", definition.members.len());\r\n            for member in \u0026definition.members {\r\n                println!(\r\n                    \"      {} (Type: 0x{:04X}, Offset: {}, Size: {})\",\r\n                    member.name, member.data_type, member.offset, member.size\r\n                );\r\n            }\r\n        }\r\n    }\r\n\r\n    // Demonstrate hierarchical tag access\r\n    println!(\"\\n🏗️ Hierarchical Tag Access Examples:\");\r\n\r\n    // Example 1: Access UDT members\r\n    if let Some(udt_def) = client.get_udt_definition(\"MotorData\").await {\r\n        println!(\"MotorData UDT has {} members:\", udt_def.members.len());\r\n        for member in \u0026udt_def.members {\r\n            let tag_path = format!(\"MotorData.{}\", member.name);\r\n            println!(\"  - {}\", tag_path);\r\n\r\n            // Try to read the UDT member\r\n            match client.read_tag(\u0026tag_path).await {\r\n                Ok(value) =\u003e println!(\"    Value: {:?}\", value),\r\n                Err(e) =\u003e println!(\"    Error reading {}: {}\", tag_path, e),\r\n            }\r\n        }\r\n    }\r\n\r\n    // Example 2: Nested UDT access\r\n    if let Some(udt_def) = client.get_udt_definition(\"Recipe\").await {\r\n        println!(\"\\nRecipe UDT structure:\");\r\n        for member in \u0026udt_def.members {\r\n            let tag_path = format!(\"Recipe.{}\", member.name);\r\n            println!(\"  - {}\", tag_path);\r\n\r\n            // Check if this member is also a structure\r\n            if let Some(metadata) = client.get_tag_metadata(\u0026tag_path).await {\r\n                if metadata.is_structure() {\r\n                    println!(\"    (This is a nested structure)\");\r\n\r\n                    // Try to discover nested members\r\n                    match client.discover_udt_members(\u0026tag_path).await {\r\n                        Ok(nested_members) =\u003e {\r\n                            for (nested_name, _) in nested_members {\r\n                                println!(\"      - {}\", nested_name);\r\n                            }\r\n                        }\r\n                        Err(e) =\u003e println!(\"      Error discovering nested members: {}\", e),\r\n                    }\r\n                }\r\n            }\r\n        }\r\n    }\r\n\r\n    // Performance statistics\r\n    println!(\"\\n📊 Performance Statistics:\");\r\n    println!(\"  - Total UDT definitions: {}\", udt_definitions.len());\r\n    println!(\"  - Discovery time: {:?}\", discovery_time);\r\n\r\n    // Get total tag count\r\n    let all_tags: Vec\u003cString\u003e = Vec::new(); // Placeholder - would need to implement list_all_tags method\r\n    println!(\"  - Total discovered tags: {}\", all_tags.len());\r\n\r\n    // Filter tags by type\r\n    let mut bool_tags = 0;\r\n    let mut dint_tags = 0;\r\n    let mut real_tags = 0;\r\n    let mut udt_tags = 0;\r\n\r\n    for tag_name in \u0026all_tags {\r\n        if let Some(metadata) = client.get_tag_metadata(tag_name).await {\r\n            match metadata.data_type {\r\n                0x00C1 =\u003e bool_tags += 1, // BOOL\r\n                0x00C4 =\u003e dint_tags += 1, // DINT\r\n                0x00CA =\u003e real_tags += 1, // REAL\r\n                _ if metadata.is_structure() =\u003e udt_tags += 1,\r\n                _ =\u003e {}\r\n            }\r\n        }\r\n    }\r\n\r\n    println!(\"  - BOOL tags: {}\", bool_tags);\r\n    println!(\"  - DINT tags: {}\", dint_tags);\r\n    println!(\"  - REAL tags: {}\", real_tags);\r\n    println!(\"  - UDT/Structure tags: {}\", udt_tags);\r\n\r\n    // Demonstrate tag validation\r\n    println!(\"\\n✅ Tag Name Validation Examples:\");\r\n    let test_names = vec![\r\n        \"ValidTag\",\r\n        \"Valid_Tag\",\r\n        \"Valid.Tag\",\r\n        \"Invalid123\",   // Starts with number\r\n        \"Invalid__Tag\", // Double underscore\r\n        \"Invalid..Tag\", // Double dot\r\n        \"\",             // Empty\r\n    ];\r\n\r\n    for _name in test_names {\r\n        // This would need to be implemented in the client\r\n        // let is_valid = client.validate_tag_name(name);\r\n        // println!(\"  '{}': {}\", name, if is_valid { \"✅ Valid\" } else { \"❌ Invalid\" });\r\n    }\r\n\r\n    // Cleanup\r\n    // client.disconnect().await?; // Placeholder - would need to implement disconnect method\r\n    println!(\"\\n✅ Disconnected from PLC\");\r\n\r\n    Ok(())\r\n}\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","sheco","projects","rust-ethernet-ip","pywrapper","src","lib.rs"],"content":"use pyo3::prelude::*;\r\nuse rust_ethernet_ip::{EipClient, PlcValue};\r\nuse tokio::runtime::Runtime;\r\n\r\n#[pyclass]\r\npub struct PyEipClient {\r\n    client: Option\u003cEipClient\u003e,\r\n    rt: Runtime,\r\n}\r\n\r\n#[pymethods]\r\nimpl PyEipClient {\r\n    #[new]\r\n    pub fn new() -\u003e Self {\r\n        Self {\r\n            client: None,\r\n            rt: Runtime::new().unwrap(),\r\n        }\r\n    }\r\n\r\n    pub fn connect(\u0026mut self, address: \u0026str) -\u003e PyResult\u003cbool\u003e {\r\n        let client = self.rt.block_on(EipClient::connect(address));\r\n        match client {\r\n            Ok(c) =\u003e {\r\n                self.client = Some(c);\r\n                Ok(true)\r\n            }\r\n            Err(e) =\u003e Err(pyo3::exceptions::PyRuntimeError::new_err(e.to_string())),\r\n        }\r\n    }\r\n\r\n    pub fn read_dint(\u0026mut self, tag: \u0026str) -\u003e PyResult\u003ci32\u003e {\r\n        let client = self\r\n            .client\r\n            .as_mut()\r\n            .ok_or_else(|| pyo3::exceptions::PyRuntimeError::new_err(\"Not connected\"))?;\r\n        let value = self.rt.block_on(client.read_tag(tag));\r\n        match value {\r\n            Ok(PlcValue::Dint(v)) =\u003e Ok(v),\r\n            Ok(_) =\u003e Err(pyo3::exceptions::PyTypeError::new_err(\"Tag is not a DINT\")),\r\n            Err(e) =\u003e Err(pyo3::exceptions::PyRuntimeError::new_err(e.to_string())),\r\n        }\r\n    }\r\n\r\n    pub fn write_dint(\u0026mut self, tag: \u0026str, value: i32) -\u003e PyResult\u003c()\u003e {\r\n        let client = self\r\n            .client\r\n            .as_mut()\r\n            .ok_or_else(|| pyo3::exceptions::PyRuntimeError::new_err(\"Not connected\"))?;\r\n        let result = self\r\n            .rt\r\n            .block_on(client.write_tag(tag, PlcValue::Dint(value)));\r\n        match result {\r\n            Ok(_) =\u003e Ok(()),\r\n            Err(e) =\u003e Err(pyo3::exceptions::PyRuntimeError::new_err(e.to_string())),\r\n        }\r\n    }\r\n}\r\n\r\n#[pymodule]\r\nfn _rust_ethernet_ip(_py: Python\u003c'_\u003e, m: \u0026Bound\u003c'_, PyModule\u003e) -\u003e PyResult\u003c()\u003e {\r\n    m.add_class::\u003cPyEipClient\u003e()?;\r\n    Ok(())\r\n}\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","sheco","projects","rust-ethernet-ip","src","config.rs"],"content":"use serde::{Deserialize, Serialize};\r\nuse std::collections::HashMap;\r\nuse std::fs;\r\nuse std::path::Path;\r\nuse std::time::Duration;\r\n\r\n/// Production configuration for EtherNet/IP library\r\n#[derive(Debug, Clone, Serialize, Deserialize)]\r\npub struct ProductionConfig {\r\n    /// Connection settings\r\n    pub connection: ConnectionConfig,\r\n    /// Performance settings\r\n    pub performance: PerformanceConfig,\r\n    /// Monitoring settings\r\n    pub monitoring: MonitoringConfig,\r\n    /// Security settings\r\n    pub security: SecurityConfig,\r\n    /// Logging settings\r\n    pub logging: LoggingConfig,\r\n    /// PLC-specific settings\r\n    pub plc_settings: HashMap\u003cString, PlcSpecificConfig\u003e,\r\n}\r\n\r\n#[derive(Debug, Clone, Serialize, Deserialize)]\r\npub struct ConnectionConfig {\r\n    /// Default connection timeout\r\n    pub connection_timeout: Duration,\r\n    /// Default read timeout\r\n    pub read_timeout: Duration,\r\n    /// Default write timeout\r\n    pub write_timeout: Duration,\r\n    /// Maximum number of concurrent connections\r\n    pub max_connections: u32,\r\n    /// Connection retry attempts\r\n    pub retry_attempts: u32,\r\n    /// Retry delay between attempts\r\n    pub retry_delay: Duration,\r\n    /// Keep-alive interval\r\n    pub keep_alive_interval: Duration,\r\n}\r\n\r\n#[derive(Debug, Clone, Serialize, Deserialize)]\r\npub struct PerformanceConfig {\r\n    /// Maximum packet size\r\n    pub max_packet_size: usize,\r\n    /// Batch operation configuration\r\n    pub batch_config: BatchConfig,\r\n    /// Connection pool settings\r\n    pub connection_pool: ConnectionPoolConfig,\r\n    /// Memory limits\r\n    pub memory_limits: MemoryLimits,\r\n}\r\n\r\n#[derive(Debug, Clone, Serialize, Deserialize)]\r\npub struct BatchConfig {\r\n    /// Maximum operations per batch\r\n    pub max_operations_per_batch: usize,\r\n    /// Batch timeout\r\n    pub batch_timeout: Duration,\r\n    /// Continue on error\r\n    pub continue_on_error: bool,\r\n    /// Optimize packet packing\r\n    pub optimize_packet_packing: bool,\r\n}\r\n\r\n#[derive(Debug, Clone, Serialize, Deserialize)]\r\npub struct ConnectionPoolConfig {\r\n    /// Initial pool size\r\n    pub initial_size: u32,\r\n    /// Maximum pool size\r\n    pub max_size: u32,\r\n    /// Pool growth increment\r\n    pub growth_increment: u32,\r\n    /// Connection idle timeout\r\n    pub idle_timeout: Duration,\r\n    /// Pool cleanup interval\r\n    pub cleanup_interval: Duration,\r\n}\r\n\r\n#[derive(Debug, Clone, Serialize, Deserialize)]\r\npub struct MemoryLimits {\r\n    /// Maximum memory usage in MB\r\n    pub max_memory_mb: usize,\r\n    /// Memory warning threshold in MB\r\n    pub warning_threshold_mb: usize,\r\n    /// Enable memory monitoring\r\n    pub enable_monitoring: bool,\r\n}\r\n\r\n#[derive(Debug, Clone, Serialize, Deserialize)]\r\npub struct MonitoringConfig {\r\n    /// Enable production monitoring\r\n    pub enabled: bool,\r\n    /// Metrics collection interval\r\n    pub collection_interval: Duration,\r\n    /// Health check interval\r\n    pub health_check_interval: Duration,\r\n    /// Metrics retention period\r\n    pub retention_period: Duration,\r\n    /// Enable performance profiling\r\n    pub enable_profiling: bool,\r\n    /// Alert thresholds\r\n    pub alert_thresholds: AlertThresholds,\r\n}\r\n\r\n#[derive(Debug, Clone, Serialize, Deserialize)]\r\npub struct AlertThresholds {\r\n    /// Error rate threshold (0.0 to 1.0)\r\n    pub error_rate_threshold: f64,\r\n    /// Latency threshold in milliseconds\r\n    pub latency_threshold_ms: f64,\r\n    /// Memory usage threshold in MB\r\n    pub memory_threshold_mb: usize,\r\n    /// Connection failure threshold\r\n    pub connection_failure_threshold: u32,\r\n}\r\n\r\n#[derive(Debug, Clone, Serialize, Deserialize)]\r\npub struct SecurityConfig {\r\n    /// Enable connection encryption (if supported by PLC)\r\n    pub enable_encryption: bool,\r\n    /// Connection validation\r\n    pub validate_connections: bool,\r\n    /// Input validation\r\n    pub validate_inputs: bool,\r\n    /// Rate limiting\r\n    pub rate_limiting: RateLimitingConfig,\r\n}\r\n\r\n#[derive(Debug, Clone, Serialize, Deserialize)]\r\npub struct RateLimitingConfig {\r\n    /// Enable rate limiting\r\n    pub enabled: bool,\r\n    /// Maximum requests per second\r\n    pub max_requests_per_second: u32,\r\n    /// Burst capacity\r\n    pub burst_capacity: u32,\r\n}\r\n\r\n#[derive(Debug, Clone, Serialize, Deserialize)]\r\npub struct LoggingConfig {\r\n    /// Log level (trace, debug, info, warn, error)\r\n    pub level: String,\r\n    /// Log format (json, text)\r\n    pub format: String,\r\n    /// Log file path\r\n    pub file_path: Option\u003cString\u003e,\r\n    /// Enable console logging\r\n    pub enable_console: bool,\r\n    /// Enable structured logging\r\n    pub enable_structured: bool,\r\n    /// Log rotation settings\r\n    pub rotation: LogRotationConfig,\r\n}\r\n\r\n#[derive(Debug, Clone, Serialize, Deserialize)]\r\npub struct LogRotationConfig {\r\n    /// Enable log rotation\r\n    pub enabled: bool,\r\n    /// Maximum file size in MB\r\n    pub max_file_size_mb: usize,\r\n    /// Maximum number of files\r\n    pub max_files: usize,\r\n    /// Rotation schedule (daily, weekly, monthly)\r\n    pub schedule: String,\r\n}\r\n\r\n#[derive(Debug, Clone, Serialize, Deserialize)]\r\npub struct PlcSpecificConfig {\r\n    /// PLC model/type\r\n    pub model: String,\r\n    /// Specific connection settings\r\n    pub connection_settings: HashMap\u003cString, String\u003e,\r\n    /// Tag discovery settings\r\n    pub tag_discovery: TagDiscoveryConfig,\r\n    /// Performance tuning\r\n    pub performance_tuning: HashMap\u003cString, String\u003e,\r\n}\r\n\r\n#[derive(Debug, Clone, Serialize, Deserialize)]\r\npub struct TagDiscoveryConfig {\r\n    /// Enable automatic tag discovery\r\n    pub enabled: bool,\r\n    /// Discovery interval\r\n    pub interval: Duration,\r\n    /// Cache discovered tags\r\n    pub cache_tags: bool,\r\n    /// Maximum tags to discover\r\n    pub max_tags: usize,\r\n}\r\n\r\nimpl Default for ProductionConfig {\r\n    fn default() -\u003e Self {\r\n        Self {\r\n            connection: ConnectionConfig {\r\n                connection_timeout: Duration::from_secs(10),\r\n                read_timeout: Duration::from_secs(5),\r\n                write_timeout: Duration::from_secs(5),\r\n                max_connections: 10,\r\n                retry_attempts: 3,\r\n                retry_delay: Duration::from_secs(1),\r\n                keep_alive_interval: Duration::from_secs(30),\r\n            },\r\n            performance: PerformanceConfig {\r\n                max_packet_size: 4000,\r\n                batch_config: BatchConfig {\r\n                    max_operations_per_batch: 50,\r\n                    batch_timeout: Duration::from_secs(10),\r\n                    continue_on_error: true,\r\n                    optimize_packet_packing: true,\r\n                },\r\n                connection_pool: ConnectionPoolConfig {\r\n                    initial_size: 2,\r\n                    max_size: 10,\r\n                    growth_increment: 2,\r\n                    idle_timeout: Duration::from_secs(300),\r\n                    cleanup_interval: Duration::from_secs(60),\r\n                },\r\n                memory_limits: MemoryLimits {\r\n                    max_memory_mb: 100,\r\n                    warning_threshold_mb: 80,\r\n                    enable_monitoring: true,\r\n                },\r\n            },\r\n            monitoring: MonitoringConfig {\r\n                enabled: true,\r\n                collection_interval: Duration::from_secs(30),\r\n                health_check_interval: Duration::from_secs(60),\r\n                retention_period: Duration::from_secs(86400), // 24 hours\r\n                enable_profiling: false,\r\n                alert_thresholds: AlertThresholds {\r\n                    error_rate_threshold: 0.05,\r\n                    latency_threshold_ms: 1000.0,\r\n                    memory_threshold_mb: 80,\r\n                    connection_failure_threshold: 5,\r\n                },\r\n            },\r\n            security: SecurityConfig {\r\n                enable_encryption: false,\r\n                validate_connections: true,\r\n                validate_inputs: true,\r\n                rate_limiting: RateLimitingConfig {\r\n                    enabled: true,\r\n                    max_requests_per_second: 100,\r\n                    burst_capacity: 200,\r\n                },\r\n            },\r\n            logging: LoggingConfig {\r\n                level: \"info\".to_string(),\r\n                format: \"json\".to_string(),\r\n                file_path: Some(\"logs/ethernet_ip.log\".to_string()),\r\n                enable_console: true,\r\n                enable_structured: true,\r\n                rotation: LogRotationConfig {\r\n                    enabled: true,\r\n                    max_file_size_mb: 100,\r\n                    max_files: 10,\r\n                    schedule: \"daily\".to_string(),\r\n                },\r\n            },\r\n            plc_settings: HashMap::new(),\r\n        }\r\n    }\r\n}\r\n\r\nimpl ProductionConfig {\r\n    /// Load configuration from file\r\n    pub fn from_file\u003cP: AsRef\u003cPath\u003e\u003e(path: P) -\u003e Result\u003cSelf, Box\u003cdyn std::error::Error\u003e\u003e {\r\n        let content = fs::read_to_string(path)?;\r\n        let config: ProductionConfig = toml::from_str(\u0026content)?;\r\n        Ok(config)\r\n    }\r\n\r\n    /// Save configuration to file\r\n    pub fn to_file\u003cP: AsRef\u003cPath\u003e\u003e(\u0026self, path: P) -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\r\n        let content = toml::to_string_pretty(self)?;\r\n        fs::write(path, content)?;\r\n        Ok(())\r\n    }\r\n\r\n    /// Validate configuration\r\n    pub fn validate(\u0026self) -\u003e Result\u003c(), Vec\u003cString\u003e\u003e {\r\n        let mut errors = Vec::new();\r\n\r\n        // Validate connection settings\r\n        if self.connection.connection_timeout.as_secs() == 0 {\r\n            errors.push(\"Connection timeout must be greater than 0\".to_string());\r\n        }\r\n\r\n        if self.connection.max_connections == 0 {\r\n            errors.push(\"Maximum connections must be greater than 0\".to_string());\r\n        }\r\n\r\n        // Validate performance settings\r\n        if self.performance.max_packet_size \u003c 100 {\r\n            errors.push(\"Maximum packet size must be at least 100 bytes\".to_string());\r\n        }\r\n\r\n        if self.performance.batch_config.max_operations_per_batch == 0 {\r\n            errors.push(\"Maximum operations per batch must be greater than 0\".to_string());\r\n        }\r\n\r\n        // Validate monitoring settings\r\n        if self.monitoring.collection_interval.as_secs() == 0 {\r\n            errors.push(\"Collection interval must be greater than 0\".to_string());\r\n        }\r\n\r\n        // Validate security settings\r\n        if self.security.rate_limiting.enabled\r\n            \u0026\u0026 self.security.rate_limiting.max_requests_per_second == 0\r\n        {\r\n            errors.push(\r\n                \"Max requests per second must be greater than 0 when rate limiting is enabled\"\r\n                    .to_string(),\r\n            );\r\n        }\r\n\r\n        // Validate logging settings\r\n        let valid_levels = [\"trace\", \"debug\", \"info\", \"warn\", \"error\"];\r\n        if !valid_levels.contains(\u0026self.logging.level.as_str()) {\r\n            errors.push(format!(\r\n                \"Invalid log level: {}. Must be one of: {:?}\",\r\n                self.logging.level, valid_levels\r\n            ));\r\n        }\r\n\r\n        if errors.is_empty() {\r\n            Ok(())\r\n        } else {\r\n            Err(errors)\r\n        }\r\n    }\r\n\r\n ine":1008,"address":[],"length":0,"stats":{"Line":0}},{"line":1024,"address":[],"length":0,"stats":{"Line":0}},{"line":1031,"address":[],"length":0,"stats":{"Line":0}},{"line":1032,"address":[],"length":0,"stats":{"Line":0}},{"line":1036,"address":[],"length":0,"stats":{"Line":0}},{"line":1037,"address":[],"length":0,"stats":{"Line":0}},{"line":1044,"address":[],"length":0,"stats":{"Line":0}},{"line":1054,"address":[],"length":0,"stats":{"Line":0}},{"line":1070,"address":[],"length":0,"stats":{"Line":0}},{"line":1074,"address":[],"length":0,"stats":{"Line":0}},{"line":1078,"address":[],"length":0,"stats":{"Line":0}},{"line":1079,"address":[],"length":0,"stats":{"Line":0}}],"covered":0,"coverable":306},{"path":["C:","\\","Users","sheco","projects","rust-ethernet-ip","src","lib.rs"],"content":"// lib.rs - Rust EtherNet/IP Driver Library with Comprehensive Documentation\n// =========================================================================\n//\n// # Rust EtherNet/IP Driver Library v0.5.3\n//\n// A high-performance, production-ready EtherNet/IP communication library for\n// Allen-Bradley CompactLogix and ControlLogix PLCs, written in pure Rust with\n// comprehensive language bindings (C#, Python, Go, JavaScript/TypeScript).\n//\n// ## Overview\n//\n// This library provides a complete implementation of the EtherNet/IP protocol\n// and Common Industrial Protocol (CIP) for communicating with Allen-Bradley\n// CompactLogix and ControlLogix series PLCs. It offers native Rust APIs, comprehensive\n// language bindings, and production-ready features for enterprise deployment.\n//\n// ## Architecture\n//\n// ```text\n// ┌─────────────────────────────────────────────────────────────────────────────────┐\n// │                              Application Layer                                  │\n// │  ┌─────────────┐  ┌─────────────────────────────────────────────────────────┐  │\n// │  │    Rust     │  │                    C# Ecosystem                         │  │\n// │  │   Native    │  │  ┌─────────────┐  ┌─────────────┐  ┌─────────────────┐  │  │\n// │  │             │  │  │     WPF     │  │  WinForms   │  │   ASP.NET Core  │  │  │\n// │  │             │  │  │  Desktop    │  │  Desktop    │  │    Web API      │  │  │\n// │  │             │  │  └─────────────┘  └─────────────┘  └─────────┬───────┘  │  │\n// │  │             │  │                                               │           │  │\n// │  │             │  │                                    ┌─────────┴───────┐  │  │\n// │  │             │  │                                    │  TypeScript +   │  │  │\n// │  │             │  │                                    │  React Frontend │  │  │\n// │  │             │  │                                    │  (HTTP/REST)    │  │  │\n// │  │             │  │                                    └─────────────────┘  │  │\n// │  └─────────────┘  └─────────────────────────────────────────────────────────┘  │\n// │  ┌─────────────┐  ┌─────────────────────────────────────────────────────────┐  │\n// │  │   Python    │  │                    Go Ecosystem                         │  │\n// │  │  PyO3       │  │  ┌─────────────┐  ┌─────────────────────────────────┐  │  │\n// │  │  Bindings   │  │  │   CGO       │  │        Next.js Frontend         │  │  │\n// │  │             │  │  │  Backend    │  │  ┌─────────────┐  ┌─────────────┐  │  │\n// │  │             │  │  │             │  │  │ TypeScript  │  │   React     │  │  │\n// │  │             │  │  │             │  │  │ Components  │  │ Components  │  │  │\n// │  │             │  │  └─────────────┘  │  └─────────────┘  └─────────────┘  │  │\n// │  │             │  │                   └─────────────────────────────────┘  │  │\n// │  └─────────────┘  └─────────────────────────────────────────────────────────┘  │\n// │  ┌─────────────────────────────────────────────────────────────────────────┐  │\n// │  │                    Vue.js Ecosystem                                     │  │\n// │  │  ┌─────────────┐  ┌─────────────┐  ┌─────────────────────────────────┐  │  │\n// │  │  │   Vue 3     │  │ TypeScript  │  │        Vite Build System        │  │  │\n// │  │  │ Components  │  │   Support   │  │     (Hot Module Replacement)     │  │  │\n// │  │  └─────────────┘  └─────────────┘  └─────────────────────────────────┘  │  │\n// │  └─────────────────────────────────────────────────────────────────────────┘  │\n// └─────────────────────┬─────────────────────────────────────────────────────────┘\n//                       │\n// ┌─────────────────────┴─────────────────────────────────────────────────────────┐\n// │                        Language Wrappers                                      │\n// │  ┌─────────────┐  ┌─────────────┐  ┌─────────────┐  ┌─────────────────────┐  │\n// │  │   C# FFI    │  │  Python     │  │    Go       │  │   JavaScript/TS     │  │\n// │  │  Wrapper    │  │  PyO3       │  │   CGO       │  │   FFI Bindings      │  │\n// │  │             │  │  Bindings   │  │  Bindings   │  │                     │  │\n// │  │ • 22 funcs  │  │ • Native    │  │ • Native    │  │ • Node.js Support   │  │\n// │  │ • Type-safe │  │ • Async     │  │ • Concurrent│  │ • Browser Support   │  │\n// │  │ • Cross-plat│  │ • Cross-plat│  │ • Cross-plat│  │ • TypeScript Types  │  │\n// │  └─────────────┘  └─────────────┘  └─────────────┘  └─────────────────────┘  │\n// └─────────────────────┬─────────────────────────────────────────────────────────┘\n//                       │\n// ┌─────────────────────┴─────────────────────────────────────────────────────────┐\n// │                         Core Rust Library                                     │\n// │  ┌─────────────────────────────────────────────────────────────────────────┐  │\n// │  │                           EipClient                                     │  │\n// │  │  • Connection Management \u0026 Session Handling                            │  │\n// │  │  • Advanced Tag Operations \u0026 Program-Scoped Tag Support                │  │\n// │  │  • Complete Data Type Support (13 Allen-Bradley types)                 │  │\n// │  │  • Advanced Tag Path Parsing (arrays, bits, UDTs, strings)             │  │\n// │  │  • Real-Time Subscriptions with Event-Driven Notifications             │  │\n// │  │  • High-Performance Batch Operations (2,000+ ops/sec)                  │  │\n// │  └─────────────────────────────────────────────────────────────────────────┘  │\n// │  ┌─────────────────────────────────────────────────────────────────────────┐  │\n// │  │                    Protocol Implementation                              │  │\n// │  │  • EtherNet/IP Encapsulation Protocol                                  │  │\n// │  │  • CIP (Common Industrial Protocol)                                    │  │\n// │  │  • Symbolic Tag Addressing with Advanced Parsing                       │  │\n// │  │  • Comprehensive CIP Error Code Mapping                                │  │\n// │  └─────────────────────────────────────────────────────────────────────────┘  │\n// │  ┌─────────────────────────────────────────────────────────────────────────┐  │\n// │  │                        Network Layer                                    │  │\n// │  │  • TCP Socket Management with Connection Pooling                       │  │\n// │  │  • Async I/O with Tokio Runtime                                        │  │\n// │  │  • Robust Error Handling \u0026 Network Resilience                          │  │\n// │  │  • Session Management \u0026 Automatic Reconnection                         │  │\n// │  └─────────────────────────────────────────────────────────────────────────┘  │\n// └─────────────────────────────────────────────────────────────────────────────────┘\n// ```\n//\n// ## Integration Paths\n//\n// ### 🦀 **Native Rust Applications**\n// Direct library usage with full async support and zero-overhead abstractions.\n// Perfect for high-performance applications and embedded systems.\n//\n// ### 🖥️ **Desktop Applications (C#)**\n// - **WPF**: Modern desktop applications with MVVM architecture\n// - **WinForms**: Traditional Windows applications with familiar UI patterns\n// - Uses C# FFI wrapper for seamless integration\n//\n// ### 🐍 **Python Applications**\n// - **Native Python Bindings**: Direct PyO3 integration with full async support\n// - **Cross-Platform**: Windows, Linux, macOS support\n// - **Easy Installation**: pip install or maturin development\n//\n// ### 🐹 **Go Applications**\n// - **CGO Bindings**: Native Go integration with C FFI\n// - **High Performance**: Zero-copy operations where possible\n// - **Concurrent**: Full goroutine support for concurrent operations\n//\n// ### 🌐 **Web Applications**\n// - **ASP.NET Core Web API**: RESTful backend service\n// - **TypeScript + React Frontend**: Modern web dashboard via HTTP/REST API\n// - **Vue.js Applications**: Modern reactive web interfaces\n// - **Scalable Architecture**: Backend handles PLC communication, frontend provides UI\n//\n// ### 🔧 **System Integration**\n// - **C/C++ Applications**: Direct FFI integration\n// - **Other .NET Languages**: VB.NET, F#, etc. via C# wrapper\n// - **Microservices**: ASP.NET Core API as a service component\n//\n// ## Features\n//\n// ### Core Capabilities\n// - **High Performance**: 2,000+ operations per second with batch operations\n// - **Real-Time Subscriptions**: Event-driven notifications with 1ms-10s intervals\n// - **Complete Data Types**: All Allen-Bradley native data types with type-safe operations\n// - **Advanced Tag Addressing**: Program-scoped, arrays, bits, UDTs, strings\n// - **Batch Operations**: High-performance multi-tag read/write with 2,000+ ops/sec\n// - **Async I/O**: Built on Tokio for excellent concurrency and performance\n// - **Error Handling**: Comprehensive CIP error code mapping and reporting\n// - **Memory Safe**: Zero-copy operations where possible, proper resource cleanup\n// - **Production Ready**: Enterprise-grade monitoring, health checks, and configuration\n//\n// ### Supported PLCs\n// - **CompactLogix L1x, L2x, L3x, L4x, L5x series** (Primary focus)\n// - **ControlLogix L6x, L7x, L8x series** (Full support)\n// - Optimized for PC applications (Windows, Linux, macOS)\n//\n// ### Advanced Tag Addressing\n// - **Program-scoped tags**: `Program:MainProgram.Tag1`\n// - **Array element access**: `MyArray[5]`, `MyArray[1,2,3]`\n// - **Bit-level operations**: `MyDINT.15` (access individual bits)\n// - **UDT member access**: `MyUDT.Member1.SubMember`\n// - **String operations**: `MyString.LEN`, `MyString.DATA[5]`\n// - **Complex nested paths**: `Program:Production.Lines[2].Stations[5].Motor.Status.15`\n//\n// ### Complete Data Type Support\n// - **BOOL**: Boolean values\n// - **SINT, INT, DINT, LINT**: Signed integers (8, 16, 32, 64-bit)\n// - **USINT, UINT, UDINT, ULINT**: Unsigned integers (8, 16, 32, 64-bit)\n// - **REAL, LREAL**: Floating point (32, 64-bit IEEE 754)\n// - **STRING**: Variable-length strings\n// - **UDT**: User Defined Types with full nesting support\n//\n// ### Protocol Support\n// - **EtherNet/IP**: Complete encapsulation protocol implementation\n// - **CIP**: Common Industrial Protocol for tag operations\n// - **Symbolic Addressing**: Direct tag name resolution with advanced parsing\n// - **Session Management**: Proper registration/unregistration sequences\n//\n// ### Integration Options\n// - **Native Rust**: Direct library usage with full async support\n// - **C# Desktop Applications**: WPF and WinForms via C# FFI wrapper\n// - **Python Applications**: Native PyO3 bindings with full async support\n// - **Go Applications**: CGO bindings with concurrent operations\n// - **Web Applications**: ASP.NET Core API + TypeScript/React/Vue frontend\n// - **C/C++ Integration**: Direct FFI functions for system integration\n// - **Cross-Platform**: Windows, Linux, macOS support\n//\n// ## Performance Characteristics\n//\n// Benchmarked on typical industrial hardware:\n//\n// | Operation | Performance | Notes |\n// |-----------|-------------|-------|\n// | Read BOOL | 1,500+ ops/sec | Single tag operations |\n// | Read DINT | 1,400+ ops/sec | 32-bit integer tags |\n// | Read REAL | 1,300+ ops/sec | Floating point tags |\n// | Write BOOL | 800+ ops/sec | Single tag operations |\n// | Write DINT | 750+ ops/sec | 32-bit integer tags |\n// | Write REAL | 700+ ops/sec | Floating point tags |\n// | **Batch Read** | **2,000+ ops/sec** | **Multi-tag operations** |\n// | **Batch Write** | **1,500+ ops/sec** | **Multi-tag operations** |\n// | **Real-Time Subscriptions** | **1ms-10s intervals** | **Event-driven** |\n// | Connection | \u003c1 second | Initial session setup |\n// | Tag Path Parsing | 10,000+ ops/sec | Advanced addressing |\n//\n// ## Security Considerations\n//\n// - **No Authentication**: EtherNet/IP protocol has limited built-in security\n// - **Network Level**: Implement firewall rules and network segmentation\n// - **PLC Protection**: Use PLC safety locks and access controls\n// - **Data Validation**: Always validate data before writing to PLCs\n//\n// ## Thread Safety\n//\n// The `EipClient` struct is **NOT** thread-safe. For multi-threaded applications:\n// - Use one client per thread, OR\n// - Implement external synchronization (Mutex/RwLock), OR\n// - Use a connection pool pattern\n//\n// ## Memory Usage\n//\n// - **Per Connection**: ~8KB base memory footprint\n// - **Network Buffers**: ~2KB per active connection\n// - **Tag Cache**: Minimal (tag names only when needed)\n// - **Total Typical**: \u003c10MB for most applications\n//\n// ## Error Handling Philosophy\n//\n// This library follows Rust's error handling principles:\n// - All fallible operations return `Result\u003cT, EtherNetIpError\u003e`\n// - Errors are propagated rather than panicking\n// - Detailed error messages with CIP status code mapping\n// - Network errors are distinguished from protocol errors\n//\n// ## Examples\n//\n// See the `examples/` directory for comprehensive usage examples, including:\n// - Advanced tag addressing demonstrations\n// - Complete data type showcase\n// - Real-world industrial automation scenarios\n// - Professional HMI/SCADA dashboard\n// - Multi-language integration examples (C#, Python, Go, TypeScript, Vue)\n//\n// ## Changelog\n//\n// ### v0.5.3 (January 2025) - **CURRENT**\n// - Enhanced safety documentation for all FFI functions\n// - Comprehensive clippy optimizations and code quality improvements\n// - Improved memory management and connection pool handling\n// - Enhanced Python, C#, and Go wrapper stability\n// - Production-ready code quality with 0 warnings\n//\n// ### v0.5.0 (January 2025)\n// - Professional HMI/SCADA production dashboard\n// - Enterprise-grade monitoring and health checks\n// - Production-ready configuration management\n// - Comprehensive metrics collection and reporting\n// - Enhanced error handling and recovery mechanisms\n//\n// ### v0.4.0 (January 2025)\n// - Real-time subscriptions with event-driven notifications\n// - High-performance batch operations (2,000+ ops/sec)\n// - Complete data type support for all Allen-Bradley types\n// - Advanced tag path parsing (program-scoped, arrays, bits, UDTs)\n// - Enhanced error handling and documentation\n// - Comprehensive test coverage (47+ tests)\n// - Production-ready stability and performance\n//\n// =========================================================================\n\nuse crate::udt::UdtManager;\nuse lazy_static::lazy_static;\nuse std::collections::HashMap;\nuse std::net::SocketAddr;\nuse std::sync::atomic::AtomicBool;\nuse std::sync::Arc;\nuse tokio::io::{AsyncReadExt, AsyncWriteExt};\nuse tokio::net::TcpStream;\nuse tokio::runtime::Runtime;\nuse tokio::sync::Mutex;\nuse tokio::time::{timeout, Duration, Instant};\n\npub mod config; // Production-ready configuration management\npub mod error;\npub mod ffi;\npub mod monitoring; // Enterprise-grade monitoring and health checks\npub mod plc_manager;\npub mod python;\npub mod subscription;\npub mod tag_manager;\npub mod tag_path;\npub mod tag_subscription; // Real-time subscription management\npub mod udt;\npub mod version;\n\n// Re-export commonly used items\npub use config::{\n    ConnectionConfig, LoggingConfig, MonitoringConfig, PerformanceConfig, PlcSpecificConfig,\n    ProductionConfig, SecurityConfig,\n};\npub use error::{EtherNetIpError, Result};\npub use monitoring::{\n    ConnectionMetrics, ErrorMetrics, HealthMetrics, HealthStatus, MonitoringMetrics,\n    OperationMetrics, PerformanceMetrics, ProductionMonitor,\n};\npub use plc_manager::{PlcConfig, PlcConnection, PlcManager};\npub use subscription::{SubscriptionManager, SubscriptionOptions, TagSubscription};\npub use tag_manager::{TagCache, TagManager, TagMetadata, TagPermissions, TagScope};\npub use tag_path::TagPath;\npub use tag_subscription::{\n    SubscriptionManager as RealTimeSubscriptionManager,\n    SubscriptionOptions as RealTimeSubscriptionOptions, TagSubscription as RealTimeSubscription,\n};\npub use udt::{UdtDefinition, UdtMember};\n\n// Static runtime and client management for FFI\nlazy_static! {\n    /// Global Tokio runtime for handling async operations in FFI context\n    static ref RUNTIME: Runtime = Runtime::new().unwrap();\n\n    /// Global storage for EipClient instances, indexed by client ID\n    static ref CLIENTS: Mutex\u003cHashMap\u003ci32, EipClient\u003e\u003e = Mutex::new(HashMap::new());\n\n    /// Counter for generating unique client IDs\n    static ref NEXT_ID: Mutex\u003ci32\u003e = Mutex::new(1);\n}\n\n// =========================================================================\n// BATCH OPERATIONS DATA STRUCTURES\n// =========================================================================\n\n/// Represents a single operation in a batch request\n///\n/// This enum defines the different types of operations that can be\n/// performed in a batch. Each operation specifies whether it's a read\n/// or write operation and includes the necessary parameters.\n#[derive(Debug, Clone)]\npub enum BatchOperation {\n    /// Read operation for a specific tag\n    ///\n    /// # Fields\n    ///\n    /// * `tag_name` - The name of the tag to read\n    Read { tag_name: String },\n\n    /// Write operation for a specific tag with a value\n    ///\n    /// # Fields\n    ///\n    /// * `tag_name` - The name of the tag to write\n    /// * `value` - The value to write to the tag\n    Write { tag_name: String, value: PlcValue },\n}\n\n/// Result of a single operation in a batch request\n///\n/// This structure contains the result of executing a single batch operation,\n/// including success/failure status and the actual data or error information.\n#[derive(Debug, Clone)]\npub struct BatchResult {\n    /// The original operation that was executed\n    pub operation: BatchOperation,\n\n    /// The result of the operation\n    pub result: std::result::Result\u003cOption\u003cPlcValue\u003e, BatchError\u003e,\n\n    /// Execution time for this specific operation (in microseconds)\n    pub execution_time_us: u64,\n}\n\n/// Specific error types that can occur during batch operations\n///\n/// This enum provides detailed error information for batch operations,\n/// allowing for better error handling and diagnostics.\n#[derive(Debug, Clone)]\npub enum BatchError {\n    /// Tag was not found in the PLC\n    TagNotFound(String),\n\n    /// Data type mismatch between expected and actual\n    DataTypeMismatch { expected: String, actual: String },\n\n    /// Network communication error\n    NetworkError(String),\n\n    /// CIP protocol error with status code\n    CipError { status: u8, message: String },\n\n    /// Tag name parsing error\n    TagPathError(String),\n\n    /// Value serialization/deserialization error\n    SerializationError(String),\n\n    /// Operation timeout\n    Timeout,\n\n    /// Generic error for unexpected issues\n    Other(String),\n}\n\nimpl std::fmt::Display for BatchError {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        match self {\n            BatchError::TagNotFound(tag) =\u003e write!(f, \"Tag not found: {tag}\"),\n            BatchError::DataTypeMismatch { expected, actual } =\u003e {\n                write!(f, \"Data type mismatch: expected {expected}, got {actual}\")\n            }\n            BatchError::NetworkError(msg) =\u003e write!(f, \"Network error: {msg}\"),\n            BatchError::CipError { status, message } =\u003e {\n                write!(f, \"CIP error (0x{status:02X}): {message}\")\n            }\n            BatchError::TagPathError(msg) =\u003e write!(f, \"Tag path error: {msg}\"),\n            BatchError::SerializationError(msg) =\u003e write!(f, \"Serialization error: {msg}\"),\n            BatchError::Timeout =\u003e write!(f, \"Operation timeout\"),\n            BatchError::Other(msg) =\u003e write!(f, \"Error: {msg}\"),\n        }\n    }\n}\n\nimpl std::error::Error for BatchError {}\n\n/// Configuration for batch operations\n///\n/// This structure controls the behavior and performance characteristics\n/// of batch read/write operations. Proper tuning can significantly\n/// improve throughput for applications that need to process many tags.\n#[derive(Debug, Clone)]\npub struct BatchConfig {\n    /// Maximum number of operations to include in a single CIP packet\n    ///\n    /// Larger values improve performance but may exceed PLC packet size limits.\n    /// Typical range: 10-50 operations per packet.\n    pub max_operations_per_packet: usize,\n\n    /// Maximum packet size in bytes for batch operations\n    ///\n    /// Should not exceed the PLC's maximum packet size capability.\n    /// Typical values: 504 bytes (default), up to 4000 bytes for modern PLCs.\n    pub max_packet_size: usize,\n\n    /// Timeout for individual batch packets (in milliseconds)\n    ///\n    /// This is per-packet timeout, not per-operation.\n    /// Typical range: 1000-5000 milliseconds.\n    pub packet_timeout_ms: u64,\n\n    /// Whether to continue processing other operations if one fails\n    ///\n    /// If true, failed operations are reported but don't stop the batch.\n    /// If false, the first error stops the entire batch processing.\n    pub continue_on_error: bool,\n\n    /// Whether to optimize packet packing by grouping similar operations\n    ///\n    /// If true, reads and writes are grouped separately for better performance.\n    /// If false, operations are processed in the order provided.\n    pub optimize_packet_packing: bool,\n}\n\nimpl Default for BatchConfig {\n    fn default() -\u003e Self {\n        Self {\n            max_operations_per_packet: 20,\n            max_packet_size: 504, // Conservative default for maximum compatibility\n            packet_timeout_ms: 3000,\n            continue_on_error: true,\n            optimize_packet_packing: true,\n        }\n    }\n}\n\n/// Connected session information for Class 3 explicit messaging\n///\n/// Allen-Bradley PLCs often require connected sessions for certain operations\n/// like STRING writes. This structure maintains the connection state.\n#[derive(Debug, Clone)]\npub struct ConnectedSession {\n    /// Connection ID assigned by the PLC\n    pub connection_id: u32,\n\n    /// Our connection ID (originator -\u003e target)\n    pub o_to_t_connection_id: u32,\n\n    /// PLC's connection ID (target -\u003e originator)\n    pub t_to_o_connection_id: u32,\n\n    /// Connection serial number for this session\n    pub connection_serial: u16,\n\n    /// Originator vendor ID (our vendor ID)\n    pub originator_vendor_id: u16,\n\n    /// Originator serial number (our serial number)\n    pub originator_serial: u32,\n\n    /// Connection timeout multiplier\n    pub timeout_multiplier: u8,\n\n    /// Requested Packet Interval (RPI) in microseconds\n    pub rpi: u32,\n\n    /// Connection parameters for O-\u003eT direction\n    pub o_to_t_params: ConnectionParameters,\n\n    /// Connection parameters for T-\u003eO direction\n    pub t_to_o_params: ConnectionParameters,\n\n    /// Timestamp when connection was established\n    pub established_at: Instant,\n\n    /// Whether this connection is currently active\n    pub is_active: bool,\n\n    /// Sequence counter for connected messages (increments with each message)\n    pub sequence_count: u16,\n}\n\n/// Connection parameters for EtherNet/IP connections\n#[derive(Debug, Clone)]\npub struct ConnectionParameters {\n    /// Connection size in bytes\n    pub size: u16,\n\n    /// Connection type (0x02 = Point-to-point, 0x01 = Multicast)\n    pub connection_type: u8,\n\n    /// Priority (0x00 = Low, 0x01 = High, 0x02 = Scheduled, 0x03 = Urgent)\n    pub priority: u8,\n\n    /// Variable size flag\n    pub variable_size: bool,\n}\n\nimpl Default for ConnectionParameters {\n    fn default() -\u003e Self {\n        Self {\n            size: 500,             // 500 bytes default\n            connection_type: 0x02, // Point-to-point\n            priority: 0x01,        // High priority\n            variable_size: false,\n        }\n    }\n}\n\nimpl ConnectedSession {\n    /// Creates a new connected session with default parameters\n    pub fn new(connection_serial: u16) -\u003e Self {\n        Self {\n            connection_id: 0,\n            o_to_t_connection_id: 0,\n            t_to_o_connection_id: 0,\n            connection_serial,\n            originator_vendor_id: 0x1337,   // Custom vendor ID\n            originator_serial: 0x1234_5678, // Custom serial number\n            timeout_multiplier: 0x05,       // 32 seconds timeout\n            rpi: 100_000,                   // 100ms RPI\n            o_to_t_params: ConnectionParameters::default(),\n            t_to_o_params: ConnectionParameters::default(),\n            established_at: Instant::now(),\n            is_active: false,\n            sequence_count: 0,\n        }\n    }\n\n    /// Creates a connected session with alternative parameters for different PLCs\n    pub fn with_
