\n        MOCK_PLC_STATE.with(|state| {\r\n            state\r\n                .borrow()\r\n                .get(tag_name)\r\n                .cloned()\r\n                .ok_or_else(|| \"Tag not found\".into())\r\n        })\r\n    }\r\n\r\n    async fn discover_tags(\u0026mut self) -\u003e Result\u003c(), Box\u003cdyn Error\u003e\u003e {\r\n        Ok(())\r\n    }\r\n\r\n    fn get_tag_metadata(\u0026self, _tag_name: \u0026str) -\u003e Option\u003cTagMetadata\u003e {\r\n        Some(TagMetadata {\r\n            data_type: 0x00C1, // Default to BOOL\r\n            scope: TagScope::Controller,\r\n            is_array: false,\r\n            dimensions: vec![],\r\n            permissions: TagPermissions {\r\n                readable: true,\r\n                writable: true,\r\n            },\r\n            last_access: std::time::Instant::now(),\r\n            size: 1,\r\n            array_info: None,\r\n            last_updated: std::time::Instant::now(),\r\n        })\r\n    }\r\n\r\n    fn set_max_packet_size(\u0026mut self, _size: u32) {}\r\n}\r\n\r\n// Helper function to create a test PLC configuration\r\nfn create_test_config(port: u16) -\u003e PlcConfig {\r\n    PlcConfig {\r\n        address: format!(\"127.0.0.1:{}\", port).parse().unwrap(),\r\n        max_connections: 2,\r\n        connection_timeout: Duration::from_secs(5),\r\n        health_check_interval: Duration::from_secs(30),\r\n        max_packet_size: 4000,\r\n    }\r\n}\r\n\r\n#[tokio::test]\r\nasync fn test_basic_tag_operations() -\u003e Result\u003c(), Box\u003cdyn Error\u003e\u003e {\r\n    let mut client = MockEipClient::new();\r\n\r\n    // Test BOOL operations\r\n    client.write_tag(\"TestBool\", PlcValue::Bool(true)).await?;\r\n    let bool_value = client.read_tag(\"TestBool\").await?;\r\n    assert_eq!(bool_value, PlcValue::Bool(true));\r\n\r\n    // Test DINT operations\r\n    client.write_tag(\"TestDint\", PlcValue::Dint(42)).await?;\r\n    let dint_value = client.read_tag(\"TestDint\").await?;\r\n    assert_eq!(dint_value, PlcValue::Dint(42));\r\n\r\n    // Test REAL operations\r\n    client.write_tag(\"TestReal\", PlcValue::Real(3.14)).await?;\r\n    let real_value = client.read_tag(\"TestReal\").await?;\r\n    assert_eq!(real_value, PlcValue::Real(3.14));\r\n\r\n    // Test STRING operations\r\n    let test_string = \"Hello, PLC!\".to_string();\r\n    client\r\n        .write_tag(\"TestString\", PlcValue::String(test_string.clone()))\r\n        .await?;\r\n    let string_value = client.read_tag(\"TestString\").await?;\r\n    assert_eq!(string_value, PlcValue::String(test_string));\r\n\r\n    Ok(())\r\n}\r\n\r\n#[tokio::test]\r\nasync fn test_array_operations() -\u003e Result\u003c(), Box\u003cdyn Error\u003e\u003e {\r\n    let mut client = MockEipClient::new();\r\n\r\n    // Test array element access\r\n    client.write_tag(\"TestArray[0]\", PlcValue::Dint(1)).await?;\r\n    client.write_tag(\"TestArray[1]\", PlcValue::Dint(2)).await?;\r\n    client.write_tag(\"TestArray[2]\", PlcValue::Dint(3)).await?;\r\n\r\n    let value1 = client.read_tag(\"TestArray[0]\").await?;\r\n    let value2 = client.read_tag(\"TestArray[1]\").await?;\r\n    let value3 = client.read_tag(\"TestArray[2]\").await?;\r\n\r\n    assert_eq!(value1, PlcValue::Dint(1));\r\n    assert_eq!(value2, PlcValue::Dint(2));\r\n    assert_eq!(value3, PlcValue::Dint(3));\r\n\r\n    Ok(())\r\n}\r\n\r\n#[tokio::test]\r\nasync fn test_udt_operations() -\u003e Result\u003c(), Box\u003cdyn Error\u003e\u003e {\r\n    let mut client = MockEipClient::new();\r\n\r\n    // Create and write a UDT\r\n    let mut members = HashMap::new();\r\n    members.insert(\"Bool1\".to_string(), PlcValue::Bool(true));\r\n    members.insert(\"Dint1\".to_string(), PlcValue::Dint(42));\r\n    members.insert(\"Real1\".to_string(), PlcValue::Real(3.14));\r\n\r\n    client\r\n        .write_tag(\"TestUDT\", PlcValue::Udt(members.clone()))\r\n        .await?;\r\n\r\n    // Read the UDT back\r\n    let udt_value = client.read_tag(\"TestUDT\").await?;\r\n    if let PlcValue::Udt(read_members) = udt_value {\r\n        assert_eq!(read_members, members);\r\n    } else {\r\n        panic!(\"Expected UDT value\");\r\n    }\r\n\r\n    Ok(())\r\n}\r\n\r\n#[tokio::test]\r\nasync fn test_tag_discovery_and_metadata() -\u003e Result\u003c(), Box\u003cdyn Error\u003e\u003e {\r\n    let mut client = MockEipClient::new();\r\n\r\n    // Discover tags\r\n    client.discover_tags().await?;\r\n\r\n    // Verify tag metadata\r\n    let metadata = client.get_tag_metadata(\"TestBool\").unwrap();\r\n    assert_eq!(metadata.data_type, 0x00C1); // BOOL type\r\n    assert_eq!(metadata.scope, TagScope::Controller);\r\n    assert!(!metadata.is_array);\r\n\r\n    Ok(())\r\n}\r\n\r\n#[tokio::test]\r\nasync fn test_connection_pool() -\u003e Result\u003c(), Box\u003cdyn Error\u003e\u003e {\r\n    let mut manager = PlcManager::new();\r\n    let config = create_test_config(44818);\r\n    manager.add_plc(config);\r\n\r\n    // Get first connection and use it\r\n    {\r\n        let mut client = MockEipClient::new();\r\n        client.write_tag(\"PoolTag1\", PlcValue::Bool(true)).await?;\r\n        let value1 = client.read_tag(\"PoolTag1\").await?;\r\n        assert_eq!(value1, PlcValue::Bool(true));\r\n    }\r\n\r\n    // Get second connection and use it\r\n    {\r\n        let mut client = MockEipClient::new();\r\n        client.write_tag(\"PoolTag2\", PlcValue::Bool(false)).await?;\r\n        let value2 = client.read_tag(\"PoolTag2\").await?;\r\n        assert_eq!(value2, PlcValue::Bool(false));\r\n    }\r\n\r\n    Ok(())\r\n}\r\n\r\n#[tokio::test]\r\nasync fn test_multiple_plc_operations() -\u003e Result\u003c(), Box\u003cdyn Error\u003e\u003e {\r\n    let mut client1 = MockEipClient::new();\r\n    let mut client2 = MockEipClient::new();\r\n\r\n    // Test operations on first PLC\r\n    client1.write_tag(\"PLC1Tag\", PlcValue::Dint(1)).await?;\r\n    let value1 = client1.read_tag(\"PLC1Tag\").await?;\r\n    assert_eq!(value1, PlcValue::Dint(1));\r\n\r\n    // Test operations on second PLC\r\n    client2.write_tag(\"PLC2Tag\", PlcValue::Dint(2)).await?;\r\n    let value2 = client2.read_tag(\"PLC2Tag\").await?;\r\n    assert_eq!(value2, PlcValue::Dint(2));\r\n\r\n    Ok(())\r\n}\r\n\r\n#[tokio::test]\r\nasync fn test_large_data_operations() -\u003e Result\u003c(), Box\u003cdyn Error\u003e\u003e {\r\n    let mut client = MockEipClient::new();\r\n\r\n    // Set maximum packet size\r\n    client.set_max_packet_size(4000);\r\n\r\n    // Test large string (should fail)\r\n    let large_string = \"X\".repeat(2000);\r\n    let result = client\r\n        .write_tag(\"LargeString\", PlcValue::String(large_string.clone()))\r\n        .await;\r\n    assert!(result.is_err(), \"Expected error for string \u003e 82 chars\");\r\n\r\n    // Test large UDT\r\n    let mut members = HashMap::new();\r\n    for i in 0..100 {\r\n        members.insert(format!(\"Field{}\", i), PlcValue::Dint(i as i32));\r\n    }\r\n    client\r\n        .write_tag(\"LargeUDT\", PlcValue::Udt(members.clone()))\r\n        .await?;\r\n    let udt_value = client.read_tag(\"LargeUDT\").await?;\r\n    assert_eq!(udt_value, PlcValue::Udt(members));\r\n\r\n    Ok(())\r\n}\r\n\r\n#[tokio::test]\r\nasync fn test_error_handling() -\u003e Result\u003c(), Box\u003cdyn Error\u003e\u003e {\r\n    let mut client = MockEipClient::new();\r\n\r\n    // Test non-existent tag\r\n    let result = client.read_tag(\"NonExistentTag\").await;\r\n    assert!(result.is_err());\r\n\r\n    // Test invalid data type\r\n    let result = client.write_tag(\"TestBool\", PlcValue::Dint(42)).await;\r\n    assert!(result.is_ok()); // Mock allows any type\r\n\r\n    // Test array bounds\r\n    let result = client.read_tag(\"TestArray[999]\").await;\r\n    assert!(result.is_err());\r\n\r\n    Ok(())\r\n}\r\n\r\n#[tokio::test]\r\nasync fn test_session_management() -\u003e Result\u003c(), Box\u003cdyn Error\u003e\u003e {\r\n    let mut client = MockEipClient::new();\r\n\r\n    // Perform some operations\r\n    client.write_tag(\"TestTag\", PlcValue::Bool(true)).await?;\r\n    let value = client.read_tag(\"TestTag\").await?;\r\n    assert_eq!(value, PlcValue::Bool(true));\r\n\r\n    Ok(())\r\n}\r\n\r\n#[tokio::test]\r\nasync fn test_string_operations() -\u003e Result\u003c(), Box\u003cdyn Error\u003e\u003e {\r\n    let mut client = MockEipClient::new();\r\n\r\n    // Test basic string operations\r\n    let test_string = \"Hello, PLC!\".to_string();\r\n    client\r\n        .write_tag(\"TestString\", PlcValue::String(test_string.clone()))\r\n        .await?;\r\n    let string_value = client.read_tag(\"TestString\").await?;\r\n    assert_eq!(string_value, PlcValue::String(test_string));\r\n\r\n    // Test empty string\r\n    let empty_string = \"\".to_string();\r\n    client\r\n        .write_tag(\"EmptyString\", PlcValue::String(empty_string.clone()))\r\n        .await?;\r\n    let empty_value = client.read_tag(\"EmptyString\").await?;\r\n    assert_eq!(empty_value, PlcValue::String(empty_string));\r\n\r\n    // Test string with special characters\r\n    let special_string = \"!@#$%^\u0026*()_+-=[]{}|;:,.\u003c\u003e?\".to_string();\r\n    client\r\n        .write_tag(\"SpecialString\", PlcValue::String(special_string.clone()))\r\n        .await?;\r\n    let special_value = client.read_tag(\"SpecialString\").await?;\r\n    assert_eq!(special_value, PlcValue::String(special_string));\r\n\r\n    // Test string with spaces\r\n    let spaced_string = \"Hello World with Spaces\".to_string();\r\n    client\r\n        .write_tag(\"SpacedString\", PlcValue::String(spaced_string.clone()))\r\n        .await?;\r\n    let spaced_value = client.read_tag(\"SpacedString\").await?;\r\n    assert_eq!(spaced_value, PlcValue::String(spaced_string));\r\n\r\n    // Test string with numbers\r\n    let number_string = \"12345\".to_string();\r\n    client\r\n        .write_tag(\"NumberString\", PlcValue::String(number_string.clone()))\r\n        .await?;\r\n    let number_value = client.read_tag(\"NumberString\").await?;\r\n    assert_eq!(number_value, PlcValue::String(number_string));\r\n\r\n    // Test string with mixed content\r\n    let mixed_string = \"Hello123!@# World\".to_string();\r\n    client\r\n        .write_tag(\"MixedString\", PlcValue::String(mixed_string.clone()))\r\n        .await?;\r\n    let mixed_value = client.read_tag(\"MixedString\").await?;\r\n    assert_eq!(mixed_value, PlcValue::String(mixed_string));\r\n\r\n    Ok(())\r\n}\r\n\r\n#[tokio::test]\r\nasync fn test_string_error_handling() -\u003e Result\u003c(), Box\u003cdyn Error\u003e\u003e {\r\n    let mut client = MockEipClient::new();\r\n\r\n    // Test string too long (should be handled by the library)\r\n    let long_string = \"X\".repeat(100); // Longer than 82 characters\r\n    let result = client\r\n        .write_tag(\"LongString\", PlcValue::String(long_string))\r\n        .await;\r\n    assert!(result.is_err());\r\n\r\n    // Test non-ASCII characters (should be handled by the library)\r\n    let non_ascii_string = \"Hello 世界\".to_string();\r\n    let result = client\r\n        .write_tag(\"NonAsciiString\", PlcValue::String(non_ascii_string))\r\n        .await;\r\n    assert!(result.is_err());\r\n\r\n    // Test string with null bytes (should be handled by the library)\r\n    let null_string = \"Hello\\0World\".to_string();\r\n    let result = client\r\n        .write_tag(\"NullString\", PlcValue::String(null_string))\r\n        .await;\r\n    assert!(result.is_err());\r\n\r\n    Ok(())\r\n}\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","sheco","projects","rust-ethernet-ip","tests","integration_test.rs"],"content":"use rust_ethernet_ip::{EipClient, PlcConfig, PlcManager, PlcValue, TagScope};\r\nuse std::collections::HashMap;\r\nuse std::time::Duration;\r\n\r\n/// Helper function to check if a PLC is available at the given address\r\nasync fn is_plc_available(address: \u0026str) -\u003e bool {\r\n    match EipClient::connect(address).await {\r\n        Ok(_) =\u003e true,\r\n        Err(_) =\u003e false,\r\n    }\r\n}\r\n\r\n#[tokio::test]\r\n#[ignore]\r\nasync fn test_tag_discovery() {\r\n    let address = \"127.0.0.1:44818\";\r\n    if !is_plc_available(address).await {\r\n        println!(\r\n            \"Skipping test_tag_discovery: No PLC available at {}\",\r\n            address\r\n        );\r\n        return;\r\n    }\r\n\r\n    let mut client = EipClient::connect(address).await.unwrap();\r\n\r\n    // Discover tags\r\n    client.discover_tags().await.unwrap();\r\n\r\n    // Verify some common tags exist\r\n    let metadata = client.get_tag_metadata(\"_IO_EM_DI00\").await.unwrap();\r\n    assert_eq!(metadata.data_type, 0x00C1); // BOOL type\r\n    assert_eq!(metadata.scope, TagScope::Controller);\r\n\r\n    let metadata = client.get_tag_metadata(\"_IO_EM_DI01\").await.unwrap();\r\n    assert_eq!(metadata.data_type, 0x00C1); // BOOL type\r\n    assert_eq!(metadata.scope, TagScope::Controller);\r\n}\r\n\r\n#[tokio::test]\r\n#[ignore]\r\nasync fn test_udt_operations() {\r\n    let address = \"127.0.0.1:44818\";\r\n    if !is_plc_available(address).await {\r\n        println!(\r\n            \"Skipping test_udt_operations: No PLC available at {}\",\r\n            address\r\n        );\r\n        return;\r\n    }\r\n\r\n    let mut client = EipClient::connect(address).await.unwrap();\r\n\r\n    // Read a UDT\r\n    let udt_value = client.read_tag(\"MotorData\").await.unwrap();\r\n    if let PlcValue::Udt(members) = udt_value {\r\n        assert!(members.contains_key(\"Speed\"));\r\n        assert!(members.contains_key(\"Current\"));\r\n        assert!(members.contains_key(\"Status\"));\r\n    } else {\r\n        panic!(\"Expected UDT value\");\r\n    }\r\n\r\n    // Write a UDT\r\n    let mut members = HashMap::new();\r\n    members.insert(\"Speed\".to_string(), PlcValue::Dint(1500));\r\n    members.insert(\"Current\".to_string(), PlcValue::Real(10.5));\r\n    members.insert(\r\n        \"Status\".to_string(),\r\n        PlcValue::String(\"Running\".to_string()),\r\n    );\r\n\r\n    client\r\n        .write_tag(\"MotorData\", PlcValue::Udt(members))\r\n        .await\r\n        .unwrap();\r\n}\r\n\r\n#[tokio::test]\r\n#[ignore]\r\nasync fn test_multiple_plc_connections() {\r\n    let address1 = \"127.0.0.1:44818\";\r\n    let address2 = \"127.0.0.1:44819\";\r\n    if !is_plc_available(address1).await || !is_plc_available(address2).await {\r\n        println!(\r\n            \"Skipping test_multiple_plc_connections: PLCs not available at {} or {}\",\r\n            address1, address2\r\n        );\r\n        return;\r\n    }\r\n\r\n    let mut manager = PlcManager::new();\r\n\r\n    // Configure two PLCs\r\n    let config1 = PlcConfig {\r\n        address: address1.parse().unwrap(),\r\n        max_connections: 2,\r\n        connection_timeout: Duration::from_secs(5),\r\n        health_check_interval: Duration::from_secs(30),\r\n        max_packet_size: 4000,\r\n    };\r\n\r\n    let config2 = PlcConfig {\r\n        address: address2.parse().unwrap(),\r\n        max_connections: 2,\r\n        connection_timeout: Duration::from_secs(5),\r\n        health_check_interval: Duration::from_secs(30),\r\n        max_packet_size: 4000,\r\n    };\r\n\r\n    manager.add_plc(config1.clone());\r\n    manager.add_plc(config2.clone());\r\n\r\n    // Get and use client1\r\n    {\r\n        let client1 = manager.get_connection(config1.address).await.unwrap();\r\n        client1\r\n            .write_tag(\"Tag1\", PlcValue::Bool(true))\r\n            .await\r\n            .unwrap();\r\n        let value1 = client1.read_tag(\"Tag1\").await.unwrap();\r\n        assert_eq!(value1, PlcValue::Bool(true));\r\n    }\r\n    // Get and use client2\r\n    {\r\n        let client2 = manager.get_connection(config2.address).await.unwrap();\r\n        client2.write_tag(\"Tag2\", PlcValue::Dint(42)).await.unwrap();\r\n        let value2 = client2.read_tag(\"Tag2\").await.unwrap();\r\n        assert_eq!(value2, PlcValue::Dint(42));\r\n    }\r\n}\r\n\r\n#[tokio::test]\r\n#[ignore]\r\nasync fn test_connection_pooling() {\r\n    let address = \"127.0.0.1:44818\";\r\n    if !is_plc_available(address).await {\r\n        println!(\r\n            \"Skipping test_connection_pooling: No PLC available at {}\",\r\n            address\r\n        );\r\n        return;\r\n    }\r\n\r\n    let mut manager = PlcManager::new();\r\n\r\n    let config = PlcConfig {\r\n        address: address.parse().unwrap(),\r\n        max_connections: 2,\r\n        connection_timeout: Duration::from_secs(5),\r\n        health_check_interval: Duration::from_secs(30),\r\n        max_packet_size: 4000,\r\n    };\r\n\r\n    manager.add_plc(config.clone());\r\n\r\n    // Get and use client1\r\n    {\r\n        let client1 = manager.get_connection(config.address).await.unwrap();\r\n        client1\r\n            .write_tag(\"Tag1\", PlcValue::Bool(true))\r\n            .await\r\n            .unwrap();\r\n        let value1 = client1.read_tag(\"Tag1\").await.unwrap();\r\n        assert_eq!(value1, PlcValue::Bool(true));\r\n    }\r\n    // Get and use client2\r\n    {\r\n        let client2 = manager.get_connection(config.address).await.unwrap();\r\n        client2\r\n            .write_tag(\"Tag2\", PlcValue::Bool(false))\r\n            .await\r\n            .unwrap();\r\n        let value2 = client2.read_tag(\"Tag2\").await.unwrap();\r\n        assert_eq!(value2, PlcValue::Bool(false));\r\n    }\r\n}\r\n\r\n#[tokio::test]\r\n#[ignore]\r\nasync fn test_health_monitoring() {\r\n    let address = \"127.0.0.1:44818\";\r\n    if !is_plc_available(address).await {\r\n        println!(\r\n            \"Skipping test_health_monitoring: No PLC available at {}\",\r\n            address\r\n        );\r\n        return;\r\n    }\r\n\r\n    let mut manager = PlcManager::new();\r\n\r\n    let config = PlcConfig {\r\n        address: address.parse().unwrap(),\r\n        max_connections: 2,\r\n        connection_timeout: Duration::from_secs(5),\r\n        health_check_interval: Duration::from_secs(30),\r\n        max_packet_size: 4000,\r\n    };\r\n\r\n    manager.add_plc(config.clone());\r\n\r\n    // Get a connection\r\n    let _client = manager.get_connection(config.address).await.unwrap();\r\n\r\n    // Perform health check\r\n    manager.check_health().await;\r\n\r\n    // Clean up inactive connections\r\n    manager.cleanup_connections();\r\n}\r\n\r\n#[tokio::test]\r\n#[ignore]\r\nasync fn test_large_packet_support() {\r\n    let address = \"127.0.0.1:44818\";\r\n    if !is_plc_available(address).await {\r\n        println!(\r\n            \"Skipping test_large_packet_support: No PLC available at {}\",\r\n            address\r\n        );\r\n        return;\r\n    }\r\n\r\n    let mut client = EipClient::connect(address).await.unwrap();\r\n\r\n    // Set maximum packet size\r\n    client.set_max_packet_size(4000);\r\n\r\n    // Create a large string\r\n    let large_string = \"X\".repeat(2000);\r\n\r\n    // Write the large string\r\n    client\r\n        .write_tag(\"LargeString\", PlcValue::String(large_string.clone()))\r\n        .await\r\n        .unwrap();\r\n\r\n    // Read it back\r\n    let value = client.read_tag(\"LargeString\").await.unwrap();\r\n    if let PlcValue::String(s) = value {\r\n        assert_eq!(s, large_string);\r\n    } else {\r\n        panic!(\"Expected string value\");\r\n    }\r\n}\r\n\r\n#[tokio::test]\r\n#[ignore]\r\nasync fn test_string_operations() {\r\n    let address = \"127.0.0.1:44818\";\r\n    if !is_plc_available(address).await {\r\n        println!(\r\n            \"Skipping test_string_operations: No PLC available at {}\",\r\n            address\r\n        );\r\n        return;\r\n    }\r\n\r\n    let mut client = EipClient::connect(address).await.unwrap();\r\n\r\n    // Test basic string operations\r\n    let test_string = \"Hello, PLC!\".to_string();\r\n    client\r\n        .write_tag(\"TestString\", PlcValue::String(test_string.clone()))\r\n        .await\r\n        .unwrap();\r\n    let string_value = client.read_tag(\"TestString\").await.unwrap();\r\n    assert_eq!(string_value, PlcValue::String(test_string));\r\n\r\n    // Test empty string\r\n    let empty_string = \"\".to_string();\r\n    client\r\n        .write_tag(\"EmptyString\", PlcValue::String(empty_string.clone()))\r\n        .await\r\n        .unwrap();\r\n    let empty_value = client.read_tag(\"EmptyString\").await.unwrap();\r\n    assert_eq!(empty_value, PlcValue::String(empty_string));\r\n\r\n    // Test string with special characters\r\n    let special_string = \"!@#$%^\u0026*()_+-=[]{}|;:,.\u003c\u003e?\".to_string();\r\n    client\r\n        .write_tag(\"SpecialString\", PlcValue::String(special_string.clone()))\r\n        .await\r\n        .unwrap();\r\n    let special_value = client.read_tag(\"SpecialString\").await.unwrap();\r\n    assert_eq!(special_value, PlcValue::String(special_string));\r\n\r\n    // Test string with spaces\r\n    let spaced_string = \"Hello World with Spaces\".to_string();\r\n    client\r\n        .write_tag(\"SpacedString\", PlcValue::String(spaced_string.clone()))\r\n        .await\r\n        .unwrap();\r\n    let spaced_value = client.read_tag(\"SpacedString\").await.unwrap();\r\n    assert_eq!(spaced_value, PlcValue::String(spaced_string));\r\n\r\n    // Test string with numbers\r\n    let number_string = \"12345\".to_string();\r\n    client\r\n        .write_tag(\"NumberString\", PlcValue::String(number_string.clone()))\r\n        .await\r\n        .unwrap();\r\n    let number_value = client.read_tag(\"NumberString\").await.unwrap();\r\n    assert_eq!(number_value, PlcValue::String(number_string));\r\n\r\n    // Test string with mixed content\r\n    let mixed_string = \"Hello123!@# World\".to_string();\r\n    client\r\n        .write_tag(\"MixedString\", PlcValue::String(mixed_string.clone()))\r\n        .await\r\n        .unwrap();\r\n    let mixed_value = client.read_tag(\"MixedString\").await.unwrap();\r\n    assert_eq!(mixed_value, PlcValue::String(mixed_string));\r\n}\r\n\r\n#[tokio::test]\r\n#[ignore]\r\nasync fn test_string_error_handling() {\r\n    let address = \"127.0.0.1:44818\";\r\n    if !is_plc_available(address).await {\r\n        println!(\r\n            \"Skipping test_string_error_handling: No PLC available at {}\",\r\n            address\r\n        );\r\n        return;\r\n    }\r\n\r\n    let mut client = EipClient::connect(address).await.unwrap();\r\n\r\n    // Test string too long\r\n    let long_string = \"X\".repeat(100); // Longer than 82 characters\r\n    let result = client\r\n        .write_tag(\"LongString\", PlcValue::String(long_string))\r\n        .await;\r\n    assert!(result.is_err());\r\n\r\n    // Test non-ASCII characters\r\n    let non_ascii_string = \"Hello 世界\".to_string();\r\n    let result = client\r\n        .write_tag(\"NonAsciiString\", PlcValue::String(non_ascii_string))\r\n        .await;\r\n    assert!(result.is_err());\r\n\r\n    // Test string with null bytes\r\n    let null_string = \"Hello\\0World\".to_string();\r\n    let result = client\r\n        .write_tag(\"NullString\", PlcValue::String(null_string))\r\n        .await;\r\n    assert!(result.is_err());\r\n\r\n    // Test non-existent string tag\r\n    let result = client.read_tag(\"NonExistentString\").await;\r\n    assert!(result.is_err());\r\n}\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","sheco","projects","rust-ethernet-ip","tests","udt_discovery_tests.rs"],"content":"// udt_discovery_tests.rs - Integration tests for UDT discovery functionality\r\n// =========================================================================\r\n//\r\n// This file contains comprehensive integration tests for the UDT discovery\r\n// and hierarchical tag access features of the Rust EtherNet/IP library.\r\n\r\nuse rust_ethernet_ip::{TagMetadata, TagPermissions, TagScope, UdtDefinition, UdtMember};\r\nuse std::time::Instant;\r\n\r\n/// Mock EipClient for testing UDT discovery without actual PLC connection\r\nstruct MockEipClient {\r\n    udt_definitions: std::collections::HashMap\u003cString, UdtDefinition\u003e,\r\n}\r\n\r\nimpl MockEipClient {\r\n    fn new() -\u003e Self {\r\n        let mut client = Self {\r\n            udt_definitions: std::collections::HashMap::new(),\r\n        };\r\n\r\n        // Add some mock UDT definitions\r\n        client.add_mock_udt_definition(\r\n            \"MotorData\",\r\n            vec![\r\n                (\"Running\", 0x00C1, 1),  // BOOL\r\n                (\"Speed\", 0x00CA, 4),    // REAL\r\n                (\"Position\", 0x00C4, 4), // DINT\r\n            ],\r\n        );\r\n\r\n        client.add_mock_udt_definition(\r\n            \"Recipe\",\r\n            vec![\r\n                (\"Name\", 0x00CE, 86),       // STRING\r\n                (\"Temperature\", 0x00CA, 4), // REAL\r\n                (\"Duration\", 0x00C4, 4),    // DINT\r\n            ],\r\n        );\r\n\r\n        client\r\n    }\r\n\r\n    fn add_mock_udt_definition(\u0026mut self, name: \u0026str, members: Vec\u003c(\u0026str, u16, u32)\u003e) {\r\n        let udt_members: Vec\u003cUdtMember\u003e = members\r\n            .into_iter()\r\n            .enumerate()\r\n            .map(|(i, (member_name, data_type, size))| UdtMember {\r\n                name: member_name.to_string(),\r\n                data_type,\r\n                offset: (i as u32) * size,\r\n                size,\r\n            })\r\n            .collect();\r\n\r\n        self.udt_definitions.insert(\r\n            name.to_string(),\r\n            UdtDefinition {\r\n                name: name.to_string(),\r\n                members: udt_members,\r\n            },\r\n        );\r\n    }\r\n}\r\n\r\n/// Test UDT definition caching functionality\r\n#[test]\r\nfn test_udt_definition_caching() {\r\n    let client = MockEipClient::new();\r\n\r\n    // Test that UDT definitions are properly stored\r\n    assert!(client.udt_definitions.contains_key(\"MotorData\"));\r\n    assert!(client.udt_definitions.contains_key(\"Recipe\"));\r\n    assert_eq!(client.udt_definitions.len(), 2);\r\n\r\n    // Test MotorData UDT structure\r\n    let motor_data = client.udt_definitions.get(\"MotorData\").unwrap();\r\n    assert_eq!(motor_data.name, \"MotorData\");\r\n    assert_eq!(motor_data.members.len(), 3);\r\n\r\n    // Check individual members\r\n    assert_eq!(motor_data.members[0].name, \"Running\");\r\n    assert_eq!(motor_data.members[0].data_type, 0x00C1);\r\n    assert_eq!(motor_data.members[0].offset, 0);\r\n    assert_eq!(motor_data.members[0].size, 1);\r\n\r\n    assert_eq!(motor_data.members[1].name, \"Speed\");\r\n    assert_eq!(motor_data.members[1].data_type, 0x00CA);\r\n    assert_eq!(motor_data.members[1].offset, 4);\r\n    assert_eq!(motor_data.members[1].size, 4);\r\n\r\n    assert_eq!(motor_data.members[2].name, \"Position\");\r\n    assert_eq!(motor_data.members[2].data_type, 0x00C4);\r\n    assert_eq!(motor_data.members[2].offset, 8);\r\n    assert_eq!(motor_data.members[2].size, 4);\r\n}\r\n\r\n/// Test hierarchical tag name generation\r\n#[test]\r\nfn test_hierarchical_tag_names() {\r\n    let client = MockEipClient::new();\r\n\r\n    // Test MotorData UDT member names\r\n    let motor_data = client.udt_definitions.get(\"MotorData\").unwrap();\r\n    let expected_names = vec![\"MotorData.Running\", \"MotorData.Speed\", \"MotorData.Position\"];\r\n\r\n    for (i, member) in motor_data.members.iter().enumerate() {\r\n        let full_name = format!(\"{}.{}\", motor_data.name, member.name);\r\n        assert_eq!(full_name, expected_names[i]);\r\n    }\r\n}\r\n\r\n/// Test tag metadata creation for UDT members\r\n#[test]\r\nfn test_udt_member_metadata() {\r\n    let motor_data = UdtDefinition {\r\n        name: \"MotorData\".to_string(),\r\n        members: vec![\r\n            UdtMember {\r\n                name: \"Running\".to_string(),\r\n                data_type: 0x00C1,\r\n                offset: 0,\r\n                size: 1,\r\n            },\r\n            UdtMember {\r\n                name: \"Speed\".to_string(),\r\n                data_type: 0x00CA,\r\n                offset: 4,\r\n                size: 4,\r\n            },\r\n        ],\r\n    };\r\n\r\n    // Test metadata for BOOL member\r\n    let bool_metadata = TagMetadata {\r\n        data_type: motor_data.members[0].data_type,\r\n        scope: TagScope::Controller,\r\n        permissions: TagPermissions {\r\n            readable: true,\r\n            writable: true,\r\n        },\r\n        is_array: false,\r\n        dimensions: Vec::new(),\r\n        last_access: Instant::now(),\r\n        size: motor_data.members[0].size,\r\n        array_info: None,\r\n        last_updated: Instant::now(),\r\n    };\r\n\r\n    assert_eq!(bool_metadata.data_type, 0x00C1);\r\n    assert_eq!(bool_metadata.size, 1);\r\n    assert!(!bool_metadata.is_array);\r\n\r\n    // Test metadata for REAL member\r\n    let real_metadata = TagMetadata {\r\n        data_type: motor_data.members[1].data_type,\r\n        scope: TagScope::Controller,\r\n        permissions: TagPermissions {\r\n            readable: true,\r\n            writable: true,\r\n        },\r\n        is_array: false,\r\n        dimensions: Vec::new(),\r\n        last_access: Instant::now(),\r\n        size: motor_data.members[1].size,\r\n        array_info: None,\r\n        last_updated: Instant::now(),\r\n    };\r\n\r\n    assert_eq!(real_metadata.data_type, 0x00CA);\r\n    assert_eq!(real_metadata.size, 4);\r\n    assert!(!real_metadata.is_array);\r\n}\r\n\r\n/// Test UDT member discovery simulation\r\n#[test]\r\nfn test_udt_member_discovery_simulation() {\r\n    let client = MockEipClient::new();\r\n\r\n    // Simulate discovering UDT members for MotorData\r\n    let motor_data = client.udt_definitions.get(\"MotorData\").unwrap();\r\n    let mut discovered_members = Vec::new();\r\n\r\n    for member in \u0026motor_data.members {\r\n        let full_name = format!(\"{}.{}\", motor_data.name, member.name);\r\n        let metadata = TagMetadata {\r\n            data_type: member.data_type,\r\n            scope: TagScope::Controller,\r\n            permissions: TagPermissions {\r\n                readable: true,\r\n                writable: true,\r\n            },\r\n            is_array: false,\r\n            dimensions: Vec::new(),\r\n            last_access: Instant::now(),\r\n            size: member.size,\r\n            array_info: None,\r\n            last_updated: Instant::now(),\r\n        };\r\n\r\n        discovered_members.push((full_name, metadata));\r\n    }\r\n\r\n    // Verify discovered members\r\n    assert_eq!(discovered_members.len(), 3);\r\n\r\n    let member_names: Vec\u003c\u0026String\u003e = discovered_members.iter().map(|(name, _)| name).collect();\r\n    assert!(member_names.contains(\u0026\u0026\"MotorData.Running\".to_string()));\r\n    assert!(member_names.contains(\u0026\u0026\"MotorData.Speed\".to_string()));\r\n    assert!(member_names.contains(\u0026\u0026\"MotorData.Position\".to_string()));\r\n}\r\n\r\n/// Test nested UDT structure discovery\r\n#[test]\r\nfn test_nested_udt_discovery() {\r\n    let mut client = MockEipClient::new();\r\n\r\n    // Add a nested UDT structure\r\n    client.add_mock_udt_definition(\r\n        \"MotorData.Status\",\r\n        vec![\r\n            (\"Active\", 0x00C1, 1),     // BOOL\r\n            (\"ErrorCode\", 0x00C4, 4),  // DINT\r\n            (\"LastUpdate\", 0x00C4, 4), // DINT\r\n        ],\r\n    );\r\n\r\n    // Simulate nested discovery\r\n    let motor_data = client.udt_definitions.get(\"MotorData\").unwrap();\r\n    let status_udt = client.udt_definitions.get(\"MotorData.Status\").unwrap();\r\n\r\n    let mut all_discovered_tags = Vec::new();\r\n\r\n    // Add base UDT members\r\n    for member in \u0026motor_data.members {\r\n        let full_name = format!(\"{}.{}\", motor_data.name, member.name);\r\n        let metadata = TagMetadata {\r\n            data_type: member.data_type,\r\n            scope: TagScope::Controller,\r\n            permissions: TagPermissions {\r\n                readable: true,\r\n                writable: true,\r\n            },\r\n            is_array: false,\r\n            dimensions: Vec::new(),\r\n            last_access: Instant::now(),\r\n            size: member.size,\r\n            array_info: None,\r\n            last_updated: Instant::now(),\r\n        };\r\n        all_discovered_tags.push((full_name, metadata));\r\n    }\r\n\r\n    // Add nested UDT members\r\n    for member in \u0026status_udt.members {\r\n        let full_name = format!(\"{}.{}\", status_udt.name, member.name);\r\n        let metadata = TagMetadata {\r\n            data_type: member.data_type,\r\n            scope: TagScope::Controller,\r\n            permissions: TagPermissions {\r\n                readable: true,\r\n                writable: true,\r\n            },\r\n            is_array: false,\r\n            dimensions: Vec::new(),\r\n            last_access: Instant::now(),\r\n            size: member.size,\r\n            array_info: None,\r\n            last_updated: Instant::now(),\r\n        };\r\n        all_discovered_tags.push((full_name, metadata));\r\n    }\r\n\r\n    // Verify nested structure\r\n    assert_eq!(all_discovered_tags.len(), 6); // 3 base + 3 nested\r\n\r\n    let tag_names: Vec\u003c\u0026String\u003e = all_discovered_tags.iter().map(|(name, _)| name).collect();\r\n    assert!(tag_names.contains(\u0026\u0026\"MotorData.Running\".to_string()));\r\n    assert!(tag_names.contains(\u0026\u0026\"MotorData.Speed\".to_string()));\r\n    assert!(tag_names.contains(\u0026\u0026\"MotorData.Position\".to_string()));\r\n    assert!(tag_names.contains(\u0026\u0026\"MotorData.Status.Active\".to_string()));\r\n    assert!(tag_names.contains(\u0026\u0026\"MotorData.Status.ErrorCode\".to_string()));\r     <script>const e = React.createElement;

function pathToString(path) {
  if (path[0] === '/') {
    return '/' + path.slice(1).join('/');
  } else {
    return path.join('/');
  }
}

function findCommonPath(files) {
  if (!files || !files.length) {
    return [];
  }

  function isPrefix(arr, prefix) {
    if (arr.length < prefix.length) {
      return false;
    }
    for (let i = prefix.length - 1; i >= 0; --i) {
      if (arr[i] !== prefix[i]) {
        return false;
      }
    }
    return true;
  }

  let commonPath = files[0].path.slice(0, -1);
  while (commonPath.length) {
    if (files.every(file => isPrefix(file.path, commonPath))) {
      break;
    }
    commonPath.pop();
  }
  return commonPath;
}

function findFolders(files) {
  if (!files || !files.length) {
    return [];
  }

  let folders = files.filter(file => file.path.length > 1).map(file => file.path[0]);
  folders = [...new Set(folders)]; // unique
  folders.sort();

  folders = folders.map(folder => {
    let filesInFolder = files
      .filter(file => file.path[0] === folder)
      .map(file => ({
        ...file,
        path: file.path.slice(1),
        parent: [...file.parent, file.path[0]],
      }));

    const children = findFolders(filesInFolder); // recursion

    return {
      is_folder: true,
      path: [folder],
      parent: files[0].parent,
      children,
      covered: children.reduce((sum, file) => sum + file.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.coverable, 0),
      prevRun: {
        covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
        coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
      }
    };
  });

  return [
    ...folders,
    ...files.filter(file => file.path.length === 1),
  ];
}

class App extends React.Component {
  constructor(...args) {
    super(...args);

    this.state = {
      current: [],
    };
  }

  componentDidMount() {
    this.updateStateFromLocation();
    window.addEventListener("hashchange", () => this.updateStateFromLocation(), false);
  }

  updateStateFromLocation() {
    if (window.location.hash.length > 1) {
      const current = window.location.hash.substr(1).split('/');
      this.setState({current});
    } else {
      this.setState({current: []});
    }
  }

  getCurrentPath() {
    let file = this.props.root;
    let path = [file];
    for (let p of this.state.current) {
      file = file.children.find(file => file.path[0] === p);
      if (!file) {
        return path;
      }
      path.push(file);
    }
    return path;
  }

  render() {
    const path = this.getCurrentPath();
    const file = path[path.length - 1];

    let w = null;
    if (file.is_folder) {
      w = e(FilesList, {
        folder: file,
        onSelectFile: this.selectFile.bind(this),
        onBack: path.length > 1 ? this.back.bind(this) : null,
      });
    } else {
      w = e(DisplayFile, {
        file,
        onBack: this.back.bind(this),
      });
    }

    return e('div', {className: 'app'}, w);
  }

  selectFile(file) {
    this.setState(({current}) => {
      return {current: [...current, file.path[0]]};
    }, () => this.updateHash());
  }

  back(file) {
    this.setState(({current}) => {
      return {current: current.slice(0, current.length - 1)};
    }, () => this.updateHash());
  }

  updateHash() {
    if (!this.state.current || !this.state.current.length) {
      window.location = '#';
    } else {
      window.location = '#' + this.state.current.join('/');
    }
  }
}

function FilesList({folder, onSelectFile, onBack}) {
  let files = folder.children;
  return e('div', {className: 'display-folder'},
    e(FileHeader, {file: folder, onBack}),
    e('table', {className: 'files-list'},
      e('thead', {className: 'files-list__head'},
        e('tr', null,
          e('th', null, "Path"),
          e('th', null, "Coverage")
        )
      ),
      e('tbody', {className: 'files-list__body'},
        files.map(file => e(File, {file, onClick: onSelectFile}))
      )
    )
  );
}

function File({file, onClick}) {
  const coverage = file.coverable ? file.covered / file.coverable * 100 : -1;
  const coverageDelta = file.prevRun &&
    (file.covered / file.coverable * 100 - file.prevRun.covered / file.prevRun.coverable * 100);

  return e('tr', {
      className: 'files-list__file'
        + (coverage >= 0 && coverage < 50 ? ' files-list__file_low': '')
        + (coverage >= 50 && coverage < 80 ? ' files-list__file_medium': '')
        + (coverage >= 80 ? ' files-list__file_high': '')
        + (file.is_folder ? ' files-list__file_folder': ''),
      onClick: () => onClick(file),
    },
    e('td', null, e('a', null, pathToString(file.path))),
    e('td', null,
      file.covered + ' / ' + file.coverable +
      (coverage >= 0 ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e('span', {title: 'Change from the previous run'},
        (coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : ''))
    )
  );
}

function DisplayFile({file, onBack}) {
  return e('div', {className: 'display-file'},
    e(FileHeader, {file, onBack}),
    e(FileContent, {file})
  );
}

function FileHeader({file, onBack}) {
  const coverage = file.covered / file.coverable * 100;
  const coverageDelta = file.prevRun && (coverage - file.prevRun.covered / file.prevRun.coverable * 100);

  return e('div', {className: 'file-header'},
    onBack ? e('a', {className: 'file-header__back', onClick: onBack}, 'Back') : null,
    e('div', {className: 'file-header__name'}, pathToString([...file.parent, ...file.path])),
    e('div', {className: 'file-header__stat'},
      'Covered: ' + file.covered + ' of ' + file.coverable +
      (file.coverable ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e('span', {title: 'Change from the previous run'},
        (coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : ''))
    )
  );
}

function FileContent({file}) {
  return e('pre', {className: 'file-content'},
    file.content.split(/\r?\n/).map((line, index) => {
      const trace = file.traces.find(trace => trace.line === index + 1);
      const covered = trace && trace.stats.Line;
      const uncovered = trace && !trace.stats.Line;
      return e('code', {
          className: 'code-line'
            + (covered ? ' code-line_covered' : '')
            + (uncovered ? ' code-line_uncovered' : ''),
          title: trace ? JSON.stringify(trace.stats, null, 2) : null,
        }, line);
    })
  );
}

(function(){
  const commonPath = findCommonPath(data.files);
  const prevFilesMap = new Map();

  previousData && previousData.files.forEach((file) => {
    const path = file.path.slice(commonPath.length).join('/');
    prevFilesMap.set(path, file);
  });

  const files = data.files.map((file) => {
    const path = file.path.slice(commonPath.length);
    const { covered = 0, coverable = 0 } = prevFilesMap.get(path.join('/')) || {};
    return {
      ...file,
      path,
      parent: commonPath,
      prevRun: { covered, coverable },
    };
  });

  const children = findFolders(files);

  const root = {
    is_folder: true,
    children,
    path: commonPath,
    parent: [],
    covered: children.reduce((sum, file) => sum + file.covered, 0),
    coverable: children.reduce((sum, file) => sum + file.coverable, 0),
    prevRun: {
      covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
    }
  };

  ReactDOM.render(e(App, {root, prevFilesMap}), document.getElementById('root'));
}());
</script>
