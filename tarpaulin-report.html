or the UDT discovery and\r\n// hierarchical tag access features of the Rust EtherNet/IP library.\r\n\r\nuse criterion::{black_box, criterion_group, criterion_main, BenchmarkId, Criterion};\r\nuse rust_ethernet_ip::{TagMetadata, TagPermissions, TagScope, UdtDefinition, UdtMember};\r\nuse std::collections::HashMap;\r\nuse std::time::Instant;\r\n\r\n/// Mock UDT definitions for benchmarking\r\nfn create_mock_udt_definitions(count: usize) -\u003e HashMap\u003cString, UdtDefinition\u003e {\r\n    let mut definitions = HashMap::new();\r\n\r\n    for i in 0..count {\r\n        let udt_name = format!(\"UDT_{:04}\", i);\r\n        let members = vec![\r\n            UdtMember {\r\n                name: \"Running\".to_string(),\r\n                data_type: 0x00C1,\r\n                offset: 0,\r\n                size: 1,\r\n            },\r\n            UdtMember {\r\n                name: \"Speed\".to_string(),\r\n                data_type: 0x00CA,\r\n                offset: 4,\r\n                size: 4,\r\n            },\r\n            UdtMember {\r\n                name: \"Position\".to_string(),\r\n                data_type: 0x00C4,\r\n                offset: 8,\r\n                size: 4,\r\n            },\r\n            UdtMember {\r\n                name: \"Temperature\".to_string(),\r\n                data_type: 0x00CA,\r\n                offset: 12,\r\n                size: 4,\r\n            },\r\n            UdtMember {\r\n                name: \"Status\".to_string(),\r\n                data_type: 0x00C4,\r\n                offset: 16,\r\n                size: 4,\r\n            },\r\n        ];\r\n\r\n        definitions.insert(\r\n            udt_name.clone(),\r\n            UdtDefinition {\r\n                name: udt_name,\r\n                members,\r\n            },\r\n        );\r\n    }\r\n\r\n    definitions\r\n}\r\n\r\n/// Benchmark UDT member discovery\r\nfn benchmark_udt_member_discovery(c: \u0026mut Criterion) {\r\n    let mut group = c.benchmark_group(\"udt_member_discovery\");\r\n\r\n    for udt_count in [10, 100, 1000, 10000].iter() {\r\n        let udt_definitions = create_mock_udt_definitions(*udt_count);\r\n\r\n        group.bench_with_input(\r\n            BenchmarkId::new(\"discover_members\", udt_count),\r\n            udt_count,\r\n            |b, _| {\r\n                b.iter(|| {\r\n                    let mut all_tags = Vec::new();\r\n                    let mut tag_names = std::collections::HashSet::new();\r\n\r\n                    for (udt_name, udt_def) in \u0026udt_definitions {\r\n                        for member in \u0026udt_def.members {\r\n                            let full_name = format!(\"{}.{}\", udt_name, member.name);\r\n\r\n                            if !tag_names.contains(\u0026full_name) {\r\n                                let metadata = TagMetadata {\r\n                                    data_type: member.data_type,\r\n                                    scope: TagScope::Controller,\r\n                                    permissions: TagPermissions {\r\n                                        readable: true,\r\n                                        writable: true,\r\n                                    },\r\n                                    is_array: false,\r\n                                    dimensions: Vec::new(),\r\n                                    last_access: Instant::now(),\r\n                                    size: member.size,\r\n                                    array_info: None,\r\n                                    last_updated: Instant::now(),\r\n                                };\r\n\r\n                                all_tags.push((full_name.clone(), metadata));\r\n                                tag_names.insert(full_name);\r\n                            }\r\n                        }\r\n                    }\r\n\r\n                    black_box(all_tags)\r\n                })\r\n            },\r\n        );\r\n    }\r\n\r\n    group.finish();\r\n}\r\n\r\n/// Benchmark tag name validation\r\nfn benchmark_tag_name_validation(c: \u0026mut Criterion) {\r\n    let mut group = c.benchmark_group(\"tag_name_validation\");\r\n\r\n    let test_names = vec![\r\n        \"ValidTag\",\r\n        \"Valid_Tag\",\r\n        \"Valid.Tag\",\r\n        \"Valid123\",\r\n        \"Invalid123\",\r\n        \"Invalid__Tag\",\r\n        \"Invalid..Tag\",\r\n        \"Invalid-Tag\",\r\n        \"Invalid Tag\",\r\n        \"Invalid@Tag\",\r\n    ];\r\n\r\n    group.bench_function(\"validate_names\", |b| {\r\n        b.iter(|| {\r\n            for name in \u0026test_names {\r\n                // Simulate tag name validation logic\r\n                let is_valid = !name.is_empty()\r\n                    \u0026\u0026 !name.trim().is_empty()\r\n                    \u0026\u0026 !name.starts_with(char::is_numeric)\r\n                    \u0026\u0026 !name.contains(\"__\")\r\n                    \u0026\u0026 !name.contains(\"..\")\r\n                    \u0026\u0026 !name.contains('-')\r\n                    \u0026\u0026 !name.contains(' ')\r\n                    \u0026\u0026 !name.contains('@');\r\n\r\n                black_box(is_valid);\r\n            }\r\n        })\r\n    });\r\n\r\n    group.finish();\r\n}\r\n\r\n/// Benchmark UDT definition caching\r\nfn benchmark_udt_caching(c: \u0026mut Criterion) {\r\n    let mut group = c.benchmark_group(\"udt_caching\");\r\n\r\n    let udt_definitions = create_mock_udt_definitions(1000);\r\n\r\n    group.bench_function(\"cache_operations\", |b| {\r\n        b.iter(|| {\r\n            let mut cache = HashMap::new();\r\n\r\n            // Insert UDT definitions\r\n            for (name, definition) in \u0026udt_definitions {\r\n                cache.insert(name.clone(), definition.clone());\r\n            }\r\n\r\n            // Retrieve UDT definitions\r\n            for name in udt_definitions.keys() {\r\n                let _definition = cache.get(name);\r\n                black_box(_definition);\r\n            }\r\n\r\n            // Clear cache\r\n            cache.clear();\r\n\r\n            black_box(cache)\r\n        })\r\n    });\r\n\r\n    group.finish();\r\n}\r\n\r\n/// Benchmark hierarchical tag discovery\r\nfn benchmark_hierarchical_discovery(c: \u0026mut Criterion) {\r\n    let mut group = c.benchmark_group(\"hierarchical_discovery\");\r\n\r\n    for depth in [1, 2, 3, 4].iter() {\r\n        group.bench_with_input(\r\n            BenchmarkId::new(\"discovery_depth\", depth),\r\n            depth,\r\n            |b, depth| {\r\n                b.iter(|| {\r\n                    let mut all_tags = Vec::new();\r\n                    let mut tag_names = std::collections::HashSet::new();\r\n\r\n                    // Simulate hierarchical discovery\r\n                    for level in 0..*depth {\r\n                        let base_name = if level == 0 {\r\n                            \"BaseUDT\".to_string()\r\n                        } else {\r\n                            format!(\"BaseUDT.Level{}\", level)\r\n                        };\r\n\r\n                        for member_num in 0..5 {\r\n                            let member_name = format!(\"Member{}\", member_num);\r\n                            let full_name = if level == 0 {\r\n                                format!(\"{}.{}\", base_name, member_name)\r\n                            } else {\r\n                                format!(\"{}.{}\", base_name, member_name)\r\n                            };\r\n\r\n                            if !tag_names.contains(\u0026full_name) {\r\n                                let metadata = TagMetadata {\r\n                                    data_type: 0x00C4,\r\n                                    scope: TagScope::Controller,\r\n                                    permissions: TagPermissions {\r\n                                        readable: true,\r\n                                        writable: true,\r\n                                    },\r\n                                    is_array: false,\r\n                                    dimensions: Vec::new(),\r\n                                    last_access: Instant::now(),\r\n                                    size: 4,\r\n                                    array_info: None,\r\n                                    last_updated: Instant::now(),\r\n                                };\r\n\r\n                                all_tags.push((full_name.clone(), metadata));\r\n                                tag_names.insert(full_name);\r\n                            }\r\n                        }\r\n                    }\r\n\r\n                    black_box(all_tags)\r\n                })\r\n            },\r\n        );\r\n    }\r\n\r\n    group.finish();\r\n}\r\n\r\n/// Benchmark UDT response parsing\r\nfn benchmark_udt_response_parsing(c: \u0026mut Criterion) {\r\n    let mut group = c.benchmark_group(\"udt_response_parsing\");\r\n\r\n    // Create mock response data\r\n    let response_data: Vec\u003cu8\u003e = (0..1000)\r\n        .flat_map(|i| {\r\n            let data_type = match i % 4 {\r\n                0 =\u003e 0x00C1, // BOOL\r\n                1 =\u003e 0x00C4, // DINT\r\n                2 =\u003e 0x00CA, // REAL\r\n                _ =\u003e 0x00CE, // STRING\r\n            };\r\n\r\n            vec![\r\n                (data_type \u0026 0xFF) as u8,\r\n                ((data_type \u003e\u003e 8) \u0026 0xFF) as u8,\r\n                0x00,\r\n                0x00,\r\n            ]\r\n        })\r\n        .collect();\r\n\r\n    group.bench_function(\"parse_response\", |b| {\r\n        b.iter(|| {\r\n            let mut offset = 0;\r\n            let mut found_types = Vec::new();\r\n\r\n            while offset \u003c response_data.len().saturating_sub(4) {\r\n                let data_type =\r\n                    u16::from_le_bytes([response_data[offset], response_data[offset + 1]]);\r\n                found_types.push(data_type);\r\n                offset += 4;\r\n            }\r\n\r\n            black_box(found_types)\r\n        })\r\n    });\r\n\r\n    group.finish();\r\n}\r\n\r\n/// Benchmark large-scale tag discovery\r\nfn benchmark_large_scale_discovery(c: \u0026mut Criterion) {\r\n    let mut group = c.benchmark_group(\"large_scale_discovery\");\r\n\r\n    for tag_count in [1000, 10000, 100000].iter() {\r\n        group.bench_with_input(\r\n            BenchmarkId::new(\"discover_tags\", tag_count),\r\n            tag_count,\r\n            |b, tag_count| {\r\n                b.iter(|| {\r\n                    let mut all_tags = Vec::new();\r\n                    let mut tag_names = std::collections::HashSet::new();\r\n\r\n                    // Simulate discovering a large number of tags\r\n                    for i in 0..*tag_count {\r\n                        let tag_name = format!(\"Tag_{:06}\", i);\r\n\r\n                        if !tag_names.contains(\u0026tag_name) {\r\n                            let metadata = TagMetadata {\r\n                                data_type: 0x00C4,\r\n                                scope: TagScope::Controller,\r\n                                permissions: TagPermissions {\r\n                                    readable: true,\r\n                                    writable: true,\r\n                                },\r\n                                is_array: false,\r\n                                dimensions: Vec::new(),\r\n                                last_access: Instant::now(),\r\n                                size: 4,\r\n                                array_info: None,\r\n                                last_updated: Instant::now(),\r\n                            };\r\n\r\n                            all_tags.push((tag_name.clone(), metadata));\r\n                            tag_names.insert(tag_name);\r\n                        }\r\n                    }\r\n\r\n                    black_box(all_tags)\r\n                })\r\n            },\r\n        );\r\n    }\r\n\r\n    group.finish();\r\n}\r\n\r\n/// Benchmark memory usage for UDT discovery\r\nfn benchmark_memory_usage(c: \u0026mut Criterion) {\r\n    let mut group = c.benchmark_group(\"memory_usage\");\r\n\r\n    group.bench_function(\"udt_storage\", |b| {\r\n        b.iter(|| {\r\n            let mut definitions = HashMap::new();\r\n\r\n            // Create 1000 UDT definitions with 5 members each\r\n            for i in 0..1000 {\r\n                let udt_name = format!(\"UDT_{:04}\", i);\r\n                let members = vec![\r\n                    UdtMember {\r\n                        name: \"Member1\".to_string(),\r\n                        data_type: 0x00C1,\r\n                        offset: 0,\r\n                        size: 1,\r\n                    },\r\n                    UdtMember {\r\n                        name: \"Member2\".to_string(),\r\n                        data_type: 0x00C4,\r\n                        offset: 4,\r\n                        size: 4,\r\n                    },\r\n                    UdtMember {\r\n                        name: \"Member3\".to_string(),\r\n                        data_type: 0x00CA,\r\n                        offset: 8,\r\n                        size: 4,\r\n                    },\r\n                    UdtMember {\r\n                        name: \"Member4\".to_string(),\r\n                        data_type: 0x00C4,\r\n                        offset: 12,\r\n                        size: 4,\r\n                    },\r\n                    UdtMember {\r\n                        name: \"Member5\".to_string(),\r\n                        data_type: 0x00CA,\r\n                        offset: 16,\r\n                        size: 4,\r\n                    },\r\n                ];\r\n\r\n                definitions.insert(\r\n                    udt_name,\r\n                    UdtDefinition {\r\n                        name: format!(\"UDT_{:04}\", i),\r\n                        members,\r\n                    },\r\n                );\r\n            }\r\n\r\n            black_box(definitions)\r\n        })\r\n    });\r\n\r\n    group.finish();\r\n}\r\n\r\ncriterion_group!(\r\n    benches,\r\n    benchmark_udt_member_discovery,\r\n    benchmark_tag_name_validation,\r\n    benchmark_udt_caching,\r\n    benchmark_hierarchical_discovery,\r\n    benchmark_udt_response_parsing,\r\n    benchmark_large_scale_discovery,\r\n    benchmark_memory_usage\r\n);\r\n\r\ncriterion_main!(benches);\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","sheco","projects","rust-ethernet-ip","build.rs"],"content":"fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\r\n    vergen::EmitBuilder::builder()\r\n        .build_timestamp()\r\n        .git_sha(true)\r\n        .git_branch()\r\n        .git_commit_timestamp()\r\n        .emit()?;\r\n    Ok(())\r\n}\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","sheco","projects","rust-ethernet-ip","examples","advanced_tag_addressing.rs"],"content":"// examples/advanced_tag_addressing.rs\r\n// =========================================================================\r\n//\r\n// Advanced Tag Addressing Example for Allen-Bradley PLCs\r\n//\r\n// This example demonstrates the comprehensive tag addressing capabilities\r\n// of the rust-ethernet-ip library, including:\r\n//\r\n// - Program-scoped tags\r\n// - Array element access\r\n// - Bit-level operations\r\n// - UDT member access\r\n// - String operations\r\n// - Complex nested paths\r\n//\r\n// =========================================================================\r\n\r\nuse rust_ethernet_ip::{EipClient, PlcValue, TagPath};\r\nuse std::error::Error;\r\n\r\n#[tokio::main]\r\nasync fn main() -\u003e Result\u003c(), Box\u003cdyn Error\u003e\u003e {\r\n    println!(\"🚀 Advanced Tag Addressing Example\");\r\n    println!(\"==================================\");\r\n\r\n    // Note: This example requires a CompactLogix or ControlLogix PLC\r\n    // Update the IP address to match your PLC\r\n    let plc_address = \"192.168.1.100:44818\";\r\n\r\n    println!(\"📡 Connecting to PLC at {}\", plc_address);\r\n\r\n    // For demonstration purposes, we'll show tag path parsing without connecting\r\n    // Uncomment the following line to actually connect to a PLC:\r\n    // let mut client = EipClient::connect(plc_address).await?;\r\n\r\n    demonstrate_tag_path_parsing().await?;\r\n\r\n    // Uncomment to test with real PLC:\r\n    // demonstrate_real_plc_operations(\u0026mut client).await?;\r\n\r\n    Ok(())\r\n}\r\n\r\n/// Demonstrates tag path parsing capabilities\r\nasync fn demonstrate_tag_path_parsing() -\u003e Result\u003c(), Box\u003cdyn Error\u003e\u003e {\r\n    println!(\"\\n🔍 Tag Path Parsing Demonstration\");\r\n    println!(\"=================================\");\r\n\r\n    // 1. Controller-scoped tags (traditional)\r\n    println!(\"\\n1. Controller-Scoped Tags:\");\r\n    let simple_tag = TagPath::parse(\"MotorRunning\")?;\r\n    println!(\r\n        \"   Simple tag: {} -\u003e {}\",\r\n        simple_tag,\r\n        simple_tag.to_string()\r\n    );\r\n\r\n    // 2. Program-scoped tags (CompactLogix/ControlLogix)\r\n    println!(\"\\n2. Program-Scoped Tags:\");\r\n    let program_tag = TagPath::parse(\"Program:MainProgram.ConveyorSpeed\")?;\r\n    println!(\r\n        \"   Program tag: {} -\u003e Program: {:?}, Base: {}\",\r\n        program_tag,\r\n        program_tag.program_name(),\r\n        program_tag.base_tag_name()\r\n    );\r\n\r\n    let safety_tag = TagPath::parse(\"Program:Safety.EmergencyStop\")?;\r\n    println!(\r\n        \"   Safety tag: {} -\u003e Program: {:?}\",\r\n        safety_tag,\r\n        safety_tag.program_name()\r\n    );\r\n\r\n    // 3. Array element access\r\n    println!(\"\\n3. Array Element Access:\");\r\n    let array_element = TagPath::parse(\"SensorReadings[5]\")?;\r\n    println!(\"   Single dimension: {}\", array_element);\r\n\r\n    let matrix_element = TagPath::parse(\"Program:Vision.ImageData[10,20,3]\")?;\r\n    println!(\"   Multi-dimensional: {}\", matrix_element);\r\n\r\n    // 4. Bit-level operations\r\n    println!(\"\\n4. Bit-Level Operations:\");\r\n    let status_bit = TagPath::parse(\"StatusWord.15\")?;\r\n    println!(\"   Status bit: {}\", status_bit);\r\n\r\n    let program_bit = TagPath::parse(\"Program:IO.InputBank.7\")?;\r\n    println!(\"   Program bit: {}\", program_bit);\r\n\r\n    // 5. UDT member access\r\n    println!(\"\\n5. UDT Member Access:\");\r\n    let motor_speed = TagPath::parse(\"Motor1.Speed\")?;\r\n    println!(\"   Motor speed: {}\", motor_speed);\r\n\r\n    let nested_udt = TagPath::parse(\"Recipe.Step1.Temperature.Setpoint\")?;\r\n    println!(\"   Nested UDT: {}\", nested_udt);\r\n\r\n    let program_udt = TagPath::parse(\"Program:Process.Tank1.Level.Current\")?;\r\n    println!(\"   Program UDT: {}\", program_udt);\r\n\r\n    // 6. String operations\r\n    println!(\"\\n6. String Operations:\");\r\n    let string_length = TagPath::parse(\"ProductName.LEN\")?;\r\n    println!(\"   String length: {}\", string_length);\r\n\r\n    let string_char = TagPath::parse(\"ProductName.DATA[5]\")?;\r\n    println!(\"   String character: {}\", string_char);\r\n\r\n    // 7. Complex nested paths\r\n    println!(\"\\n7. Complex Nested Paths:\");\r\n    let complex_path = TagPath::parse(\"Program:Production.Lines[2].Stations[5].Motor.Status.15\")?;\r\n    println!(\"   Complex path: {}\", complex_path);\r\n    println!(\"   Base tag: {}\", complex_path.base_tag_name());\r\n    println!(\"   Is program-scoped: {}\", complex_path.is_program_scoped());\r\n\r\n    // 8. CIP path generation\r\n    println!(\"\\n8. CIP Path Generation:\");\r\n    let cip_path = complex_path.to_cip_path()?;\r\n    println!(\"   CIP bytes: {:02X?}\", cip_path);\r\n\r\n    Ok(())\r\n}\r\n\r\n/// Demonstrates real PLC operations (uncomment when connected to PLC)\r\n#[allow(dead_code)]\r\nasync fn demonstrate_real_plc_operations(client: \u0026mut EipClient) -\u003e Result\u003c(), Box\u003cdyn Error\u003e\u003e {\r\n    println!(\"\\n🏭 Real PLC Operations\");\r\n    println!(\"=====================\");\r\n\r\n    // Read program-scoped tags\r\n    println!(\"\\n📖 Reading Program-Scoped Tags:\");\r\n\r\n    // Example: Read a boolean from main program\r\n    match client.read_tag(\"Program:MainProgram.MotorRunning\").await {\r\n        Ok(PlcValue::Bool(value)) =\u003e {\r\n            println!(\"   Motor running: {}\", value);\r\n        }\r\n        Ok(other) =\u003e println!(\"   Unexpected type: {:?}\", other),\r\n        Err(e) =\u003e println!(\"   Error reading motor status: {}\", e),\r\n    }\r\n\r\n    // Example: Read an integer from a program\r\n    match client.read_tag(\"Program:MainProgram.ProductionCount\").await {\r\n        Ok(PlcValue::Dint(value)) =\u003e {\r\n            println!(\"   Production count: {}\", value);\r\n        }\r\n        Ok(other) =\u003e println!(\"   Unexpected type: {:?}\", other),\r\n        Err(e) =\u003e println!(\"   Error reading production count: {}\", e),\r\n    }\r\n\r\n    // Array operations\r\n    println!(\"\\n📊 Array Operations:\");\r\n\r\n    // Read array element\r\n    match client\r\n        .read_tag(\"Program:MainProgram.SensorReadings[0]\")\r\n        .await\r\n    {\r\n        Ok(value) =\u003e println!(\"   Sensor 0: {:?}\", value),\r\n        Err(e) =\u003e println!(\"   Error reading sensor: {}\", e),\r\n    }\r\n\r\n    // Bit operations\r\n    println!(\"\\n🔢 Bit Operations:\");\r\n\r\n    // Read specific bit\r\n    match client.read_tag(\"Program:MainProgram.StatusWord.5\").await {\r\n        Ok(PlcValue::Bool(value)) =\u003e {\r\n            println!(\"   Status bit 5: {}\", value);\r\n        }\r\n        Ok(other) =\u003e println!(\"   Unexpected type: {:?}\", other),\r\n        Err(e) =\u003e println!(\"   Error reading bit: {}\", e),\r\n    }\r\n\r\n    // UDT operations\r\n    println!(\"\\n🏗️ UDT Operations:\");\r\n\r\n    // Read UDT member\r\n    match client.read_tag(\"Program:MainProgram.Motor1.Speed\").await {\r\n        Ok(value) =\u003e println!(\"   Motor speed: {:?}\", value),\r\n        Err(e) =\u003e println!(\"   Error reading motor speed: {}\", e),\r\n    }\r\n\r\n    // Write operations\r\n    println!(\"\\n✏️ Write Operations:\");\r\n\r\n    // Write to program-scoped tag\r\n    match client\r\n        .write_tag(\"Program:MainProgram.SetPoint\", PlcValue::Dint(1500))\r\n        .await\r\n    {\r\n        Ok(_) =\u003e println!(\"   ✅ Set point updated to 1500\"),\r\n        Err(e) =\u003e println!(\"   ❌ Error writing set point: {}\", e),\r\n    }\r\n\r\n    // Write to array element\r\n    match client\r\n        .write_tag(\"Program:MainProgram.Setpoints[0]\", PlcValue::Real(72.5))\r\n        .await\r\n    {\r\n        Ok(_) =\u003e println!(\"   ✅ Setpoint[0] updated to 72.5\"),\r\n        Err(e) =\u003e println!(\"   ❌ Error writing setpoint: {}\", e),\r\n    }\r\n\r\n    // Write to bit\r\n    match client\r\n        .write_tag(\"Program:MainProgram.ControlWord.3\", PlcValue::Bool(true))\r\n        .await\r\n    {\r\n        Ok(_) =\u003e println!(\"   ✅ Control bit 3 set to true\"),\r\n        Err(e) =\u003e println!(\"   ❌ Error writing bit: {}\", e),\r\n    }\r\n\r\n    Ok(())\r\n}\r\n\r\n/// Demonstrates tag path validation and error handling\r\n#[allow(dead_code)]\r\nasync fn demonstrate_error_handling() -\u003e Result\u003c(), Box\u003cdyn Error\u003e\u003e {\r\n    println!(\"\\n⚠️ Error Handling Examples\");\r\n    println!(\"==========================\");\r\n\r\n    // Invalid tag paths\r\n    let invalid_paths = vec![\r\n        \"\",                       // Empty path\r\n        \"Program:\",               // Incomplete program path\r\n        \"MyArray[\",               // Unclosed bracket\r\n        \"MyArray]\",               // Missing opening bracket\r\n        \"MyTag.\",                 // Trailing dot\r\n        \"Program:Main.Tag[1,2,]\", // Trailing comma\r\n        \"MyTag.99\",               // Invalid bit index (\u003e31)\r\n    ];\r\n\r\n    for invalid_path in invalid_paths {\r\n        match TagPath::parse(invalid_path) {\r\n            Ok(_) =\u003e println!(\"   ❌ Unexpectedly parsed: '{}'\", invalid_path),\r\n            Err(e) =\u003e println!(\"   ✅ Correctly rejected '{}': {}\", invalid_path, e),\r\n        }\r\n    }\r\n\r\n    Ok(())\r\n}\r\n\r\n/// Demonstrates performance characteristics\r\n#[allow(dead_code)]\r\nasync fn demonstrate_performance() -\u003e Result\u003c(), Box\u003cdyn Error\u003e\u003e {\r\n    println!(\"\\n⚡ Performance Demonstration\");\r\n    println!(\"============================\");\r\n\r\n    let test_paths = vec![\r\n        \"SimpleTag\",\r\n        \"Program:MainProgram.ComplexTag\",\r\n        \"Program:Production.Lines[5].Stations[10].Motors[2].Status.15\",\r\n        \"Recipe.Steps[1].Parameters.Temperature.Setpoint\",\r\n        \"Program:Safety.Zones[3].Devices[7].Inputs.Emergency.LEN\",\r\n    ];\r\n\r\n    let start = std::time::Instant::now();\r\n\r\n    for _ in 0..1000 {\r\n        for path_str in \u0026test_paths {\r\n            let _path = TagPath::parse(path_str)?;\r\n        }\r\n    }\r\n\r\n    let duration = start.elapsed();\r\n    let ops_per_sec = (1000 * test_paths.len()) as f64 / duration.as_secs_f64();\r\n\r\n    println!(\r\n        \"   Parsed {} paths in {:?}\",\r\n        1000 * test_paths.len(),\r\n        duration\r\n    );\r\n    println!(\"   Performance: {:.0} parses/second\", ops_per_sec);\r\n\r\n    Ok(())\r\n}\r\n\r\n#[cfg(test)]\r\nmod tests {\r\n    use super::*;\r\n\r\n    #[tokio::test]\r\n    async fn test_tag_path_examples() {\r\n        // Test that all examples in the demonstration work\r\n        assert!(demonstrate_tag_path_parsing().await.is_ok());\r\n    }\r\n\r\n    #[test]\r\n    fn test_specific_tag_patterns() {\r\n        // Test specific patterns that are common in industrial applications\r\n\r\n        // HMI tags\r\n        assert!(TagPath::parse(\"HMI_StartButton\").is_ok());\r\n        assert!(TagPath::parse(\"Program:HMI.Screens[1].Buttons[5].Pressed\").is_ok());\r\n\r\n        // Motion control\r\n        assert!(TagPath::parse(\"Program:Motion.Axis1.Position\").is_ok());\r\n        assert!(TagPath::parse(\"Program:Motion.Axis1.Status.15\").is_ok());\r\n\r\n        // Safety systems\r\n        assert!(TagPath::parse(\"Program:Safety.Zone1.LightCurtain.Broken\").is_ok());\r\n        assert!(TagPath::parse(\"Program:Safety.EmergencyStops[3].Pressed\").is_ok());\r\n\r\n        // Process control\r\n        assert!(TagPath::parse(\"Program:Process.Tank1.Level.PV\").is_ok());\r\n        assert!(TagPath::parse(\"Program:Process.Pumps[2].Speed.SP\").is_ok());\r\n\r\n        // Recipe management\r\n        assert!(TagPath::parse(\"Program:Recipe.Active.Steps[5].Time\").is_ok());\r\n        assert!(TagPath::parse(\"Program:Recipe.Library[10].Name.LEN\").is_ok());\r\n    }\r\n}\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","sheco","projects","rust-ethernet-ip","examples","batch_benchmark.rs"],"content":"use rust_ethernet_ip::{BatchOperation, EipClient, PlcValue};\r\nuse std::time::Instant;\r\n\r\n#[tokio::main]\r\nasync fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\r\n    println!(\"🚀 Rust EtherNet/IP Batch Operations Benchmark\");\r\n    println!(\"================================================\");\r\n\r\n    // Connect to PLC\r\n    let mut client = EipClient::new(\"192.168.0.1:44818\").await?;\r\n    println!(\"✅ Connected to PLC successfully!\");\r\n\r\n    // Define test tags\r\n    let test_tags = vec![\r\n        \"ProductionCount\",\r\n        \"Temperature_1\",\r\n        \"Temperature_2\",\r\n        \"Pressure_1\",\r\n        \"FlowRate\",\r\n        \"SetPoint_1\",\r\n        \"SetPoint_2\",\r\n        \"EnableFlag\",\r\n        \"ProductionMode\",\r\n        \"RecipeNumber\",\r\n    ];\r\n\r\n    println!(\"\\\\n📊 Benchmark: Reading {} tags\", test_tags.len());\r\n    println!(\"===================================================\");\r\n\r\n    // Benchmark individual operations\r\n    println!(\"\\\\n🐌 Individual Operations:\");\r\n    println!(\"-------------------------\");\r\n    let start = Instant::now();\r\n    let mut individual_results = Vec::new();\r\n\r\n    for tag in \u0026test_tags {\r\n        let tag_start = Instant::now();\r\n        match client.read_tag(tag).await {\r\n            Ok(value) =\u003e {\r\n                let duration = tag_start.elapsed();\r\n                individual_results.push((tag.to_string(), Ok(value), duration));\r\n                println!(\r\n                    \"  📊 {}: {:?} ({:.2}ms)\",\r\n                    tag,\r\n                    individual_results.last().unwrap().1.as_ref().unwrap(),\r\n                    duration.as_secs_f64() * 1000.0\r\n                );\r\n            }\r\n            Err(e) =\u003e {\r\n                let duration = tag_start.elapsed();\r\n                individual_results.push((tag.to_string(), Err(e.to_string()), duration));\r\n                println!(\r\n                    \"  ❌ {}: Error ({:.2}ms)\",\r\n                    tag,\r\n                    duration.as_secs_f64() * 1000.0\r\n                );\r\n            }\r\n        }\r\n    }\r\n    let individual_total = start.elapsed();\r\n\r\n    // Benchmark batch operations\r\n    println!(\"\\\\n🚀 Batch Operations:\");\r\n    println!(\"--------------------\");\r\n    let operations: Vec\u003cBatchOperation\u003e = test_tags\r\n        .iter()\r\n        .map(|tag| BatchOperation::Read {\r\n            tag_name: tag.to_string(),\r\n        })\r\n        .collect();\r\n\r\n    let batch_start = Instant::now();\r\n    let batch_results = client.execute_batch(\u0026operations).await?;\r\n    let batch_total = batch_start.elapsed();\r\n\r\n    for batch_result in \u0026batch_results {\r\n        let tag_name = match \u0026batch_result.operation {\r\n            BatchOperation::Read { tag_name } =\u003e tag_name,\r\n            BatchOperation::Write { tag_name, .. } =\u003e tag_name,\r\n        };\r\n        match \u0026batch_result.result {\r\n            Ok(Some(value)) =\u003e println!(\"  📊 {}: {:?}\", tag_name, value),\r\n            Ok(None) =\u003e println!(\"  📊 {}: Success (write)\", tag_name),\r\n            Err(e) =\u003e println!(\"  ❌ {}: {}\", tag_name, e),\r\n        }\r\n    }\r\n\r\n    // Performance comparison\r\n    println!(\"\\\\n⚡ Performance Comparison:\");\r\n    println!(\"==========================\");\r\n    println!(\r\n        \"  Individual operations: {:.2}ms\",\r\n        individual_total.as_secs_f64() * 1000.0\r\n    );\r\n    println!(\r\n        \"  Batch operations:      {:.2}ms\",\r\n        batch_total.as_secs_f64() * 1000.0\r\n    );\r\n\r\n    let speedup = individual_total.as_secs_f64() / batch_total.as_secs_f64();\r\n    println!(\"  📈 Speedup:             {:.1}x faster\", speedup);\r\n\r\n    let saved_time = individual_total.saturating_sub(batch_total);\r\n    println!(\r\n        \"  ⏱️  Time saved:          {:.2}ms\",\r\n        saved_time.as_secs_f64() * 1000.0\r\n    );\r\n\r\n    // Extended benchmark with different batch sizes\r\n    println!(\"\\\\n🔬 Extended Benchmark: Batch Size Impact\");\r\n    println!(\"=========================================\");\r\n\r\n    let extended_tags: Vec\u003cString\u003e = (1..=100).map(|i| format!(\"TestTag_{:03}\", i)).collect();\r\n\r\n    for \u0026batch_size in \u0026[1, 5, 10, 20, 50] {\r\n        println!(\"\\\\n📊 Testing batch size: {}\", batch_size);\r\n\r\n        let num_operations = batch_size.min(extended_tags.len());\r\n        let test_operations: Vec\u003cBatchOperation\u003e = extended_tags\r\n            .iter()\r\n            .take(num_operations)\r\n            .map(|tag| BatchOperation::Read {\r\n                tag_name: tag.clone(),\r\n            })\r\n            .collect();\r\n\r\n        // Measure batch performance\r\n        let start = Instant::now();\r\n        let _results = client.execute_batch(\u0026test_operations).await;\r\n        let batch_time = start.elapsed();\r\n\r\n        println!(\r\n            \"  ⏱️  {} operations in {:.2}ms ({:.2}ms per operation)\",\r\n            num_operations,\r\n            batch_time.as_secs_f64() * 1000.0,\r\n            batch_time.as_secs_f64() * 1000.0 / num_operations as f64\r\n        );\r\n    }\r\n\r\n    // Write benchmark\r\n    println!(\"\\\\n✏️  Write Operations Benchmark\");\r\n    println!(\"===============================\");\r\n\r\n    let write_operations = vec![\r\n        BatchOperation::Write {\r\n            tag_name: \"TestWrite_1\".to_string(),\r\n            value: PlcValue::Dint(42),\r\n        },\r\n        BatchOperation::Write {\r\n            tag_name: \"TestWrite_2\".to_string(),\r\n            value: PlcValue::Real(3.14),\r\n        },\r\n        BatchOperation::Write {\r\n            tag_name: \"TestWrite_3\".to_string(),\r\n            value: PlcValue::Bool(true),\r\n        },\r\n    ];\r\n\r\n    println!(\"\\\\n🐌 Individual writes:\");\r\n    let start = Instant::now();\r\n    for op in \u0026write_operations {\r\n        let tag_start = Instant::now();\r\n        match op {\r\n            BatchOperation::Write { tag_name, value } =\u003e {\r\n                match client.write_tag(tag_name, value.clone()).await {\r\n                    Ok(_) =\u003e println!(\r\n                        \"  ✅ {}: Success ({:.2}ms)\",\r\n                        tag_name,\r\n                        tag_start.elapsed().as_secs_f64() * 1000.0\r\n                    ),\r\n                    Err(e) =\u003e println!(\r\n                        \"  ❌ {}: {} ({:.2}ms)\",\r\n                        tag_name,\r\n                        e,\r\n                        tag_start.elapsed().as_secs_f64() * 1000.0\r\n                    ),\r\n                }\r\n            }\r\n            _ =\u003e unreachable!(\"Should only have write operations\"),\r\n        }\r\n    }\r\n    let individual_write_time = start.elapsed();\r\n\r\n    println!(\"\\\\n🚀 Batch writes:\");\r\n    let batch_start = Instant::now();\r\n    let batch_write_results = client.execute_batch(\u0026write_operations).await?;\r\n    let batch_write_time = batch_start.elapsed();\r\n\r\n    for batch_result in batch_write_results {\r\n        let tag_name = match \u0026batch_result.operation {\r\n            BatchOperation::Write { tag_name, .. } =\u003e tag_name,\r\n            _ =\u003e unreachable!(\"Should only have write operations\"),\r\n        };\r\n        match batch_result.result {\r\n            Ok(None) =\u003e println!(\"  ✅ {}: Success\", tag_name),\r\n            Ok(Some(_)) =\u003e println!(\"  ⚠️  {}: Unexpected value result\", tag_name),\r\n            Err(e) =\u003e println!(\"  ❌ {}: {}\", tag_name, e),\r\n        }\r\n    }\r\n\r\n    println!(\"\\\\n⚡ Write Performance:\");\r\n    println!(\r\n        \"  Individual writes: {:.2}ms\",\r\n        individual_write_time.as_secs_f64() * 1000.0\r\n    );\r\n    println!(\r\n        \"  Batch writes:      {:.2}ms\",\r\n        batch_write_time.as_secs_f64() * 1000.0\r\n    );\r\n    let write_speedup = individual_write_time.as_secs_f64() / batch_write_time.as_secs_f64();\r\n    println!(\"  📈 Write speedup:   {:.1}x faster\", write_speedup);\r\n\r\n    // Mixed operations benchmark\r\n    println!(\"\\\\n🔄 Mixed Operations Benchmark\");\r\n    println!(\"==============================\");\r\n\r\n    let mixed_operations = vec![\r\n        BatchOperation::Read {\r\n            tag_name: \"ReadTest_1\".to_string(),\r\n        },\r\n        BatchOperation::Write {\r\n            tag_name: \"WriteTest_1\".to_string(),\r\n            value: PlcValue::Dint(100),\r\n        },\r\n        BatchOperation::Read {\r\n            tag_name: \"ReadTest_2\".to_string(),\r\n        },\r\n        BatchOperation::Write {\r\n            tag_name: \"WriteTest_2\".to_string(),\r\n            value: PlcValue::Real(25.5),\r\n        },\r\n    ];\r\n\r\n    let mixed_start = Instant::now();\r\n    let mixed_results = client.execute_batch(\u0026mixed_operations).await?;\r\n    let mixed_time = mixed_start.elapsed();\r\n\r\n    println!(\"\\\\n🔄 Mixed batch results:\");\r\n    for batch_result in mixed_results {\r\n        let tag_name = match \u0026batch_result.operation {\r\n            BatchOperation::Read { tag_name } =\u003e tag_name,\r\n            BatchOperation::Write { tag_name, .. } =\u003e tag_name,\r\n        };\r\n        match batch_result.result {\r\n            Ok(Some(value)) =\u003e println!(\"  📊 {}: {:?}\", tag_name, value),\r\n            Ok(None) =\u003e println!(\"  ✅ {}: Success (write)\", tag_name),\r\n            Err(e) =\u003e println!(\"  ❌ {}: {}\", tag_name, e),\r\n        }\r\n    }\r\n    println!(\r\n        \"  ⏱️  Mixed operations completed in {:.2}ms\",\r\n        mixed_time.as_secs_f64() * 1000.0\r\n    );\r\n\r\n    println!(\"\\\\n🎉 Benchmark completed successfully!\");\r\n    Ok(())\r\n}\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","sheco","projects","rust-ethernet-ip","examples","batch_operations.rs"],"content":"// examples/batch_operations.rs - Comprehensive Batch Operations Example\r\n// ================================================================\r\n//\r\n// This example demonstrates the powerful batch operations feature added in v0.4.0.\r\n// Batch operations provide massive performance improvements by grouping multiple\r\n// read/write operations into single network packets.\r\n//\r\n// Performance Comparison:\r\n// - Individual operations: 1,500 operations/second\r\n// - Batch operations: 5,000-15,000+ operations/second (3-10x improvement)\r\n//\r\n// Use cases:\r\n// - SCADA systems reading many sensors\r\n// - Real-time monitoring dashboards\r\n// - Data logging applications\r\n// - Industrial automation control loops\r\n\r\nuse rust_ethernet_ip::{BatchConfig, BatchError, BatchOperation, PlcValue};\r\nuse std::time::Instant;\r\nuse tokio::time::{sleep, Duration};\r\n\r\n#[tokio::main]\r\nasync fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error + Send + Sync\u003e\u003e {\r\n    println!(\"🚀 Rust EtherNet/IP Batch Operations Example\");\r\n    println!(\"==============================================\");\r\n\r\n    // For this example, we'll simulate PLC connection\r\n    // In real usage, replace with your PLC's IP address\r\n    println!(\"📡 Connecting to PLC...\");\r\n    // let mut client = EipClient::connect(\"192.168.1.100:44818\").await?;\r\n    println!(\"✅ Connection established (simulated)\");\r\n\r\n    // For demonstration, we'll create a mock client\r\n    // In real code, use the line above\r\n    println!(\"\\n🔧 Note: This example simulates PLC operations for demonstration\");\r\n    println!(\"   Replace the connection line with your actual PLC IP address\\n\");\r\n\r\n    // Example 1: Basic batch read operations\r\n    demo_batch_reads().await?;\r\n\r\n    // Example 2: Basic batch write operations\r\n    demo_batch_writes().await?;\r\n\r\n    // Example 3: Mixed read/write operations\r\n    demo_mixed_batch().await?;\r\n\r\n    // Example 4: Performance comparison\r\n    demo_performance_comparison().await?;\r\n\r\n    // Example 5: Advanced configuration\r\n    demo_advanced_configuration().await?;\r\n\r\n    // Example 6: Error handling\r\n    demo_error_handling().await?;\r\n\r\n    // Example 7: Real-world scenarios\r\n    demo_real_world_scenarios().await?;\r\n\r\n    println!(\"🎉 All batch operation examples completed successfully!\");\r\n    println!(\"\\n📋 Summary:\");\r\n    println!(\"   - Batch operations provide 3-10x performance improvement\");\r\n    println!(\"   - Ideal for reading/writing many tags at once\");\r\n    println!(\"   - Configurable for different PLC capabilities\");\r\n    println!(\"   - Robust error handling for production use\");\r\n\r\n    Ok(())\r\n}\r\n\r\n/// Demonstrates basic batch read operations\r\nasync fn demo_batch_reads() -\u003e Result\u003c(), Box\u003cdyn std::error::Error + Send + Sync\u003e\u003e {\r\n    println!(\"📖 Example 1: Batch Read Operations\");\r\n    println!(\"===================================\");\r\n\r\n    // Simulated for demo - in real code, use actual client\r\n    // let mut client = get_mock_client().await?;\r\n\r\n    // Define tags to read (typical industrial monitoring scenario)\r\n    let sensor_tags = [\r\n        \"Temperature_Zone1\",\r\n        \"Temperature_Zone2\",\r\n        \"Temperature_Zone3\",\r\n        \"Pressure_Main\",\r\n        \"Flow_Rate_1\",\r\n        \"Flow_Rate_2\",\r\n        \"Motor1_Speed\",\r\n        \"Motor2_Speed\",\r\n        \"Valve_Position_1\",\r\n        \"Valve_Position_2\",\r\n    ];\r\n\r\n    println!(\r\n        \"📊 Reading {} sensor values in a single batch operation...\",\r\n        sensor_tags.len()\r\n    );\r\n\r\n    let start_time = Instant::now();\r\n\r\n    // In real code with actual client:\r\n    // let results = client.read_tags_batch(\u0026sensor_tags).await?;\r\n\r\n    // Simulated results for demo\r\n    let simulated_results = simulate_batch_read_results(\u0026sensor_tags);\r\n\r\n    let elapsed = start_time.elapsed();\r\n\r\n    println!(\"⏱️  Batch read completed in {:?}\", elapsed);\r\n    println!(\"📈 Results:\");\r\n\r\n    for (tag_name, result) in simulated_results {\r\n        match result {\r\n            Ok(value) =\u003e println!(\"   ✅ {}: {:?}\", tag_name, value),\r\n            Err(e) =\u003e println!(\"   ❌ {}: Error - {}\", tag_name, e),\r\n        }\r\n    }\r\n\r\n    println!(\r\n        \"🔍 Performance: {} tags read in a single network operation\",\r\n        sensor_tags.len()\r\n    );\r\n    println!(\r\n        \"   vs {} separate network calls with individual reads\\n\",\r\n        sensor_tags.len()\r\n    );\r\n\r\n    Ok(())\r\n}\r\n\r\n/// Demonstrates basic batch write operations\r\nasync fn demo_batch_writes() -\u003e Result\u003c(), Box\u003cdyn std::error::Error + Send + Sync\u003e\u003e {\r\n    println!(\"✏️  Example 2: Batch Write Operations\");\r\n    println!(\"=====================================\");\r\n\r\n    // Define setpoints to write (typical control scenario)\r\n    let setpoints = vec![\r\n        (\"Temperature_Setpoint_1\", PlcValue::Real(75.5)),\r\n        (\"Temperature_Setpoint_2\", PlcValue::Real(80.0)),\r\n        (\"Pressure_Setpoint\", PlcValue::Real(150.0)),\r\n        (\"Motor1_Speed_Setpoint\", PlcValue::Dint(1800)),\r\n        (\"Motor2_Speed_Setpoint\", PlcValue::Dint(1950)),\r\n        (\"Enable_Production\", PlcValue::Bool(true)),\r\n        (\"Safety_Override\", PlcValue::Bool(false)),\r\n        (\"Recipe_Number\", PlcValue::Dint(42)),\r\n        (\"Batch_Size\", PlcValue::Dint(1000)),\r\n        (\"Quality_Target\", PlcValue::Real(99.5)),\r\n    ];\r\n\r\n    println!(\r\n        \"🎯 Writing {} setpoints in a single batch operation...\",\r\n        setpoints.len()\r\n    );\r\n\r\n    let start_time = Instant::now();\r\n\r\n    // In real code with actual client:\r\n    // let results = client.write_tags_batch(\u0026setpoints).await?;\r\n\r\n    // Simulated results for demo\r\n    let simulated_results = simulate_batch_write_results(\u0026setpoints);\r\n\r\n    let elapsed = start_time.elapsed();\r\n\r\n    println!(\"⏱️  Batch write completed in {:?}\", elapsed);\r\n    println!(\"📈 Results:\");\r\n\r\n    for (tag_name, result) in simulated_results {\r\n        match result {\r\n            Ok(_) =\u003e println!(\"   ✅ {}: Write successful\", tag_name),\r\n            Err(e) =\u003e println!(\"   ❌ {}: Write failed - {}\", tag_name, e),\r\n        }\r\n    }\r\n\r\n    println!(\r\n        \"🚀 Performance: {} setpoints written atomically\",\r\n        setpoints.len()\r\n    );\r\n    println!(\"   Ensures consistent control state across all parameters\\n\");\r\n\r\n    Ok(())\r\n}\r\n\r\n/// Demonstrates mixed read/write operations in a single batch\r\nasync fn demo_mixed_batch() -\u003e Result\u003c(), Box\u003cdyn std::error::Error + Send + Sync\u003e\u003e {\r\n    println!(\"🔄 Example 3: Mixed Read/Write Batch Operations\");\r\n    println!(\"===============================================\");\r\n\r\n    // Realistic industrial automation scenario: read sensors, write control outputs\r\n    let operations = vec![\r\n        // Read current sensor values\r\n        BatchOperation::Read {\r\n            tag_name: \"Tank_Level\".to_string(),\r\n        },\r\n        BatchOperation::Read {\r\n            tag_name: \"Tank_Temperature\".to_string(),\r\n        },\r\n        BatchOperation::Read {\r\n            tag_name: \"Pump_Status\".to_string(),\r\n        },\r\n        BatchOperation::Read {\r\n            tag_name: \"Emergency_Stop\".to_string(),\r\n        },\r\n        // Write control commands based on logic (normally calculated from reads)\r\n        BatchOperation::Write {\r\n            tag_name: \"Heater_Output\".to_string(),\r\n            value: PlcValue::Real(75.0),\r\n        },\r\n        BatchOperation::Write {\r\n            tag_name: \"Pump_Speed\".to_string(),\r\n            value: PlcValue::Dint(1500),\r\n        },\r\n        BatchOperation::Write {\r\n            tag_name: \"Valve_Position\".to_string(),\r\n            value: PlcValue::Real(45.5),\r\n        },\r\n        BatchOperation::Write {\r\n            tag_name: \"Status_Light\".to_string(),\r\n            value: PlcValue::Bool(true),\r\n        },\r\n    ];\r\n\r\n    println!(\r\n        \"🎭 Executing mixed batch: {} reads + {} writes...\",\r\n        operations\r\n            .iter()\r\n            .filter(|op| matches!(op, BatchOperation::Read { .. }))\r\n            .count(),\r\n        operations\r\n            .iter()\r\n            .filter(|op| matches!(op, BatchOperation::Write { .. }))\r\n            .count()\r\n    );\r\n\r\n    let start_time = Instant::now();\r\n\r\n    // In real code with actual client:\r\n    // let results = client.execute_batch(\u0026operations).await?;\r\n\r\n    // Simulated results for demo\r\n    let simulated_results = simulate_mixed_batch_results(\u0026operations);\r\n\r\n    let elapsed = start_time.elapsed();\r\n\r\n    println!(\"⏱️  Mixed batch completed in {:?}\", elapsed);\r\n    println!(\"📈 Results:\");\r\n\r\n    for result in simulated_results {\r\n        match \u0026result.operation {\r\n            BatchOperation::Read { tag_name } =\u003e match result.result {\r\n                Ok(Some(value)) =\u003e println!(\"   📖 READ  {}: {:?}\", tag_name, value),\r\n                Ok(None) =\u003e println!(\"   ⚠️  READ  {}: Unexpected None result\", tag_name),\r\n                Err(e) =\u003e println!(\"   ❌ READ  {}: Error - {}\", tag_name, e),\r\n            },\r\n            BatchOperation::Write { tag_name, value } =\u003e match result.result {\r\n                Ok(None) =\u003e println!(\"   ✏️  WRITE {}: {:?} ✅\", tag_name, value),\r\n                Ok(Some(_)) =\u003e println!(\"   ⚠️  WRITE {}: Unexpected value result\", tag_name),\r\n                Err(e) =\u003e println!(\"   ❌ WRITE {}: Error - {}\", tag_name, e),\r\n            },\r\n        }\r\n    }\r\n\r\n    println!(\"🎯 Benefits: Atomic operation ensures consistent read/write timing\");\r\n    println!(\"   Critical for control loops and safety systems\\n\");\r\n\r\n    Ok(())\r\n}\r\n\r\n/// Demonstrates performance comparison between individual and batch operations\r\nasync fn demo_performance_comparison() -\u003e Result\u003c(), Box\u003cdyn std::error::Error + Send + Sync\u003e\u003e {\r\n    println!(\"⚡ Example 4: Performance Comparison\");\r\n    println!(\"====================================\");\r\n\r\n    let tag_count = 50;\r\n    let _tags: Vec\u003cString\u003e = (1..=tag_count)\r\n        .map(|i| format!(\"Sensor_{:03}\", i))\r\n        .collect();\r\n\r\n    println!(\"📊 Comparing performance for {} tag reads:\", tag_count);\r\n\r\n    // Simulate individual operations\r\n    println!(\"\\n🐌 Simulating individual read operations...\");\r\n    let individual_start = Instant::now();\r\n\r\n    // In real code, this would be:\r\n    // for tag in \u0026tags {\r\n    //     let _value = client.read_tag(tag).await?;\r\n    // }\r\n\r\n    // Simulate network latency for individual operations (1-3ms each)\r\n    for i in 0..tag_count {\r\n        sleep(Duration::from_millis(2)).await; // Simulate 2ms per operation\r\n        if i % 10 == 0 {\r\n            println!(\"   Read {} tags...\", i + 1);\r\n        }\r\n    }\r\n\r\n    let individual_elapsed = individual_start.elapsed();\r\n\r\n    // Simulate batch operation\r\n    println!(\"\\n🚀 Simulating batch read operation...\");\r\n    let batch_start = Instant::now();\r\n\r\n    // In real code, this would be:\r\n    // let tag_refs: Vec\u003c\u0026str\u003e = tags.iter().map(|s| s.as_str()).collect();\r\n    // let _results = client.read_tags_batch(\u0026tag_refs).await?;\r\n\r\n    // Simulate single batch operation (5-20ms total)\r\n    sleep(Duration::from_millis(10)).await; // Simulate 10ms for entire batch\r\n\r\n    let batch_elapsed = batch_start.elapsed();\r\n\r\n    println!(\"📈 Performance Results:\");\r\n    println!(\r\n        \"   Individual operations: {:?} ({:.1}ms per tag)\",\r\n        individual_elapsed,\r\n        individual_elapsed.as_millis() as f64 / tag_count as f64\r\n    );\r\n    println!(\r\n        \"   Batch operation:       {:?} ({:.1}ms per tag)\",\r\n        batch_elapsed,\r\n        batch_elapsed.as_millis() as f64 / tag_count as f64\r\n    );\r\n\r\n    let speedup = individual_elapsed.as_millis() as f64 / batch_elapsed.as_millis() as f64;\r\n    println!(\r\n        \"   🏆 Speedup: {:.1}x faster with batch operations!\",\r\n        speedup\r\n    );\r\n    println!(\r\n        \"   📡 Network efficiency: {} packets vs 1 packet\",\r\n        tag_count\r\n    );\r\n\r\n    println!(\"\\n🔍 Real-world impact:\");\r\n    println!(\"   - SCADA systems: Update dashboards 5-10x faster\");\r\n    println!(\"   - Data logging: Collect more samples per second\");\r\n    println!(\"   - Control loops: Faster response times\");\r\n    println!(\"   - Network usage: Reduced bandwidth and traffic\\n\");\r\n\r\n    Ok(())\r\n}\r\n\r\n/// Demonstrates advanced batch configuration options\r\nasync fn demo_advanced_configuration() -\u003e Result\u003c(), Box\u003cdyn std::error::Error + Send + Sync\u003e\u003e {\r\n    println!(\"⚙️  Example 5: Advanced Batch Configuration\");\r\n    println!(\"===========================================\");\r\n\r\n    // Show different configuration scenarios\r\n\r\n    // Configuration 1: High-performance setup\r\n    let high_perf_config = BatchConfig {\r\n        max_operations_per_packet: 50,\r\n        max_packet_size: 1500,\r\n        packet_timeout_ms: 5000,\r\n        continue_on_error: true,\r\n        optimize_packet_packing: true,\r\n    };\r\n\r\n    println!(\"🏁 High-Performance Configuration:\");\r\n    println!(\r\n        \"   - Max operations per packet: {}\",\r\n        high_perf_config.max_operations_per_packet\r\n    );\r\n    println!(\r\n        \"   - Max packet size: {} bytes\",\r\n        high_perf_config.max_packet_size\r\n    );\r\n    println!(\"   - Timeout: {}ms\", high_perf_config.packet_timeout_ms);\r\n    println!(\r\n        \"   - Continue on error: {}\",\r\n        high_perf_config.continue_on_error\r\n    );\r\n    println!(\r\n        \"   - Optimize packing: {}\",\r\n        high_perf_config.optimize_packet_packing\r\n    );\r\n    println!(\"   Use case: Modern PLCs with Ethernet backbone\");\r\n\r\n    // Configuration 2: Conservative setup for older PLCs\r\n    let conservative_config = BatchConfig {\r\n        max_operations_per_packet: 10,\r\n        max_packet_size: 504,\r\n        packet_timeout_ms: 10000,\r\n        continue_on_error: false,\r\n        optimize_packet_packing: false,\r\n    };\r\n\r\n    println!(\"\\n🐢 Conservative Configuration:\");\r\n    println!(\r\n        \"   - Max operations per packet: {}\",\r\n        conservative_config.max_operations_per_packet\r\n    );\r\n    println!(\r\n        \"   - Max packet size: {} bytes\",\r\n        conservative_config.max_packet_size\r\n    );\r\n    println!(\"   - Timeout: {}ms\", conservative_config.packet_timeout_ms);\r\n    println!(\r\n        \"   - Continue on error: {}\",\r\n        conservative_config.continue_on_error\r\n    );\r\n    println!(\r\n        \"   - Optimize packing: {}\",\r\n        conservative_config.optimize_packet_packing\r\n    );\r\n    println!(\"   Use case: Older PLCs or unreliable networks\");\r\n\r\n    // Configuration 3: Balanced setup\r\n    let balanced_config = BatchConfig::default();\r\n\r\n    println!(\"\\n⚖️  Balanced Configuration (Default):\");\r\n    println!(\r\n        \"   - Max operations per packet: {}\",\r\n        balanced_config.max_operations_per_packet\r\n    );\r\n    println!(\r\n        \"   - Max packet size: {} bytes\",\r\n        balanced_config.max_packet_size\r\n    );\r\n    println!(\"   - Timeout: {}ms\", balanced_config.packet_timeout_ms);\r\n    println!(\r\n        \"   - Continue on error: {}\",\r\n        balanced_config.continue_on_error\r\n    );\r\n    println!(\r\n        \"   - Optimize packing: {}\",\r\n        balanced_config.optimize_packet_packing\r\n    );\r\n    println!(\"   Use case: Most industrial applications\");\r\n\r\n    // In real code, apply configuration:\r\n    // client.configure_batch_operations(high_perf_config);\r\n\r\n    println!(\"\\n💡 Configuration Tips:\");\r\n    println!(\"   - Start with default settings\");\r\n    println!(\"   - Increase packet size for modern PLCs\");\r\n    println!(\"   - Reduce operations per packet for reliability\");\r\n    println!(\"   - Enable continue_on_error for monitoring apps\");\r\n    println!(\"   - Disable optimize_packing to preserve operation order\\n\");\r\n\r\n    Ok(())\r\n}\r\n\r\n/// Demonstrates error handling in batch operations\r\nasync fn demo_error_handling() -\u003e Result\u003c(), Box\u003cdyn std::error::Error + Send + Sync\u003e\u003e {\r\n    println!(\"🛡️  Example 6: Error Handling in Batch Operations\");\r\n    println!(\"==================================================\");\r\n\r\n    // Simulate operations with some failures\r\n    let operations = vec![\r\n        BatchOperation::Read {\r\n            tag_name: \"ValidTag1\".to_string(),\r\n        },\r\n        BatchOperation::Read {\r\n            tag_name: \"InvalidTag\".to_string(),\r\n        }, // Will fail\r\n        BatchOperation::Read {\r\n            tag_name: \"ValidTag2\".to_string(),\r\n        },\r\n        BatchOperation::Write {\r\n            tag_name: \"ReadOnlyTag\".to_string(), // Will fail\r\n            value: PlcValue::Dint(100),\r\n        },\r\n        BatchOperation::Write {\r\n            tag_name: \"ValidWriteTag\".to_string(),\r\n            value: PlcValue::Bool(true),\r\n        },\r\n    ];\r\n\r\n    println!(\"🎭 Executing batch with intentional errors to demonstrate handling...\");\r\n\r\n    // In real code:\r\n    // let results = client.execute_batch(\u0026operations).await?;\r\n\r\n    // Simulate mixed success/failure results\r\n    let simulated_results = simulate_error_scenarios(\u0026operations);\r\n\r\n    println!(\"📊 Processing results with error handling:\");\r\n\r\n    let mut success_count = 0;\r\n    let mut error_count = 0;\r\n\r\n    for (i, result) in simulated_results.iter().enumerate() {\r\n        println!(\r\n            \"\\n   Operation {}: {:?}\",\r\n            i + 1,\r\n            match \u0026result.operation {\r\n                BatchOperation::Read { tag_name } =\u003e format!(\"READ {}\", tag_name),\r\n                BatchOperation::Write { tag_name, .. } =\u003e format!(\"WRITE {}\", tag_name),\r\n            }\r\n        );\r\n\r\n        match \u0026result.result {\r\n            Ok(Some(value)) =\u003e {\r\n                println!(\"     ✅ Success: {:?}\", value);\r\n                success_count += 1;\r\n            }\r\n            Ok(None) =\u003e {\r\n                println!(\"     ✅ Success: Write completed\");\r\n                success_count += 1;\r\n            }\r\n            Err(e) =\u003e {\r\n                println!(\"     ❌ Error: {}\", e);\r\n                error_count += 1;\r\n\r\n                // Demonstrate error-specific handling\r\n                match e {\r\n                    BatchError::TagNotFound(tag) =\u003e {\r\n                        println!(\"       🔍 Recommendation: Check tag name '{}'\", tag);\r\n                    }\r\n                    BatchError::CipError { status, message } =\u003e {\r\n                        println!(\"       🔧 CIP Status: 0x{:02X} - {}\", status, message);\r\n                    }\r\n                    BatchError::DataTypeMismatch { expected, actual } =\u003e {\r\n                        println!(\r\n                            \"       🎯 Type mismatch: expected {}, got {}\",\r\n                            expected, actual\r\n                        );\r\n                    }\r\n                    BatchError::NetworkError(msg) =\u003e {\r\n                        println!(\"       📡 Network issue: {}\", msg);\r\n                    }\r\n                    _ =\u003e {\r\n                        println!(\"       ⚠️  General error occurred\");\r\n                    }\r\n                }\r\n            }\r\n        }\r\n\r\n        println!(\"     ⏱️  Execution time: {}μs\", result.execution_time_us);\r\n    }\r\n\r\n    println!(\"\\n📈 Batch Summary:\");\r\n    println!(\"   Total operations: {}\", operations.len());\r\n    println!(\"   Successful: {} ✅\", success_count);\r\n    println!(\"   Failed: {} ❌\", error_count);\r\n    println!(\r\n        \"   Success rate: {:.1}%\",\r\n        (success_count as f64 / operations.len() as f64) * 100.0\r\n    );\r\n\r\n    println!(\"\\n🎯 Error Handling Benefits:\");\r\n    println!(\"   - Individual operation errors don't stop the batch\");\r\n    println!(\"   - Detailed error information for each operation\");\r\n    println!(\"   - Execution timing for performance analysis\");\r\n    println!(\"   - Configurable continue-on-error behavior\\n\");\r\n\r\n    Ok(())\r\n}\r\n\r\n/// Demonstrates real-world industrial automation scenarios\r\nasync fn demo_real_world_scenarios() -\u003e Result\u003c(), Box\u003cdyn std::error::Error + Send + Sync\u003e\u003e {\r\n    println!(\"🏭 Example 7: Real-World Industrial Scenarios\");\r\n    println!(\"==============================================\");\r\n\r\n    // Scenario 1: Manufacturing line monitoring\r\n    println!(\"🔧 Scenario 1: Manufacturing Line Monitoring\");\r\n    println!(\"   Reading all station status in one batch...\");\r\n\r\n    let manufacturing_tags = [\r\n        \"Station1_PartPresent\",\r\n        \"Station1_CycleTime\",\r\n        \"Station1_Quality\",\r\n        \"Station2_PartPresent\",\r\n        \"Station2_CycleTime\",\r\n        \"Station2_Quality\",\r\n        \"Station3_PartPresent\",\r\n        \"Station3_CycleTime\",\r\n        \"Station3_Quality\",\r\n        \"Station4_PartPresent\",\r\n        \"Station4_CycleTime\",\r\n        \"Station4_Quality\",\r\n        \"Station5_PartPresent\",\r\n        \"Station5_CycleTime\",\r\n        \"Station5_Quality\",\r\n        \"ConveyorSpeed\",\r\n        \"ProductionCount\",\r\n        \"RejectCount\",\r\n    ];\r\n\r\n    let mfg_results = simulate_batch_read_results(\u0026manufacturing_tags);\r\n    println!(\r\n        \"   ✅ Read {} manufacturing parameters in single operation\",\r\n        mfg_results.len()\r\n    );\r\n\r\n    // Scenario 2: HVAC system control\r\n    println!(\"\\n🌡️  Scenario 2: HVAC System Control\");\r\n    println!(\"   Updating all zone setpoints simultaneously...\");\r\n\r\n    let hvac_setpoints = vec![\r\n        (\"Zone1_TempSetpoint\", PlcValue::Real(72.0)),\r\n        (\"Zone1_HumiditySetpoint\", PlcValue::Real(45.0)),\r\n        (\"Zone2_TempSetpoint\", PlcValue::Real(70.0)),\r\n        (\"Zone2_HumiditySetpoint\", PlcValue::Real(50.0)),\r\n        (\"Zone3_TempSetpoint\", PlcValue::Real(74.0)),\r\n        (\"Zone3_HumiditySetpoint\", PlcValue::Real(40.0)),\r\n        (\"SystemEnable\", PlcValue::Bool(true)),\r\n        (\"EconomyMode\", PlcValue::Bool(false)),\r\n    ];\r\n\r\n    let hvac_results = simulate_batch_write_results(\u0026hvac_setpoints);\r\n    println!(\r\n        \"   ✅ Updated {} HVAC parameters atomically\",\r\n        hvac_results.len()\r\n    );\r\n\r\n    // Scenario 3: Safety system monitoring\r\n    println!(\"\\n🚨 Scenario 3: Safety System Monitoring\");\r\n    println!(\"   High-frequency safety status checks...\");\r\n\r\n    let safety_tags = [\r\n        \"EmergencyStop_1\",\r\n        \"EmergencyStop_2\",\r\n        \"EmergencyStop_3\",\r\n        \"LightCurtain_1\",\r\n        \"LightCurtain_2\",\r\n        \"PressureSafety\",\r\n        \"TempSafety_Zone1\",\r\n        \"TempSafety_Zone2\",\r\n        \"GasDetector\",\r\n        \"FireAlarm\",\r\n        \"SmokeDetector\",\r\n        \"VibrationAlarm\",\r\n    ];\r\n\r\n    let safety_results = simulate_batch_read_results(\u0026safety_tags);\r\n    println!(\r\n        \"   ✅ Monitored {} safety systems rapidly\",\r\n        safety_results.len()\r\n    );\r\n\r\n    // Scenario 4: Energy management\r\n    println!(\"\\n⚡ Scenario 4: Energy Management System\");\r\n    println!(\"   Reading power consumption across facility...\");\r\n\r\n    let energy_tags = [\r\n        \"MainPower_kW\",\r\n        \"MainPower_kVAR\",\r\n        \"MainPower_PF\",\r\n        \"Line1_Power\",\r\n        \"Line2_Power\",\r\n        \"Line3_Power\",\r\n        \"HVAC_Power\",\r\n        \"Lighting_Power\",\r\n        \"Compressor_Power\",\r\n        \"UPS_Load\",\r\n        \"Generator_Status\",\r\n        \"PeakDemand\",\r\n    ];\r\n\r\n    let energy_results = simulate_batch_read_results(\u0026energy_tags);\r\n    println!(\r\n        \"   ✅ Collected {} energy parameters for analysis\",\r\n        energy_results.len()\r\n    );\r\n\r\n    println!(\"\\n🏆 Real-World Benefits Summary:\");\r\n    println!(\"   Manufacturing: 5x faster line monitoring → Better OEE\");\r\n    println!(\"   HVAC: Atomic setpoint updates → Improved comfort\");\r\n    println!(\"   Safety: Rapid status checks → Enhanced protection\");\r\n    println!(\"   Energy: Fast data collection → Better optimization\");\r\n\r\n    println!(\"\\n💼 Business Impact:\");\r\n    println!(\"   - Reduced network traffic and PLC load\");\r\n    println!(\"   - Faster response to production issues\");\r\n    println!(\"   - More frequent data collection possible\");\r\n    println!(\"   - Improved system reliability and uptime\\n\");\r\n\r\n    Ok(())\r\n}\r\n\r\n// ============================================================================\r\n// SIMULATION HELPERS (for demonstration without actual PLC)\r\n// ============================================================================\r\n\r\nfn simulate_batch_read_results(tags: \u0026[\u0026str]) -\u003e Vec\u003c(String, Result\u003cPlcValue, BatchError\u003e)\u003e {\r\n    tags.iter()\r\n        .enumerate()\r\n        .map(|(i, \u0026tag)| {\r\n            let result = match i % 10 {\r\n                0..=7 =\u003e Ok(match i % 4 {\r\n                    0 =\u003e PlcValue::Real(20.0 + i as f32 * 1.5),\r\n                    1 =\u003e PlcValue::Dint(1000 + i as i32 * 100),\r\n                    2 =\u003e PlcValue::Bool(i % 2 == 0),\r\n                    _ =\u003e PlcValue::String(format!(\"Status_{}\", i)),\r\n                }),\r\n                8 =\u003e Err(BatchError::TagNotFound(tag.to_string())),\r\n                _ =\u003e Err(BatchError::CipError {\r\n                    status: 0x04,\r\n                    message: \"Path destination unknown\".to_string(),\r\n                }),\r\n            };\r\n            (tag.to_string(), result)\r\n        })\r\n        .collect()\r\n}\r\n\r\nfn simulate_batch_write_results(\r\n    tag_values: \u0026[(\u0026str, PlcValue)],\r\n) -\u003e Vec\u003c(String, Result\u003c(), BatchError\u003e)\u003e {\r\n    tag_values\r\n        .iter()\r\n        .enumerate()\r\n        .map(|(i, (tag, _))| {\r\n            let result = match i % 15 {\r\n                0..=12 =\u003e Ok(()),\r\n                13 =\u003e Err(BatchError::TagNotFound(tag.to_string())),\r\n                _ =\u003e Err(BatchError::CipError {\r\n                    status: 0x0E,\r\n                    message: \"Insufficient data\".to_string(),\r\n                }),\r\n            };\r\n            (tag.to_string(), result)\r\n        })\r\n        .collect()\r\n}\r\n\r\nfn simulate_mixed_batch_results(\r\n    operations: \u0026[BatchOperation],\r\n) -\u003e Vec\u003crust_ethernet_ip::BatchResult\u003e {\r\n    use rust_ethernet_ip::BatchResult;\r\n\r\n    operations\r\n        .iter()\r\n        .enumerate()\r\n        .map(|(i, op)| {\r\n            let result = match i % 8 {\r\n                0..=5 =\u003e match op {\r\n                    BatchOperation::Read { .. } =\u003e Ok(Some(PlcValue::Dint(42 + i as i32))),\r\n                    BatchOperation::Write { .. } =\u003e Ok(None),\r\n                },\r\n                6 =\u003e Err(BatchError::TagNotFound(\"SomeTag\".to_string())),\r\n                _ =\u003e Err(BatchError::NetworkError(\"Timeout\".to_string())),\r\n            };\r\n\r\n            BatchResult {\r\n                operation: op.clone(),\r\n                result,\r\n                execution_time_us: 1000 + (i * 100) as u64,\r\n            }\r\n        })\r\n        .collect()\r\n}\r\n\r\nfn simulate_error_scenarios(operations: \u0026[BatchOperation]) -\u003e Vec\u003crust_ethernet_ip::BatchResult\u003e {\r\n    use rust_ethernet_ip::BatchResult;\r\n\r\n    operations\r\n        .iter()\r\n        .enumerate()\r\n        .map(|(i, op)| {\r\n            let result = match i {\r\n                0 =\u003e Ok(Some(PlcValue::Real(25.5))), // Success\r\n                1 =\u003e Err(BatchError::TagNotFound(\"InvalidTag\".to_string())), // Tag not found\r\n                2 =\u003e Ok(Some(PlcValue::Bool(true))), // Success\r\n                3 =\u003e Err(BatchError::CipError {\r\n                    status: 0x0E,\r\n                    message: \"Attribute not settable\".to_string(),\r\n                }), // Write to read-only tag\r\n                4 =\u003e Ok(None),                       // Successful write\r\n                _ =\u003e Ok(Some(PlcValue::String(\"OK\".to_string()))),\r\n            };\r\n\r\n            BatchResult {\r\n                operation: op.clone(),\r\n                result,\r\n                execution_time_us: 1500 + (i * 200) as u64,\r\n            }\r\n        })\r\n        .collect()\r\n}\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","sheco","projects","rust-ethernet-ip","examples","batch_operations_demo.rs"],"content":"///! # Batch Operations Demo\r\n///!\r\n///! This example demonstrates the powerful batch operations feature of the rust-ethernet-ip library.\r\n///! Batch operations allow you to perform multiple read/write operations in a single network packet,\r\n///! dramatically improving performance for scenarios involving multiple PLC operations.\r\n///!\r\n///! ## Performance Benefits\r\n///!\r\n///! - **3-10x faster** than individual operations\r\n///! - **Reduced network traffic** (1-5 packets instead of N packets for N operations)\r\n///! - **Lower PLC CPU usage** due to fewer connection handling overheads\r\n///! - **Better throughput** for data collection and control applications\r\n///!\r\n///! ## Use Cases\r\n///!\r\n///! - **Data acquisition**: Reading multiple sensor values simultaneously\r\n///! - **Recipe management**: Writing multiple setpoints at once\r\n///! - **Status monitoring**: Reading multiple status flags efficiently\r\n///! - **Coordinated control**: Atomic operations across multiple tags\r\nuse rust_ethernet_ip::EipClient;\r\nuse rust_ethernet_ip::{BatchConfig, BatchOperation, PlcValue};\r\nuse std::time::Instant;\r\nuse tokio;\r\n\r\n#[tokio::main]\r\nasync fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\r\n    println!(\"🚀 Rust EtherNet/IP Batch Operations Demo\");\r\n    println!(\"==========================================\\n\");\r\n\r\n    // For demonstration purposes, we'll use a mock PLC address\r\n    // In real usage, replace with your PLC's IP address\r\n    let plc_address = \"192.168.0.1:44818\";\r\n\r\n    println!(\"📡 Connecting to PLC at {}\", plc_address);\r\n\r\n    // Note: This demo shows the API usage. In a real environment, ensure your PLC is accessible\r\n    match EipClient::connect(plc_address).await {\r\n        Ok(mut client) =\u003e {\r\n            run_batch_operations_demo(\u0026mut client).await?;\r\n        }\r\n        Err(e) =\u003e {\r\n            println!(\"⚠️  Connection failed: {}\", e);\r\n            println!(\r\n                \"📝 This is expected if no PLC is available - showing API usage examples instead\\n\"\r\n            );\r\n            demonstrate_batch_api_usage();\r\n        }\r\n    }\r\n\r\n    Ok(())\r\n}\r\n\r\nasync fn run_batch_operations_demo(\r\n    client: \u0026mut EipClient,\r\n) -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\r\n    println!(\"✅ Connected to PLC successfully!\\n\");\r\n\r\n    // Example 1: Basic Batch Reading\r\n    demo_basic_batch_reading(client).await?;\r\n\r\n    // Example 2: Basic Batch Writing\r\n    demo_basic_batch_writing(client).await?;\r\n\r\n    // Example 3: Mixed Operations (Reads and Writes)\r\n    demo_mixed_operations(client).await?;\r\n\r\n    // Example 4: Performance Comparison\r\n    demo_performance_comparison(client).await?;\r\n\r\n    // Example 5: Advanced Configuration\r\n    demo_advanced_configuration(client).await?;\r\n\r\n    // Example 6: Error Handling\r\n    demo_error_handling(client).await?;\r\n\r\n    println!(\"🎉 All batch operations demos completed successfully!\");\r\n    Ok(())\r\n}\r\n\r\nasync fn demo_basic_batch_reading(\r\n    client: \u0026mut EipClient,\r\n) -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\r\n    println!(\"📖 Demo 1: Basic Batch Reading\");\r\n    println!(\"------------------------------\");\r\n\r\n    let tags_to_read = vec![\r\n        \"ProductionCount\",\r\n        \"Temperature_1\",\r\n        \"Temperature_2\",\r\n        \"Pressure_1\",\r\n        \"FlowRate\",\r\n    ];\r\n\r\n    let start_time = Instant::now();\r\n\r\n    match client.read_tags_batch(\u0026tags_to_read).await {\r\n        Ok(results) =\u003e {\r\n            let duration = start_time.elapsed();\r\n\r\n            println!(\"✅ Read {} tags in {:?}\", results.len(), duration);\r\n            for (tag_name, result) in results {\r\n                match result {\r\n                    Ok(value) =\u003e println!(\"  📊 {}: {:?}\", tag_name, value),\r\n                    Err(error) =\u003e println!(\"  ❌ {}: {}\", tag_name, error),\r\n                }\r\n            }\r\n        }\r\n        Err(e) =\u003e println!(\"❌ Batch read failed: {}\", e),\r\n    }\r\n\r\n    println!();\r\n    Ok(())\r\n}\r\n\r\nasync fn demo_basic_batch_writing(\r\n    client: \u0026mut EipClient,\r\n) -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\r\n    println!(\"✏️  Demo 2: Basic Batch Writing\");\r\n    println!(\"------------------------------\");\r\n\r\n    let tags_to_write = vec![\r\n        (\"SetPoint_1\", PlcValue::Real(75.5)),\r\n        (\"SetPoint_2\", PlcValue::Real(80.0)),\r\n        (\"EnableFlag\", PlcValue::Bool(true)),\r\n        (\"ProductionMode\", PlcValue::Dint(2)),\r\n        (\"RecipeNumber\", PlcValue::Dint(42)),\r\n    ];\r\n\r\n    let start_time = Instant::now();\r\n\r\n    match client.write_tags_batch(\u0026tags_to_write).await {\r\n        Ok(results) =\u003e {\r\n            let duration = start_time.elapsed();\r\n\r\n            println!(\"✅ Wrote {} tags in {:?}\", results.len(), duration);\r\n            for (tag_name, result) in results {\r\n                match result {\r\n                    Ok(()) =\u003e println!(\"  ✅ {}: Write successful\", tag_name),\r\n                    Err(error) =\u003e println!(\"  ❌ {}: {}\", tag_name, error),\r\n                }\r\n            }\r\n        }\r\n        Err(e) =\u003e println!(\"❌ Batch write failed: {}\", e),\r\n    }\r\n\r\n    println!();\r\n    Ok(())\r\n}\r\n\r\nasync fn demo_mixed_operations(client: \u0026mut EipClient) -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\r\n    println!(\"🔄 Demo 3: Mixed Operations (Reads + Writes)\");\r\n    println!(\"--------------------------------------------\");\r\n\r\n    let operations = vec![\r\n        // Read current values\r\n        BatchOperation::Read {\r\n            tag_name: \"CurrentTemp\".to_string(),\r\n        },\r\n        BatchOperation::Read {\r\n            tag_name: \"CurrentPressure\".to_string(),\r\n        },\r\n        // Write new setpoints based on current conditions\r\n        BatchOperation::Write {\r\n            tag_name: \"TempSetpoint\".to_string(),\r\n            value: PlcValue::Real(78.5),\r\n        },\r\n        BatchOperation::Write {\r\n            tag_name: \"PressureSetpoint\".to_string(),\r\n            value: PlcValue::Real(15.2),\r\n        },\r\n        // Update status flags\r\n        BatchOperation::Write {\r\n            tag_name: \"AutoModeEnabled\".to_string(),\r\n            value: PlcValue::Bool(true),\r\n        },\r\n    ];\r\n\r\n    let start_time = Instant::now();\r\n\r\n    match client.execute_batch(\u0026operations).await {\r\n        Ok(results) =\u003e {\r\n            let duration = start_time.elapsed();\r\n\r\n            println!(\"✅ Executed {} operations in {:?}\", results.len(), duration);\r\n            for result in results {\r\n                match result.operation {\r\n                    BatchOperation::Read { tag_name } =\u003e match result.result {\r\n                        Ok(Some(value)) =\u003e println!(\r\n                            \"  📊 Read {}: {:?} ({}μs)\",\r\n                            tag_name, value, result.execution_time_us\r\n                        ),\r\n                        Ok(None) =\u003e println!(\"  ❌ Read {}: No data returned\", tag_name),\r\n                        Err(error) =\u003e println!(\"  ❌ Read {}: {}\", tag_name, error),\r\n                    },\r\n                    BatchOperation::Write { tag_name, .. } =\u003e match result.result {\r\n                        Ok(_) =\u003e println!(\r\n                            \"  ✅ Write {}: Success ({}μs)\",\r\n                            tag_name, result.execution_time_us\r\n                        ),\r\n                        Err(error) =\u003e println!(\"  ❌ Write {}: {}\", tag_name, error),\r\n                    },\r\n                }\r\n            }\r\n        }\r\n        Err(e) =\u003e println!(\"❌ Mixed batch operations failed: {}\", e),\r\n    }\r\n\r\n    println!();\r\n    Ok(())\r\n}\r\n\r\nasync fn demo_performance_comparison(\r\n    client: \u0026mut EipClient,\r\n) -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\r\n    println!(\"⚡ Demo 4: Performance Comparison\");\r\n    println!(\"--------------------------------\");\r\n\r\n    let tags = vec![\r\n        \"Performance_Test_1\",\r\n        \"Performance_Test_2\",\r\n        \"Performance_Test_3\",\r\n        \"Performance_Test_4\",\r\n        \"Performance_Test_5\",\r\n    ];\r\n\r\n    // Individual operations (traditional approach)\r\n    println!(\"🐌 Individual operations:\");\r\n    let individual_start = Instant::now();\r\n\r\n    for tag in \u0026tags {\r\n        match client.read_tag(tag).await {\r\n            Ok(value) =\u003e println!(\"  📊 {}: {:?}\", tag, value),\r\n            Err(e) =\u003e println!(\"  ❌ {}: {}\", tag, e),\r\n        }\r\n    }\r\n\r\n    let individual_duration = individual_start.elapsed();\r\n    println!(\"  ⏱️  Total time: {:?}\", individual_duration);\r\n\r\n    // Batch operations (optimized approach)\r\n    println!(\"\\n🚀 Batch operations:\");\r\n    let batch_start = Instant::now();\r\n\r\n    match client.read_tags_batch(\u0026tags).await {\r\n        Ok(results) =\u003e {\r\n            for (tag_name, result) in results {\r\n                match result {\r\n                    Ok(value) =\u003e println!(\"  📊 {}: {:?}\", tag_name, value),\r\n                    Err(error) =\u003e println!(\"  ❌ {}: {}\", tag_name, error),\r\n                }\r\n            }\r\n        }\r\n        Err(e) =\u003e println!(\"  ❌ Batch failed: {}\", e),\r\n    }\r\n\r\n    let batch_duration = batch_start.elapsed();\r\n    println!(\"  ⏱️  Total time: {:?}\", batch_duration);\r\n\r\n    // Calculate performance improvement\r\n    if batch_duration.as_nanos() \u003e 0 {\r\n        let speedup = individual_duration.as_nanos() as f64 / batch_duration.as_nanos() as f64;\r\n        println!(\r\n            \"\\n📈 Performance improvement: {:.1}x faster with batch operations!\",\r\n            speedup\r\n        );\r\n    }\r\n\r\n    println!();\r\n    Ok(())\r\n}\r\n\r\nasync fn demo_advanced_configuration(\r\n    client: \u0026mut EipClient,\r\n) -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\r\n    println!(\"⚙️  Demo 5: Advanced Configuration\");\r\n    println!(\"----------------------------------\");\r\n\r\n    // Show current configuration\r\n    let current_config = client.get_batch_config();\r\n    println!(\"📋 Current batch configuration:\");\r\n    println!(\r\n        \"  • Max operations per packet: {}\",\r\n        current_config.max_operations_per_packet\r\n    );\r\n    println!(\r\n        \"  • Max packet size: {} bytes\",\r\n        current_config.max_packet_size\r\n    );\r\n    println!(\"  • Packet timeout: {}ms\", current_config.packet_timeout_ms);\r\n    println!(\r\n        \"  • Continue on error: {}\",\r\n        current_config.continue_on_error\r\n    );\r\n    println!(\r\n        \"  • Optimize packet packing: {}\",\r\n        current_config.optimize_packet_packing\r\n    );\r\n\r\n    // Configure for high-performance scenario\r\n    println!(\"\\n🚀 Configuring for high-performance scenario:\");\r\n    let high_perf_config = BatchConfig {\r\n        max_operations_per_packet: 50,\r\n        max_packet_size: 4000,\r\n        packet_timeout_ms: 1000,\r\n        continue_on_error: true,\r\n        optimize_packet_packing: true,\r\n    };\r\n\r\n    client.configure_batch_operations(high_perf_config);\r\n    println!(\"  ✅ Applied high-performance configuration\");\r\n\r\n    // Configure for conservative/reliable scenario\r\n    println!(\"\\n🛡️  Configuring for conservative scenario:\");\r\n    let conservative_config = BatchConfig {\r\n        max_operations_per_packet: 10,\r\n        max_packet_size: 504,\r\n        packet_timeout_ms: 5000,\r\n        continue_on_error: false,\r\n        optimize_packet_packing: false,\r\n    };\r\n\r\n    client.configure_batch_operations(conservative_config);\r\n    println!(\"  ✅ Applied conservative configuration\");\r\n\r\n    // Restore default configuration\r\n    client.configure_batch_operations(BatchConfig::default());\r\n    println!(\"  🔄 Restored default configuration\");\r\n\r\n    println!();\r\n    Ok(())\r\n}\r\n\r\nasync fn demo_error_handling(client: \u0026mut EipClient) -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\r\n    println!(\"🚨 Demo 6: Error Handling\");\r\n    println!(\"-------------------------\");\r\n\r\n    // Test with intentionally problematic operations\r\n    let operations_with_errors = vec![\r\n        BatchOperation::Read {
